name: Android Release

# 打 tag 即发版：git tag v1.0.0 && git push --tags
# 需要仓库 Secrets：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore keystore
        run: |
          mkdir -p keys
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keys/release.jks
          cat > android/key.properties <<EOF
          storeFile=../../keys/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release

      - name: Version
        id: ver
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          echo "name=$V" >> $GITHUB_OUTPUT
          echo "{\"version\":\"$V\",\"apk\":\"https://github.com/${{ github.repository }}/releases/latest/download/shijian-$V.apk\"}" > version.json

      - name: Rename apk
        run: cp build/app/outputs/flutter-apk/app-release.apk "shijian-${{ steps.ver.outputs.name }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          name: 拾间 ${{ steps.ver.outputs.name }}
          body: |
            拾间 ${{ steps.ver.outputs.name }}
            - 应用内更新：打开 App → 我的 → 检查更新
          files: |
            shijian-${{ steps.ver.outputs.name }}.apk
            version.json
