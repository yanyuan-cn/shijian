/* 影视自动匹配：搜索候选 + 点选填入 */
function bindMatch(k){
  const q = $('#matchQ'), go = $('#matchGo'), status = $('#matchStatus'), list = $('#matchList');
  if(!q || !go) return;
  let busy = false;
  async function run(){
    let kw = q.value.trim();
    if(!kw){ toast(k === 'book' ? '先输入 ISBN 或书名' : '先输入片名或剧名'); return; }
    if(busy) return;
    busy = true; go.disabled = true;
    status.textContent = '正在搜索…'; list.innerHTML = '';
    if(k === 'book'){
      const digits = kw.replace(/[\s-]/g, '');
      if(/^\d{10}$/.test(digits) || /^\d{13}$/.test(digits)) kw = 'isbn:' + digits;
    }
    const res = await Providers.search(k, kw);
    busy = false; go.disabled = false;
    const cands = res.list || [];
    if(!cands.length){
      if(k === 'book'){
        status.innerHTML = '没查到这本书。国内网络访问 Google Books / Open Library 常被拦截，可到「我的 → 数据源与代理」填一个通用代理前缀后重试，或直接手动填写书名与作者。';
      } else if(res.errors.length){
        status.textContent = '没搜到：' + res.errors.join('；');
      } else {
        status.textContent = '没找到结果，换个名字试试，或直接手动填写下面的字段';
      }
      return;
    }
    status.textContent = `找到 ${cands.length} 条 · 点一条自动填入`;
    list.innerHTML = cands.map((c,i)=>
      `<button type="button" class="match-card" data-i="${i}">
        <span class="mc-poster"${c.posterUrl ? ` style="background-image:url('${c.posterUrl.replace(/'/g,"%27")}')"` : ''}></span>
        <span class="mc-info"><b>${esc(c.title)}</b>
          <i>${[c.year, c.source, c.rating ? '★'+c.rating : ''].filter(Boolean).join(' · ')}</i>
          <em>${esc((c.overview || '').slice(0, 90))}</em></span>
      </button>`
    ).join('');
    list.querySelectorAll('.match-card').forEach(card=>{
      card.onclick = ()=> applyMatch(cands[+card.dataset.i], k);
    });
  }
  go.onclick = run;
  q.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); run(); } });
}

function applyMatch(c, k){
  if(!c) return;
  const setF = (n, val)=>{
    if(val === undefined || val === null || val === '') return;
    addValues[n] = String(val);
    const inp = AS.body.querySelector(`[data-f="${n}"]`);
    if(inp) inp.value = String(val);
  };
  if(k === 'movie'){
    setF('t', c.title); setF('y', c.year); setF('dur', c.duration);
    setF('genre', c.genre); setF('dir', c.director); setF('cast', c.cast);
    setF('d', c.overview);
  } else if(k === 'book'){
    setF('t', c.title); setF('a', c.cast); setF('year', c.year); setF('d', c.overview);
    ebTyped.t = true; ebTyped.a = true; /* 匹配确定的书名作者，后续导入电子书不再覆盖 */
  } else {
    const brief = (c.overview || '').length > 120 ? c.overview.slice(0, 120).trim() + '…' : (c.overview || '');
    setF('t', c.title); setF('year', c.year); setF('d', brief);
  }
  if(c.rating) matchRating = c.rating;
  matchPoster = c.posterUrl ? { url: c.posterUrl, blobId: '' } : null;
  /* 编辑模式下把新封面立刻显示在封面位，不然用户以为没匹配上 */
  if(c.posterUrl){
    const cv = $('#cvWrap');
    if(cv){
      cv.style.backgroundImage = `url("${c.posterUrl.replace(/"/g,'%22')}")`;
      cv.classList.add('has');
    }
  }
  const st = $('#matchStatus');
  if(c.posterUrl){
    if(st) st.textContent = '已填入「' + c.title + '」，正在下载海报…';
    Providers.fetchPoster(c.posterUrl).then(id=>{
      matchPoster = { url: c.posterUrl, blobId: (id && id.charAt(0) === 'b') ? id : '' };
      if(st) st.textContent = matchPoster.blobId ? '已填入，海报已保存到本地' : '已填入，海报将直接引用线上图';
    });
  } else if(st) st.textContent = '已填入「' + c.title + '」（该条没有海报）';
  toast('已自动填入「' + c.title + '」');
}

/* 无损读取：原文件字节原样保存，不重编码（Flutter 对应直接落盘原文件） */
function readImageFile(file){
  return new Promise((res, rej)=>{
    const name = file.name || '';
    if(!/^image\//i.test(file.type) && !/\.(jpe?g|png|webp|gif|bmp|hei[cf]|avif)$/i.test(name)){
      rej(new Error('这不是图片文件')); return;
    }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onerror = async ()=>{
      URL.revokeObjectURL(url);
      /* 浏览器解不了的格式（iOS 的 HEIC 最常见）：再试一次 createImageBitmap，
         能读就补一张预览，读不出来才报错 */
      try{
        const bmp = await createImageBitmap(file);
        const cv = document.createElement('canvas');
        cv.width = bmp.width; cv.height = bmp.height;
        cv.getContext('2d').drawImage(bmp, 0, 0);
        let pv = '';
        try{ pv = cv.toDataURL('image/jpeg', .9); }catch(_){}
        const r = { file, ar: bmp.width / bmp.height, w: bmp.width, h: bmp.height,
          size: file.size, mime: file.type || 'image/jpeg', preview: pv };
        if(bmp.close) bmp.close();
        res(r);
      }catch(_){
        rej(new Error('这张图的格式浏览器解不开（iPhone 的 HEIC 常见），先转成 JPG 再选'));
      }
    };
    img.onload = ()=>{
      res({ file, ar: img.naturalWidth / img.naturalHeight,
        w: img.naturalWidth, h: img.naturalHeight,
        size: file.size, mime: file.type, preview: url });
    };
    img.src = url;
  });
}

/* 派生缩略图（最长边 max）：列表/抽屉用，原图不动 */
function makeThumb(file, max){
  return new Promise(res=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onerror = ()=>{ URL.revokeObjectURL(url); res(null); };
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      const s = Math.min(1, max / Math.max(w, h));
      w = Math.max(1, Math.round(w * s)); h = Math.max(1, Math.round(h * s));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      cv.toBlob(b=> res(b ? { blob:b, w, h } : null), 'image/jpeg', .85);
    };
    img.src = url;
  });
}

/* 保存 */
async function saveAdd(){
  const k = addType, v = addValues;
  if(addMode === 'edit') return saveEdit(k);
  const must = {book:['t'], movie:['t'], tv:['t'], image:['t'], link:['t']}[k] || [];
  for(const n of must){
    if(n === 't' && k === 'book' && ebFile && !ebFile.error && ebFile.chapters) break;
    if(!String(v[n]||'').trim()){
      toast('还有必填项没有填');
      const inp = AS.body.querySelector(`[data-f="${n}"]`);
      if(inp) inp.focus();
      return;
    }
  }
  const Y = String(new Date().getFullYear());
  let idx = 0;

  if(k === 'book'){
    const pg = Math.max(0, Math.min(100, +v.prog || 0));
    const c = pal(BOOKS.length);
    const eb = (ebFile && !ebFile.error && ebFile.chapters && ebFile.chapters.length) ? ebFile : null;
    const title = (v.t || '').trim() || (eb ? (eb.title || guessTitle(eb.name)) : '') || '未命名';
    const author = (v.a || '').trim() || (eb ? (eb.author || guessAuthor(eb.name)) : '') || '佚名';
    const item = {
      t:title, a:author,
      sp:[c[0], c[1]], cv:[c[2], c[3]], prog:pg,
      d:(v.d||'').trim() || (eb ? `从本地导入的电子书，共 ${eb.chapters.length} 章。` : '还没有写简介。'),
      meta:[(v.year||'').trim() || Y, v.cat || '未分类', pg >= 100 ? '已读' : pg > 0 ? '在读' : '想读']
    };
    if(eb){
      item.chapters = eb.chapters;
      item.file = { name: eb.name, enc: eb.encLabel, size: eb.size, chars: eb.chars, truncated: !!eb.truncated };
      /* 源文件 + 封面落进 IndexedDB，元数据只存引用 id（Flutter 对应文件表） */
      try{
        const fid = bid();
        await Store.putBlob(fid, new Blob([ebBuf], { type: /\.epub$/i.test(eb.name) ? 'application/epub+zip' : 'text/plain' }), eb.name, '');
        item.fileId = fid;
      }catch(_){}
      if(eb.cover && eb.cover.size){
        const cid = bid();
        await Store.putBlob(cid, eb.cover, 'cover', eb.cover.type);
        item.cover = cid;
      }
    }
    if(matchPoster && matchPoster.url && !item.cover){
      const pid = matchPoster.blobId || await Providers.fetchPoster(matchPoster.url);
      if(pid && pid.charAt(0) === 'b') item.cover = pid;
    }
    BOOKS.push(item);
    idx = BOOKS.length - 1;
  }
  else if(k === 'movie'){
    const c = pal(MOVIES.length + 3);
    MOVIES.push({
      t:v.t.trim(), y:(v.y||'').trim() || Y, dur:(v.dur||'').trim() || '—',
      genre:v.genre || '剧情', dir:(v.dir||'').trim() || '—', cast:(v.cast||'').trim() || '—',
      d:(v.d||'').trim() || '还没有写短评。', g:[c[1], c[3]],
      poster: matchPoster ? (matchPoster.blobId || matchPoster.url) : '',
      rating: matchRating || ''
    });
    idx = MOVIES.length - 1;
  }
  else if(k === 'tv'){
    const c = pal(TVS.length + 5);
    const epn = (v.epn||'').trim();
    TVS.push({
      t:v.t.trim(),
      s:`${(v.year||'').trim() || Y} · ${epn || '集数待补'} 集`,
      ep:Math.max(0, Math.min(100, +v.prog || 0)),
      g:[c[1], c[3]],
      d:(v.d||'').trim() || '还没有写短评。',
      poster: matchPoster ? (matchPoster.blobId || matchPoster.url) : '',
      rating: matchRating || ''
    });
    idx = TVS.length - 1;
  }
  else if(k === 'image'){
    const c = pal(PICS.length + 2);
    const cat = (v.cat || '').trim() || '未分类';
    if(!PIC_CATS.includes(cat)) PIC_CATS.push(cat);
    const item = { t:v.t.trim(), cat, g:[c[1], c[3]], ar: addUpload ? addUpload.ar : 1.2 };
    if(addUpload && addUpload.file){
      /* 原图无损落盘 + 派生缩略图 */
      const srcId = bid();
      await Store.putBlob(srcId, addUpload.file, v.t.trim(), addUpload.mime);
      item.src = srcId;
      item.size = addUpload.size;
      item.mime = addUpload.mime;
      const th = await makeThumb(addUpload.file, 600);
      if(th){
        const tid = bid();
        await Store.putBlob(tid, th.blob, 'thumb', 'image/jpeg');
        item.thumb = tid;
      }
    }
    PICS.push(item);
    idx = PICS.length - 1;
    if(picCat !== '全部' && picCat !== cat) picCat = '全部';
  }
  else {
    const c = pal(LINKS.length + 7);
    const d = new Date();
    LINKS.push({
      t:v.t.trim(), d:hostOf(v.url) || 'link', c:c[1],
      desc:(v.desc||'').trim() || '还没有写备注。',
      date:`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}`
    });
    idx = LINKS.length - 1;
  }
  persist();
  finishAdd(k, idx);
}

function hostOf(u){
  u = (u || '').trim();
  if(!u) return '';
  try{ return new URL(/^https?:\/\//i.test(u) ? u : 'https://' + u).hostname.replace(/^www\./, ''); }
  catch(_){ return u; }
}

/* ---------- 编辑既有条目：原地更新，不新增 ---------- */
async function saveEdit(k){
  const v = addValues, it = (COLL[k] || [])[addEdit];
  if(!it){ closeAdd(); return; }

  if(!String(v.t || '').trim()){
    toast('名字不能为空');
    const inp = AS.body.querySelector('[data-f="t"]');
    if(inp) inp.focus();
    return;
  }

  /* 封面优先级：新上传 > 本次重新匹配 > 原来那张 */
  let newCoverId = '';
  if(coverNew && coverNew.file){
    const id = bid();
    try{ await Store.putBlob(id, coverNew.file, 'cover', coverNew.mime); newCoverId = id; }
    catch(_){ toast('封面没能存下来'); }
  }
  if(!newCoverId && matchPoster){
    const pid = matchPoster.blobId || await Providers.fetchPoster(matchPoster.url);
    if(pid) newCoverId = pid;
  }

  const Y = String(new Date().getFullYear());

  if(k === 'book'){
    const pg = Math.max(0, Math.min(100, +v.prog || 0));
    it.t = v.t.trim();
    it.a = (v.a || '').trim() || it.a || '佚名';
    it.prog = pg;
    it.d = (v.d || '').trim() || it.d || '还没有写简介。';
    it.meta = [
      (v.year || '').trim() || (it.meta && it.meta[0]) || Y,
      v.cat || (it.meta && it.meta[1]) || '未分类',
      pg >= 100 ? '已读' : pg > 0 ? '在读' : '想读'
    ];
    if(newCoverId) it.cover = newCoverId;
  }
  else if(k === 'movie'){
    it.t = v.t.trim();
    it.y = (v.y || '').trim() || it.y || Y;
    it.dur = (v.dur || '').trim() || it.dur || '—';
    it.genre = v.genre || it.genre || '剧情';
    it.dir = (v.dir || '').trim() || it.dir || '—';
    it.cast = (v.cast || '').trim() || it.cast || '—';
    it.d = (v.d || '').trim() || it.d || '还没有写短评。';
    if(newCoverId) it.poster = newCoverId;
    if(matchRating) it.rating = matchRating;
  }
  else if(k === 'tv'){
    const om = /^(\d{4})\s*·\s*(.*?)\s*集$/.exec(it.s || '');
    const yr = (v.year || '').trim() || (om ? om[1] : Y);
    const cnt = (v.epn || '').trim() || (om ? om[2].trim() : '') || '集数待补';
    it.t = v.t.trim();
    it.s = `${yr} · ${cnt} 集`;
    it.ep = Math.max(0, Math.min(100, +v.prog || 0));
    it.d = (v.d || '').trim() || it.d || '还没有写短评。';
    if(newCoverId) it.poster = newCoverId;
    if(matchRating) it.rating = matchRating;
  }
  else if(k === 'image'){
    const cat = (v.cat || '').trim() || '未分类';
    if(!PIC_CATS.includes(cat)) PIC_CATS.push(cat);
    it.t = v.t.trim();
    it.cat = cat;
    if(addUpload && addUpload.file){
      const srcId = bid();
      await Store.putBlob(srcId, addUpload.file, it.t, addUpload.mime);
      it.src = srcId;
      it.size = addUpload.size;
      it.mime = addUpload.mime;
      it.ar = addUpload.ar || it.ar || 1.2;
      const th = await makeThumb(addUpload.file, 600);
      if(th){
        const tid = bid();
        await Store.putBlob(tid, th.blob, 'thumb', 'image/jpeg');
        it.thumb = tid;
      }
    } else if(addUpload === null){
      /* 点了「移除」：回到色块占位 */
      it.src = ''; it.thumb = ''; it.size = 0; it.mime = '';
    }
  }
  else {
    it.t = v.t.trim();
    const host = hostOf(v.url);
    if(host) it.d = host;
    it.desc = (v.desc || '').trim() || it.desc || '还没有写备注。';
  }

  persist();
  closeAdd();
  rebuild(k);
  /* 在阅读器里改完书名，顶栏跟着换，不用退出去重进 */
  if(k === 'book' && readerEl){
    const bt = readerEl.querySelector('.rd-book');
    if(bt) bt.textContent = it.t;
  }
  toast(`已更新「${it.t}」`);
}

function finishAdd(k, idx){
  closeAdd();
  if(k === 'movie' || k === 'tv'){ movieSeg = k; goTab('video'); }
  else goTab(k);
  if(k === 'book') cur = idx;
  if(k === 'tv') fanIdx = idx;
  rebuild(k);
  requestAnimationFrame(()=>{
    const sc = scenes[k]; if(!sc) return;
    if(k === 'movie' || k === 'image' || k === 'link'){ sc.goto && sc.goto(idx); flash(k, idx); }
    else if(k === 'tv'){ sc.enter && sc.enter(); flash(k, idx); }
    else if(k === 'book'){ sc.layout && sc.layout(); }
  });
  toast(`已添加到「${LABELS[k]}」`);
}

/* 数据变了就重建这一块场景（其余四块不动） */
function rebuild(key){
  const old = scenes[key];
  if(!old) return;
  const wasOn = old.el.classList.contains('on');
  const sc = old.el.querySelector('.mwall, .gallery, .tl');
  const st = sc ? sc.scrollTop : 0;
  if(key === 'book') lastCenter = -99;
  const neu = build(key);
  old.el.parentNode.insertBefore(neu.el, old.el);
  old.el.remove();
  neu.el.classList.toggle('on', wasOn);
  if(key === 'book'){
    const stg = neu.el.querySelector('.stage');
    if(stg) stg.classList.add('in');
  }
  scenes[key] = neu;
  const sc2 = neu.el.querySelector('.mwall, .gallery, .tl');
  if(sc2) sc2.scrollTop = st;
  if(wasOn){ neu.enter && neu.enter(); if(key === 'book' && neu.layout) neu.layout(); }
}

/* ================= 条目操作：编辑 / 删除（五个版块通用） ================= */
const ITEM_NAME = { book:'这本书', movie:'这部电影', tv:'这部剧', image:'这张图', link:'这条链接' };

function editItem(k, i){
  /* 详情浮层先收起，不然编辑面板会被压在下面 */
  if(mvCard) closeMovie();
  if(picZoom) closePic();
  closeItemMenu();
  openEdit(k, i);
}

function deleteItem(k, i, after){
  const arr = COLL[k] || [], it = arr[i];
  if(!it) return;
  const label = it.t || '未命名';
  askConfirm('删除' + (ITEM_NAME[k] || '这条收藏'),
    `「${label}」会从拾间移除，本地文件一并清掉，不能撤销。`,
    ()=>{
      [it.cover, it.src, it.thumb, it.fileId,
       (it.poster && !/^https?:/i.test(it.poster)) ? it.poster : '']
        .filter(Boolean).forEach(id=>{ try{ Store.deleteBlob(id); }catch(_){} });
      arr.splice(i, 1);
      persist();
      if(typeof after === 'function') after();
      rebuild(k);
      toast(`已删除「${label}」`);
    }, true);
}

/* 阅读器顶栏空间有限，编辑/删除收进一个「⋯」浮层 */
let imMenuEl = null;
function openItemMenu(anchor, k, i){
  closeItemMenu();
  const d = document.createElement('div');
  d.id = 'imMenu';
  d.innerHTML = `<button data-act="edit">编辑信息</button>
    <button data-act="del" class="danger">删除${ITEM_NAME[k] || '这条'}</button>`;
  document.body.appendChild(d);
  const r = anchor.getBoundingClientRect();
  const w = 146;
  d.style.left = Math.max(10, Math.min(window.innerWidth - w - 10, r.right - w)) + 'px';
  d.style.top = Math.min(window.innerHeight - 108, r.bottom + 8) + 'px';
  requestAnimationFrame(()=> d.classList.add('on'));
  d.onclick = e=>{
    const b = e.target.closest('button'); if(!b) return;
    closeItemMenu();
    if(b.dataset.act === 'edit') editItem(k, i);
    else deleteItem(k, i, ()=>{ if(k === 'book' && readerEl) closeReader(); });
  };
  imMenuEl = d;
  setTimeout(()=> document.addEventListener('pointerdown', imDocDown, true), 0);
}
function imDocDown(e){ if(imMenuEl && !imMenuEl.contains(e.target)) closeItemMenu(); }
function closeItemMenu(){
  document.removeEventListener('pointerdown', imDocDown, true);
  if(imMenuEl){ imMenuEl.remove(); imMenuEl = null; }
}

/* 二次确认 */
let cfmCb = null;
function askConfirm(title, desc, cb, danger){
  cfmCb = cb || null;
  $('#cfmT').textContent = title;
  $('#cfmD').textContent = desc || '';
  $('#cfmK').classList.toggle('danger', !!danger);
  $('#cfm').classList.add('on');
  syncSleep();
}
function closeConfirm(){
  $('#cfm').classList.remove('on');
  cfmCb = null;
  syncSleep();
}
$('#cfmC').onclick = closeConfirm;
$('#cfmK').onclick = ()=>{
  const cb = cfmCb;
  $('#cfm').classList.remove('on');
  cfmCb = null;
  syncSleep();
  if(cb) cb();
};
$('#cfm').onclick = e=>{ if(e.target.id === 'cfm') closeConfirm(); };

/* 文字输入对话框 */
let dlgCb = null;
function askText(title, ph, val, cb){
  dlgCb = cb;
  $('#dlgT').textContent = title;
  const i = $('#dlgI');
  i.value = val || '';
  i.placeholder = ph || '';
  $('#dlg').classList.add('on');
  syncSleep();
  setTimeout(()=> i.focus(), 140);
}
function closeDlg(){
  $('#dlg').classList.remove('on');
  dlgCb = null;
  syncSleep();
}
$('#dlgC').onclick = closeDlg;
$('#dlgK').onclick = ()=>{
  const v = $('#dlgI').value;
  const cb = dlgCb;
  $('#dlg').classList.remove('on');
  dlgCb = null;
  syncSleep();
  if(cb) cb(v);
};
$('#dlgI').addEventListener('keydown', e=>{
  if(e.key === 'Enter'){ e.preventDefault(); $('#dlgK').click(); }
});
$('#dlg').onclick = e=>{ if(e.target.id === 'dlg') closeDlg(); };

window.addEventListener('keydown', e=>{
  if(e.key !== 'Escape') return;
  if($('#cfm').classList.contains('on')){ closeConfirm(); return; }
  if($('#dlg').classList.contains('on')){ closeDlg(); return; }
  if(srcOpen){ closeSources(); return; }
  if(addOpen){ closeAdd(); return; }
  if(readerEl){ if(rd && rd.sheet) rdCloseSheet(); else closeReader(); return; }
  if(picZoom){ closePic(); return; }
  if(mvCard){ closeMovie(); return; }
  closeDrawer();
});

/* 初始化 */
scenes.book.enter();
goTab('book');

let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 1600);
}
window.toast = toast;
</script>
