let cur = 2, dragging = false, startX = 0, startCur = 0, moved = 0;
let bookEls = [], zoomEl = null, infoEl = null;
let rigEl = null, shadowWrap = null, booksEl = null, stageEl = null, hintEl = null, kickerEl = null;
let rafId = 0, lastCenter = -99;
const TILT = -26;
const TILT_SIN = Math.sin(26 * Math.PI / 180), TILT_COS = Math.cos(26 * Math.PI / 180);

/* 每本占多宽：gap 必须大于书厚（--bkT），封面才有缝露出来又不会插进邻书 */
function stageMetrics(){
  const W = window.innerWidth;
  if(W < 560) return { gap:62, out:76, bkW:198 };
  if(W < 980) return { gap:78, out:86, bkW:198 };
  return { gap:98, out:104, bkW:262 };
}

function buildBook(){
  const el = document.createElement('section');
  el.className = 'scene'; el.id = 's-book';
  el.innerHTML = `<div class="kicker"><b>书架</b> · ${BOOKS.length} 本</div>
    <div class="stage"><div class="rig"><div class="books"></div></div></div>
    <div class="shadows"></div>
    <div class="shelf"><div class="shelf-top"></div></div>
    <div class="shelf-face"></div>
    <div class="hint">左右滑动挑选 · 点中间抽出</div>`;
  stageEl = $('.stage', el);
  rigEl = $('.rig', el);
  booksEl = $('.books', el);
  shadowWrap = $('.shadows', el);
  hintEl = $('.hint', el);
  kickerEl = $('.kicker', el);

  BOOKS.forEach((b,i)=>{
    const d = document.createElement('div');
    d.className = 'book';
    d.style.setProperty('--sp0', b.sp[0]);
    d.style.setProperty('--sp1', b.sp[1]);
    d.style.setProperty('--cv0', b.cv[0]);
    d.style.setProperty('--cv1', b.cv[1]);
    d.innerHTML = `<div class="bkface spine"><i class="crease"></i><div class="t">${b.t}</div><div class="a">${b.a}</div></div>
      <div class="bkface bcover"${b.cover ? ` data-bid="${b.cover}"` : ''}></div>
      <div class="bkface bback"></div>
      <div class="bkface bfore"></div>
      <div class="bkface btop"></div>
      <div class="bkface bbottom"></div>`;
    d.dataset.i = i;
    booksEl.appendChild(d);
  });
  bookEls = $$('.book', booksEl);
  hydrate(booksEl);

  /* 一帧只写 transform：不碰 background / box-shadow / class，
     拖动时浏览器只做合成，不触发重绘 */
  function layout(){
    const m = stageMetrics();
    /* 让"当前这本"的书脊正好落在屏幕中线。
       off：书脊面本身相对书体中心的偏移；pull：书被抽出后透视会把它再往左推。 */
    const off = (m.bkW/2) * TILT_SIN;
    const pull = m.out * TILT_SIN;
    const slide = cur * m.gap * TILT_COS;
    rigEl.style.transform = `translate3d(${(off + pull - slide).toFixed(1)}px,0,0) rotateY(${TILT}deg)`;
    for(let i=0;i<bookEls.length;i++){
      const b = bookEls[i];
      let k = 1 - Math.abs(i-cur)/1.12;
      if(k < 0) k = 0;
      k = k*k*(3-2*k);   // smoothstep：中间一本抽出，左右平滑回落
      b.style.transform = `translate3d(${(i*m.gap).toFixed(1)}px,${(-k*7).toFixed(2)}px,${(k*m.out).toFixed(1)}px)`;
    }
    paintState();
  }

  /* 只有"当前中心书"变了才改 class / opacity / visibility */
  function paintState(){
    const c = Math.round(cur);
    if(c !== lastCenter){
      lastCenter = c;
      bookEls.forEach((b,i)=> b.classList.toggle('center', i === c));
    }
    bookEls.forEach((b,i)=>{
      const hidden = Math.abs(i - cur) > 3.4;
      if(b._h !== hidden){ b._h = hidden; b.style.visibility = hidden ? 'hidden' : ''; }
    });
  }

  function snap(){
    cur = Math.max(0, Math.min(BOOKS.length-1, Math.round(cur)));
    layout();
  }

  stageEl.addEventListener('pointerdown', e=>{
    if(zoomEl) return;
    dragging = true; moved = 0; startX = e.clientX; startCur = cur;
    rigEl.classList.add('dragging');
    shadowWrap.classList.add('dragging');
    try{ stageEl.setPointerCapture(e.pointerId); }catch(_){}
  });
  stageEl.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx = e.clientX - startX;
    const ax = Math.abs(dx); if(ax > moved) moved = ax;
    cur = startCur - dx / (stageMetrics().gap * TILT_COS);
    cur = Math.max(-0.4, Math.min(BOOKS.length-1+0.4, cur));
    if(!rafId) rafId = requestAnimationFrame(()=>{ rafId = 0; layout(); });
  }, {passive:true});
  stageEl.addEventListener('pointercancel', ()=>{
    if(!dragging) return;
    dragging = false;
    rigEl.classList.remove('dragging');
    shadowWrap.classList.remove('dragging');
    snap();
  });
  stageEl.addEventListener('pointerup', e=>{
    if(!dragging) return;
    dragging = false;
    rigEl.classList.remove('dragging');
    shadowWrap.classList.remove('dragging');
    if(moved < 10){
      const t = document.elementFromPoint(e.clientX, e.clientY);
      const bk = t && t.closest ? t.closest('.book') : null;
      if(bk){
        const i = +bk.dataset.i;
        if(i !== Math.round(cur)){ cur = i; snap(); return; }
        snap(); focusBook(i); return;
      }
    }
    snap();
  });

  function focusBook(i){
    const src = bookEls[i];
    const b = BOOKS[i];
    const sp = $('.spine', src) || src;
    const r = sp.getBoundingClientRect();
    const W = window.innerWidth, H = window.innerHeight;
    bookEls.forEach(e=>{ if(e!==src) e.classList.add('focus-dim'); });
    el.classList.add('focusing');
    src.style.visibility = 'hidden';
    shadowWrap.style.opacity = 0;
    hintEl.style.opacity = 0; kickerEl.style.opacity = 0;

    const cw = Math.min(W*0.6, 300), ch = cw*1.45;
    const portrait = W < 760;
    let cx, cy;
    if(portrait){ cx = (W-cw)/2; cy = H*0.10; }
    else { cx = W*0.5 - cw*1.1; cy = (H-ch)/2 - 10; }

    const card = document.createElement('div');
    card.className = 'covercard';
    card.style.setProperty('--cc0', b.cv[0]);
    card.style.setProperty('--cc1', b.cv[1]);
    if(b.cover){
      mediaURL(b.cover).then(u=>{ if(u && zoomEl === card){ card.style.setProperty('--bkimg', `url("${u}")`); card.classList.add('hasimg'); } });
    }
    card.innerHTML = `<div class="ct">${b.t}</div><div class="ca">${b.a}</div>`;
    const sx = Math.max(.06, r.width / cw), sy = Math.max(.2, r.height / ch);
    const ix = r.left + r.width/2 - cw/2, iy = r.top + r.height/2 - ch/2;
    card.style.cssText += `left:0px;top:0px;width:${cw}px;height:${ch}px;
      transform:translate(${ix}px, ${iy}px) scale(${sx}, ${sy}) rotateY(-18deg);
      opacity:0;transition:transform .62s cubic-bezier(.22,.9,.24,1),opacity .4s;`;
    document.body.appendChild(card);
    zoomEl = card;
    zoomEl._back = { ix, iy, sx, sy };
    requestAnimationFrame(()=>{
      card.style.opacity = 1;
      card.style.transform = `translate(${cx}px, ${cy}px) scale(1,1) rotateY(0deg)`;
    });

    const info = document.createElement('div');
    info.className = 'bookinfo';
    const rp = b.prog || 0;
    const fileLine = b.file
      ? `<div class="bi-file">${b.file.enc} · ${b.chapters.length} 章 · ${fmtNum(b.file.chars)} 字</div>`
      : '';
    info.innerHTML = `<p class="bi-desc">${b.d}</p>
      <div class="bi-meta">${b.meta.map(m=>`<span>${m}</span>`).join('')}</div>
      ${fileLine}
      <div class="book-actions">
        <button class="reader-btn">
          <span class="rb-fill" style="width:${rp}%"></span>
          <span class="rb-t">${rp>=100?'重新阅读':rp<=0?'开始阅读':'继续阅读'}</span>
          ${rp>0?`<span class="rb-p">${rp}%</span>`:''}
        </button>
        <button class="closer">放回书架</button>
      </div>`;
    info.querySelector('.closer').addEventListener('click', closeBook);
    info.querySelector('.reader-btn').addEventListener('click', ()=>openReader(i));
    document.body.appendChild(info);
    infoEl = info;
    const iw = Math.min(320, W-60);
    if(portrait){
      info.style.cssText += `left:${(W-iw)/2}px; top:${cy + ch + 28}px; width:${iw}px; text-align:center;`;
      info.querySelector('.bi-desc').style.margin = '16px auto 0';
      info.querySelector('.bi-meta').style.justifyContent = 'center';
      info.querySelector('.book-actions').style.marginTop = '26px';
    } else {
      info.style.cssText += `left:${cx + cw + 48}px; top:${cy + ch*0.2}px; width:300px;`;
    }
    setTimeout(()=>info.classList.add('on'), 300);
  }
  function closeBook(){
    if(!zoomEl) return;
    const z = zoomEl;
    const bk = z._back || { ix:0, iy:0, sx:1, sy:1 };
    z.style.transition = 'transform .5s cubic-bezier(.4,0,.2,1), opacity .35s';
    z.style.transform = `translate(${bk.ix}px, ${bk.iy}px) scale(${bk.sx}, ${bk.sy}) rotateY(-18deg)`;
    z.style.opacity = 0;
    if(infoEl) infoEl.classList.remove('on');
    setTimeout(()=>{
      if(z && z.parentNode) z.remove();
      zoomEl = null;
      bookEls.forEach(e=>{ e.classList.remove('focus-dim'); e.style.visibility=''; });
      el.classList.remove('focusing');
      shadowWrap.style.opacity = 1;
      hintEl.style.opacity = 1; kickerEl.style.opacity = .55;
      if(infoEl){ infoEl.remove(); infoEl = null; }
    }, 520);
  }
  let entered = false;
  return { el, enter(){
    if(!entered){
      entered = true;
      stageEl.classList.add('in');      // 整排书从下方升起
      requestAnimationFrame(()=> requestAnimationFrame(layout));
    } else {
      layout();
    }
  }, layout, close: closeBook,
    current(){ return cur; },
    goto(i){
      i = Math.max(0, Math.min(BOOKS.length-1, i));
      if(zoomEl){ closeBook(); setTimeout(()=>{ cur = i; layout(); }, 560); return; }
      cur = i; layout();
    }
  };
}

/* ================= 阅读器 ================= */
let readerEl = null, readingIdx = -1, rd = null, rdUiTimer = 0, rdScrollRaf = 0;
const progLabel = p => p >= 100 ? '已读' : (p <= 0 ? '未读' : p + '%');

/* 示范正文（6 章）。接入真实电子书后，由文件解析结果替换这段数据 */
const RD_CHAPTERS = [
  { n:'第一章', t:'先收着', p:[
    '搬家那天下着小雨。纸箱堆在客厅中间，最重的一箱是书。搬起来的时候箱底往下坠，像随时会散开。我在箱子上写了「书·轻拿」，写完觉得多余，谁都知道书重。',
    '新房子小一些，能放书架的地方只有客厅靠窗那面墙。量了三次尺寸，还是买错了一回，退掉，换成窄十公分的。装好那天下午，光从窗户斜进来，落在空的隔板上，灰尘在光里浮着。',
    '把书一本一本往里放，是个很慢的活。不是没地方放，是想不起该按什么顺序。按作者？按买回来的时间？最后还是按大小排，高的在左，矮的在右，中间留一道缝，看着舒服。',
    '排到最后剩下几本，横着摞在空出来的格子里。它们不属于任何一类：一本是别人的，一本没读完，一本读过三遍但说不上喜欢。我把它们放在最下层，蹲下来才能看见。'
  ]},
  { n:'第二章', t:'找得到', p:[
    '搬完的第二周，我想找一本很多年前买的书。记得封面是深蓝色，记得是在一个火车站的书店买的，记得当时只剩这一本，边角有点卷。但想不起书名，也想不起作者。',
    '我把书架从下往上翻了一遍，没有。又翻了床底的两个箱子，也没有。最后坐在纸箱中间，忽然意识到，它可能根本没被带过来。有些东西是在搬家中途被悄悄留下的，当时并不觉得可惜。',
    '那天下午我在书架上随便抽了一本，是《夜航西飞》。翻开第一页，掉出一张超市小票，日期是四年前。我看了很久，上面有牛奶、面包、一盒感冒药。那天大概是我在生病。',
    '找不到的那本，后来在旧手机的照片里见过一次。它在照片右下角，只露出书脊的一小截。我放大看，字是糊的。这件事就这样放下了。找不到的东西，有时候会以另一种方式回来，比如一张照片，比如一段想不起来出处的句子。'
  ]},
  { n:'第三章', t:'记性', p:[
    '我开始在书里写字，是很晚的事。以前觉得书要保持干净，连折角都舍不得。后来有一天，读到一个句子，实在想记住，手边没有纸，就在页边写了一行。字很丑，但那句话从此就在那儿了。',
    '现在翻开旧书，最有趣的不是正文，是页边那些字。有的写着「此处不同意」，有的画一个问号，有的只有日期。日期比批注更让人出神：某年某月某日，我在读这一页，那天我在哪儿，为什么放下书。',
    '有一本里夹着一张火车票，硬座，从南边到北边，二十六个小时。票根已经软了。我完全想不起那趟车是去做什么，但记得车窗外有一段很长的水稻田，天一直是灰的。',
    '记性这个东西，不按重要的程度保存。它保存的常常是最没用的细节：一段路的味道，一件衣服的袖口，某个下午光的角度。真正重要的事，反而要靠别人提醒。'
  ]},
  { n:'第四章', t:'长的路', p:[
    '有几年我读得很凶。上下班的地铁上，一只手抓扶手，一只手翻页，四十分钟能读三十页。那时候读书像在赶路，总觉得有一本书在前面等着，读完这本还有下一本。',
    '后来慢下来。不是没时间，是发现读得快并不等于读到了。有些段落要停一停，去泡杯茶，回来再读一遍。有些书一次只能读十页，多了就麻木。',
    '那年冬天我在读一本很厚的书，读了三个月。每天晚上十一点开始，读到十二点半，台灯的光圈刚好罩住书页。读到最后一页那晚，我把书合上，坐了很久，没有立刻去拿下一本。',
    '慢下来的好处是，书里的东西开始和我自己的事混在一起。走在路上会忽然想起某一页，想起的不是情节，是一种当时的心情。书就这样变成了记忆的一部分，不再只是书。'
  ]},
  { n:'第五章', t:'借来的光', p:[

    '借出去的书大多不会回来。我并不介意，书在别人手里被读，比在我架子上落灰好。只是偶尔会想起某一本，想不起借给了谁，也不好意思问。',
    '有一年冬天，一个很久没联系的人寄来一个包裹，里面是我五年前借出去的两本书，还有一张纸条，写着「抱歉，太久了」。纸条没有署名，但我认得那个字。',
    '那天晚上我把两本书放回架上，位置还是原来的位置。书旧了一些，书脊被翻得发白。我摸了摸，觉得这几年它们过得比我以为的好。'
  ]},
  { n:'第六章', t:'尾声', p:[
    '天快亮的时候，我把最后一本书放回架子。窗外的颜色从深蓝变成灰白，楼下开始有车经过的声音。书架在这一刻看起来特别安静，像一排站着不说话的人。',
    '我退后两步看了看。高的、矮的、横着摞的、夹着票根的，都在。它们不能替我记住什么，但它们在那儿，我就知道有些年没有白过。',
    '收藏这件事，说到底不是为了拥有。是给自己留一个可以回去的地方。哪天累了，抽一本下来，翻开，字还在，批注还在，那个读它的人也就还在。',
    '我关了灯，房间暗下来。书脊上的字看不清了，但我知道每一本在哪儿。'
  ]}
];

/* 当前正在读的书用哪套章节：导入的电子书用书自己的，其余用示范正文 */
let rdChapters = RD_CHAPTERS;

const RD_FS = [15, 17, 19, 21];
const RD_THEME_LIST = [['night','夜'], ['paper','纸'], ['green','护眼'], ['sepia','羊皮']];
const RD_ICON_BACK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const RD_ICON_TOC = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h11M4 17h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';

function rdArticleHTML(){
  return rdChapters.map((c,i)=>`
    <div class="rd-ch-head" data-ci="${i}">
      <div class="rd-ch-n">${c.n}</div>
      <div class="rd-ch-t">${c.t}</div>
    </div>
    ${c.p.map(t=>`<p>${t}</p>`).join('')}`).join('');
}
function rdTocHTML(){
  return rdChapters.map((c,i)=>
    `<div class="rd-toc-item" data-ci="${i}"><span class="n">${c.n}</span><span class="t">${c.t}</span></div>`
  ).join('');
}

function openReader(i){
  if(readerEl) return;
  const b = BOOKS[i];
  readingIdx = i;
  rdChapters = (b.chapters && b.chapters.length) ? b.chapters : RD_CHAPTERS;
  /* 已读完的点「重新阅读」从头开始，否则回到上次进度 */
  const start = (b.prog >= 100 ? 0 : (b.prog || 0)) / 100;

  readerEl = document.createElement('div');
  readerEl.className = 'reader hide-ui';
  readerEl.dataset.theme = 'night';
  readerEl.dataset.mode = 'scroll';
  readerEl.innerHTML = `
    <header class="rd-top">
      <button class="rd-btn rd-back" data-act="back" aria-label="返回书架">${RD_ICON_BACK}</button>
      <div class="rd-meta">
        <div class="rd-book">${b.t}</div>
        <div class="rd-chline" data-role="chline">${rdChapters[0].n} · ${rdChapters[0].t}</div>
      </div>
      <button class="rd-btn" data-act="toc" aria-label="目录">${RD_ICON_TOC}</button>
      <button class="rd-btn rd-aa" data-act="set" aria-label="阅读设置">Aa</button>
      <button class="rd-btn" data-act="item" aria-label="编辑或删除">⋯</button>
    </header>
    <div class="rd-stage">
      <div class="rd-scroll" data-role="scroll"><article class="rd-body">${rdArticleHTML()}</article></div>
      <div class="rd-pager" data-role="pager"><div class="rd-view" data-role="view"><div class="rd-track" data-role="track"></div></div></div>
    </div>
    <footer class="rd-bot">
      <span class="rd-pn" data-role="pn">第 1 章</span>
      <div class="rd-track-bar" data-role="bar"><i data-role="fill"></i><b data-role="knob"></b></div>
      <span class="rd-pct" data-role="pct">0%</span>
    </footer>
    <div class="rd-veil" data-role="veil"></div>
    <div class="rd-sheet" data-panel="set">
      <div class="rd-sheet-h"><span>阅读设置</span><button class="rd-x" data-act="closeSheet">完成</button></div>
      <div class="rd-row"><span class="rd-row-l">字号</span>
        <div class="seg" data-seg="fs">
          ${RD_FS.map((v,k)=>`<button data-fs="${k}" class="${k===1?'on':''}">${['小','中','大','特大'][k]}</button>`).join('')}
        </div>
      </div>
      <div class="rd-row"><span class="rd-row-l">背景</span>
        <div class="rd-dots">
          ${RD_THEME_LIST.map(([t])=>`<span class="rd-dot ${t==='night'?'on':''}" data-tp="${t}"></span>`).join('')}
        </div>
      </div>
      <div class="rd-row"><span class="rd-row-l">翻页</span>
        <div class="seg" data-seg="mode">
          <button data-mode="scroll" class="on">上下翻页</button>
          <button data-mode="page">左右翻页</button>
        </div>
      </div>
    </div>
    <div class="rd-sheet rd-toc" data-panel="toc">
      <div class="rd-sheet-h"><span>目录 · 共 ${rdChapters.length} 章</span><button class="rd-x" data-act="closeSheet">关闭</button></div>
      <div class="rd-toc-list" data-role="toc">${rdTocHTML()}</div>
    </div>`;
  document.body.appendChild(readerEl);

  rd = {
    book: b, mode: 'scroll', ratio: start, fs: 1, theme: 'night',
    pages: [], pageIdx: 0, chapterPage: [], chapterTops: [],
    sheet: null, W: 0, H: 0, tipShown: false, ui: null
  };
  rd.ui = {
    pct: readerEl.querySelector('[data-role="pct"]'),
    fill: readerEl.querySelector('[data-role="fill"]'),
    knob: readerEl.querySelector('[data-role="knob"]'),
    pn: readerEl.querySelector('[data-role="pn"]'),
    chline: readerEl.querySelector('[data-role="chline"]'),
    toc: [...readerEl.querySelectorAll('.rd-toc-item')]
  };

  const stage = readerEl.querySelector('.rd-stage');
  const scroll = readerEl.querySelector('[data-role="scroll"]');
  const pager = readerEl.querySelector('[data-role="pager"]');
  const track = readerEl.querySelector('[data-role="track"]');
  const veil = readerEl.querySelector('[data-role="veil"]');
  const barEl = readerEl.querySelector('[data-role="bar"]');

  /* ---------- 工具栏 / 面板 ---------- */
  readerEl.addEventListener('click', e=>{
    const t = e.target.closest('[data-fs],[data-tp],[data-mode],[data-ci],[data-act]');
    if(!t) return;
    if(t.dataset.act === 'back') return closeReader();
    if(t.dataset.act === 'toc') return rdOpenSheet('toc');
    if(t.dataset.act === 'set') return rdOpenSheet('set');
    if(t.dataset.act === 'item') return openItemMenu(t, 'book', i);
    if(t.dataset.act === 'closeSheet') return rdCloseSheet();
    if(t.dataset.fs !== undefined && t.dataset.fs !== '') return rdSetFs(+t.dataset.fs);
    if(t.dataset.tp) return rdSetTheme(t.dataset.tp);
    if(t.dataset.mode) return rdSetMode(t.dataset.mode);
    if(t.dataset.ci !== undefined && t.dataset.ci !== '') return rdGoChapter(+t.dataset.ci);
  });
  veil.addEventListener('click', rdCloseSheet);

  /* ---------- 滚动模式 ---------- */
  scroll.addEventListener('scroll', ()=>{
    if(rdScrollRaf) return;
    rdScrollRaf = requestAnimationFrame(()=>{ rdScrollRaf = 0; rdPaintUI(); });
  }, {passive:true});

  let sTap = null;
  scroll.addEventListener('pointerdown', e=>{
    sTap = { x: e.clientX, y: e.clientY, t: performance.now() };
  }, {passive:true});
  scroll.addEventListener('pointerup', e=>{
    if(!sTap) return;
    const moved = Math.abs(e.clientY - sTap.y) > 8 || Math.abs(e.clientX - sTap.x) > 8;
    const dur = performance.now() - sTap.t;
    sTap = null;
    if(moved || dur > 520) return;
    const H = stage.clientHeight;
    if(e.clientY > H * 0.74){ scroll.scrollBy({ top: scroll.clientHeight * 0.82, behavior: 'smooth' }); return; }
    if(e.clientY < H * 0.26){ scroll.scrollBy({ top: -scroll.clientHeight * 0.82, behavior: 'smooth' }); return; }
    rdToggleUI();
  });

  /* ---------- 左右翻页手势 ---------- */
  let g = null;
  pager.addEventListener('pointerdown', e=>{
    if(!rd.pages.length) return;
    g = { x: e.clientX, y: e.clientY, dx: 0, dy: 0, lx: e.clientX, lt: performance.now(), v: 0, moved: false };
    try{ pager.setPointerCapture(e.pointerId); }catch(_){}
  });
  pager.addEventListener('pointermove', e=>{
    if(!g) return;
    const dx = e.clientX - g.x, dy = e.clientY - g.y;
    if(Math.abs(dx) > 6 || Math.abs(dy) > 6) g.moved = true;
    const dt = performance.now() - g.lt;
    if(dt > 0){ g.v = (e.clientX - g.lx) / dt; g.lx = e.clientX; g.lt = performance.now(); }
    g.dx = dx;
    if(g.moved){
      const atHead = rd.pageIdx === 0 && dx > 0;
      const atTail = rd.pageIdx === rd.pages.length - 1 && dx < 0;
      const mv = (atHead || atTail) ? dx * 0.24 : dx;
      track.style.transition = 'none';
      track.style.transform = `translate3d(${-rd.pageIdx * rd.W + mv}px,0,0)`;
    }
  });
  pager.addEventListener('pointerup', e=>{
    if(!g) return;
    const dx = g.dx, v = g.v, moved = g.moved;
    g = null;
    if(!moved){ rdTapPage(e.clientX); return; }
    if(dx < -rd.W * 0.16 || v < -0.45) return rdSetPage(rd.pageIdx + 1);
    if(dx > rd.W * 0.16 || v > 0.45) return rdSetPage(rd.pageIdx - 1);
    rdSetPage(rd.pageIdx);
  });
  pager.addEventListener('pointercancel', ()=>{
    g = null;
    rdSetPage(rd.pageIdx);
  });

  /* ---------- 底部进度条拖动 ---------- */
  let barDrag = false;
  const seekEvt = e=>{
    const r = barEl.getBoundingClientRect();
    if(r.width > 0) rdSeek((e.clientX - r.left) / r.width);
  };
  barEl.addEventListener('pointerdown', e=>{
    barDrag = true;
    try{ barEl.setPointerCapture(e.pointerId); }catch(_){}
    seekEvt(e);
  });
  barEl.addEventListener('pointermove', e=>{ if(barDrag) seekEvt(e); });
  barEl.addEventListener('pointerup', ()=>{ barDrag = false; });
  barEl.addEventListener('pointercancel', ()=>{ barDrag = false; });

  /* ---------- 键盘 ---------- */
  const onKey = e=>{
    if(!rd || rd.mode !== 'page') return;
    if(e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){
      e.preventDefault(); rdSetPage(rd.pageIdx + 1);
    } else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){
      e.preventDefault(); rdSetPage(rd.pageIdx - 1);
    }
  };
  readerEl._onKey = onKey;
  window.addEventListener('keydown', onKey);

  requestAnimationFrame(()=> requestAnimationFrame(()=>{
    if(!rd) return;
    rdLayout();
    rdSeek(rd.ratio);
    rdPaintUI();
    rdShowUI();
  }));
}

/* ---------- 排版 / 分页 ---------- */
function rdLayout(){
  if(!rd || !readerEl) return;
  const stage = readerEl.querySelector('.rd-stage');
  const W = Math.max(240, Math.min(Math.floor(stage.clientWidth), 700));
  const H = Math.floor(stage.clientHeight);
  if(!H) return;
  rd.W = W; rd.H = H;
  const view = readerEl.querySelector('[data-role="view"]');
  view.style.left = '50%';
  view.style.width = W + 'px';
  view.style.marginLeft = (-W / 2) + 'px';
  rdBuildPages(W, H);
  rdCacheTops();
}

function rdBuildPages(W, H){
  /* 滚动模式下 pager 是 display:none，元素不参与布局、测不到高度，
     分页测量期间临时显示（同步执行，不会产生可见闪烁） */
  const pager = readerEl.querySelector('[data-role="pager"]');
  const wasHidden = getComputedStyle(pager).display === 'none';
  if(wasHidden){ pager.style.display = 'block'; pager.style.pointerEvents = 'none'; }
  const track = readerEl.querySelector('[data-role="track"]');
  track.innerHTML = '';
  rd.pages = []; rd.chapterPage = [];
  /* padding-bottom 不挡内容，scrollHeight 又总等于 clientHeight，
     只能拿最后一个块的底边跟"内容区底边"比 */
  const over = el => {
    const last = el.lastElementChild;
    if(!last) return false;
    const pb = parseFloat(getComputedStyle(el).paddingBottom) || 0;
    const box = el.getBoundingClientRect();
    return last.getBoundingClientRect().bottom > box.top + el.clientHeight - pb + 1;
  };
  const newPage = ()=>{
    const el = document.createElement('div');
    el.className = 'pg';
    el.style.width = W + 'px';
    el.style.height = H + 'px';
    track.appendChild(el);
    rd.pages.push(el);
    return el;
  };
  let page = null;
  rdChapters.forEach((c, ci)=>{
    if(!page) page = newPage();
    /* 章节标题接在正文流里（网文阅读器的排法），放不下或会变成孤标题才起新页 */
    const head = document.createElement('div');
    head.className = 'rd-ch-head';
    head.innerHTML = `<div class="rd-ch-n">${c.n}</div><div class="rd-ch-t">${c.t}</div>`;
    page.appendChild(head);
    {
      const pr = page.getBoundingClientRect();
      const bottom = head.getBoundingClientRect().bottom - pr.top;
      const room = page.clientHeight - bottom - 84;
      if(page.scrollHeight > page.clientHeight + 1 || (page.childNodes.length > 1 && room < 168)){
        page.removeChild(head);
        page = newPage();
        page.appendChild(head);
      }
    }
    rd.chapterPage[ci] = rd.pages.length - 1;

    c.p.forEach(text=>{
      let rest = text, cont = false;
      while(rest.length){
        const p = document.createElement('p');
        if(cont) p.className = 'cont';
        p.textContent = rest;
        page.appendChild(p);
        if(!over(page)) return;      // 整段放下了

        /* 放不下：本页若还剩两行以上，就断段续排（真书就是这样排的） */
        page.removeChild(p);
        const lineH = parseFloat(getComputedStyle(p).lineHeight) || 30;
        const pb = parseFloat(getComputedStyle(page).paddingBottom) || 0;
        const pt = parseFloat(getComputedStyle(page).paddingTop) || 0;
        const pr = page.getBoundingClientRect();
        const last = page.lastElementChild;
        const usedH = last ? (last.getBoundingClientRect().bottom - pr.top) : pt;
        const avail = page.clientHeight - usedH - pb;

        if(page.childNodes.length && avail < lineH * 1.8){
          page = newPage();
          continue;
        }
        let lo = 1, hi = rest.length, best = 0;
        const cut = document.createElement('p');
        if(cont) cut.className = 'cont';
        page.appendChild(cut);
        while(lo <= hi){
          const mid = (lo + hi) >> 1;
          cut.textContent = rest.slice(0, mid);
          if(over(page)) hi = mid - 1;
          else { best = mid; lo = mid + 1; }
        }
        if(best < 6){
          page.removeChild(cut);
          if(!page.childNodes.length){          // 空页连几个字都放不下：强行放入，避免死循环
            cut.textContent = rest;
            page.appendChild(cut);
            return;
          }
          page = newPage();
          continue;
        }
        if(rest.length - best < 24){        // 下一行只剩几个字：整段挪到下一页，避免孤字尾
          page.removeChild(cut);
          page = newPage();
          continue;
        }
        cut.textContent = rest.slice(0, best);
        rest = rest.slice(best);
        cont = true;
        page = newPage();
      }
    });
  });
  if(!rd.pages.length) newPage();
  if(wasHidden){ pager.style.display = ''; pager.style.pointerEvents = ''; }
}

function rdCacheTops(){
  if(!rd) return;
  const sc = readerEl.querySelector('[data-role="scroll"]');
  /* 左右翻页时滚动容器 display:none，量出来全是 0 */
  if(getComputedStyle(sc).display === 'none'){ rd.topsDirty = true; return; }
  rd.topsDirty = false;
  const base = sc.scrollTop;
  const top = sc.getBoundingClientRect().top;
  rd.chapterTops = [...sc.querySelectorAll('.rd-ch-head')].map(h=>
    h.getBoundingClientRect().top - top + base
  );
}

/* ---------- 状态 ---------- */
function rdCurrentRatio(){
  if(!rd) return 0;
  if(rd.mode === 'page'){
    const n = rd.pages.length;
    return n > 1 ? rd.pageIdx / (n - 1) : 0;
  }
  const sc = readerEl.querySelector('[data-role="scroll"]');
  const max = sc.scrollHeight - sc.clientHeight;
  return max > 0 ? Math.min(1, Math.max(0, sc.scrollTop / max)) : 0;
}

function rdCurCh(){
  if(!rd) return 0;
  if(rd.mode === 'page'){
    let k = 0;
    rd.chapterPage.forEach((p,i)=>{ if(rd.pageIdx >= p) k = i; });
    return k;
  }
  const sc = readerEl.querySelector('[data-role="scroll"]');
  const y = sc.scrollTop + 130;
  let k = 0;
  rd.chapterTops.forEach((t,i)=>{ if(y >= t) k = i; });
  return k;
}

function rdPaintUI(){
  if(!rd || !rd.ui) return;
  const r = rdCurrentRatio();
  rd.ratio = r;
  const pct = Math.round(r * 100);
  const ch = rdCurCh();
  rd.ui.pct.textContent = pct + '%';
  rd.ui.fill.style.width = pct + '%';
  rd.ui.knob.style.left = pct + '%';
  rd.ui.pn.textContent = rd.mode === 'page'
    ? `${rd.pageIdx + 1} / ${rd.pages.length}`
    : `第 ${ch + 1} 章`;
  rd.ui.chline.textContent = `${rdChapters[ch].n} · ${rdChapters[ch].t}`;
  rd.ui.toc.forEach((el,i)=> el.classList.toggle('on', i === ch));
}

function rdSeek(r){
  if(!rd) return;
  r = Math.min(1, Math.max(0, r));
  if(rd.mode === 'page'){
    const n = rd.pages.length;
    rdSetPage(n > 1 ? Math.round(r * (n - 1)) : 0, false);
  } else {
    const sc = readerEl.querySelector('[data-role="scroll"]');
    const max = sc.scrollHeight - sc.clientHeight;
    sc.scrollTop = max > 0 ? r * max : 0;
    rdPaintUI();
  }
}

function rdSetPage(i, anim){
  if(!rd || !rd.pages.length) return;
  rd.pageIdx = Math.max(0, Math.min(rd.pages.length - 1, i));
  const track = readerEl.querySelector('[data-role="track"]');
  track.style.transition = anim === false ? 'none' : 'transform .32s cubic-bezier(.24,.72,.26,1)';
  track.style.transform = `translate3d(${-rd.pageIdx * rd.W}px,0,0)`;
  rdPaintUI();
}

function rdTapPage(x){
  const view = readerEl.querySelector('[data-role="view"]');
  const r = view.getBoundingClientRect();
  const rel = (x - r.left) / r.width;
  if(rel < 0.28) return rdSetPage(rd.pageIdx - 1);
  if(rel > 0.72) return rdSetPage(rd.pageIdx + 1);
  rdToggleUI();
}

/* ---------- 阅读设置 ---------- */
function rdSetFs(k){
  if(!rd) return;
  const r = rdCurrentRatio();
  rd.fs = k;
  readerEl.style.setProperty('--rd-fs', RD_FS[k] + 'px');
  readerEl.style.setProperty('--rd-lh', k >= 2 ? 1.82 : 1.9);
  [...readerEl.querySelectorAll('[data-fs]')].forEach(b=> b.classList.toggle('on', +b.dataset.fs === k));
  rdBuildPages(rd.W, rd.H);
  rdCacheTops();
  rdSeek(r);
}

function rdSetTheme(t){
  if(!rd) return;
  rd.theme = t;
  readerEl.dataset.theme = t;
  [...readerEl.querySelectorAll('[data-tp]')].forEach(d=> d.classList.toggle('on', d.dataset.tp === t));
}

function rdSetMode(m){
  if(!rd || rd.mode === m) return;
  const r = rdCurrentRatio();
  rd.mode = m;
  readerEl.dataset.mode = m;
  [...readerEl.querySelectorAll('[data-mode]')].forEach(b=> b.classList.toggle('on', b.dataset.mode === m));
  if(rd.sheet) rdCloseSheet();
  if(m === 'page'){
    rdSeek(r);
    if(!rd.tipShown){
      rd.tipShown = true;
      rdShowTip('左右滑动，或点击屏幕两侧翻页');
    }
  } else {
    if(rd.topsDirty || !rd.chapterTops.length) rdCacheTops();
    const sc = readerEl.querySelector('[data-role="scroll"]');
    const max = sc.scrollHeight - sc.clientHeight;
    sc.scrollTop = Math.max(0, r * max);
    rdPaintUI();
  }
}

function rdGoChapter(ci){
  if(!rd) return;
  rdCloseSheet();
  if(rd.mode === 'page'){
    rdSetPage(rd.chapterPage[ci] || 0);
  } else {
    const sc = readerEl.querySelector('[data-role="scroll"]');
    sc.scrollTo({ top: Math.max(0, (rd.chapterTops[ci] || 0) - 62), behavior: 'smooth' });
  }
}

/* ---------- 面板 / 工具栏 ---------- */
function rdOpenSheet(name){
  if(!rd) return;
  if(rd.sheet === name) return rdCloseSheet();
  readerEl.querySelectorAll('.rd-tip').forEach(t=> t.remove());
  rd.sheet = name;
  clearTimeout(rdUiTimer);
  readerEl.classList.remove('hide-ui');
  readerEl.querySelectorAll('.rd-sheet').forEach(s=> s.classList.toggle('on', s.dataset.panel === name));
  readerEl.querySelector('[data-role="veil"]').classList.add('on');
  rdPaintUI();
}
function rdCloseSheet(){
  if(!rd) return;
  rd.sheet = null;
  readerEl.querySelectorAll('.rd-sheet').forEach(s=> s.classList.remove('on'));
  readerEl.querySelector('[data-role="veil"]').classList.remove('on');
  rdShowUI();
}
function rdShowUI(){
  if(!readerEl) return;
  clearTimeout(rdUiTimer);
  readerEl.classList.remove('hide-ui');
  rdUiTimer = setTimeout(()=>{
    if(readerEl && rd && !rd.sheet) readerEl.classList.add('hide-ui');
  }, 3600);
}
function rdToggleUI(){
  if(!readerEl) return;
  if(readerEl.classList.contains('hide-ui')) rdShowUI();
  else { clearTimeout(rdUiTimer); readerEl.classList.add('hide-ui'); }
}
function rdShowTip(txt){
  if(!readerEl) return;
  const el = document.createElement('div');
  el.className = 'rd-tip';
  el.textContent = txt;
  readerEl.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('on'));
  setTimeout(()=>{ el.classList.remove('on'); setTimeout(()=> el.remove(), 400); }, 2600);
}

/* 尺寸变化后重新分页，保持当前进度 */
let rdResizeT = 0;
window.addEventListener('resize', ()=>{
  if(!rd) return;
  clearTimeout(rdResizeT);
  rdResizeT = setTimeout(()=>{
    if(!rd) return;
    const r = rdCurrentRatio();
    rdLayout();
    rdSeek(r);
  }, 160);
});

function closeReader(){
  if(!readerEl) return;
  const r = rd ? rdCurrentRatio() : 0;
  const rp = Math.round(Math.min(1, Math.max(0, r)) * 100);
  if(readingIdx >= 0){ BOOKS[readingIdx].prog = rp; persist(); }

  /* 同步封面卡：按钮文案 + 同色填充宽度 + 百分比 */
  const btn = infoEl && infoEl.querySelector('.reader-btn');
  if(btn){
    const fill = btn.querySelector('.rb-fill');
    const txt = btn.querySelector('.rb-t');
    let pp = btn.querySelector('.rb-p');
    if(fill) fill.style.width = rp + '%';
    if(txt) txt.textContent = rp >= 100 ? '重新阅读' : (rp <= 0 ? '开始阅读' : '继续阅读');
    if(rp > 0 && !pp){ pp = document.createElement('span'); pp.className = 'rb-p'; btn.appendChild(pp); }
    if(pp){ pp.textContent = rp + '%'; pp.style.display = rp > 0 ? '' : 'none'; }
  }

  clearTimeout(rdUiTimer);
  clearTimeout(rdResizeT);
  if(readerEl._onKey) window.removeEventListener('keydown', readerEl._onKey);
  const el = readerEl;
  el.classList.add('closing');
  setTimeout(()=> el.remove(), 250);
  readerEl = null; readingIdx = -1; rd = null;
}

/* ================= 2. 电影 ================= */
/* ================= 电影 · 从海报展开详情 ================= */
let mvCard = null, mvInfo = null, mvMask = null, mvSrcEl = null;

function focusMovie(p, i){
  if(mvCard) return;
  const m = MOVIES[i];
  const r = p.getBoundingClientRect();
  const W = window.innerWidth, H = window.innerHeight;
  const portrait = W < 760;

  let cw, ch, cx, cy, infoW, infoLeft, infoTop;
  if(portrait){
    cw = Math.min(W*0.62, 250); ch = cw*1.5;
    cx = (W-cw)/2; cy = Math.max(58, H*0.07);
    infoW = Math.min(cw, 320); infoLeft = cx; infoTop = cy + ch + 24;
  }else{
    cw = Math.min(W*0.22, 286); ch = cw*1.5;
    infoW = Math.min(360, W*0.42);
    const gap = 56, total = cw + gap + infoW;
    cx = Math.max(40, (W - total)/2);          /* 海报 + 文字整体居中 */
    cy = Math.max(56, (H-ch)/2 - 6);
    infoLeft = cx + cw + gap; infoTop = cy + 4;
  }

  const mask = document.createElement('div');
  mask.className = 'mv-mask';
  document.body.appendChild(mask);
  mask.getBoundingClientRect();            /* 让起始态先落地，再触发过渡 */
  mask.classList.add('on');

  /* 卡片直接按终态尺寸建好，再用一个 scale 反向“贴”回原海报的位置 */
  const sx = r.width / cw, sy = r.height / ch;
  const tx = r.left - cx,  ty = r.top  - cy;

  const card = document.createElement('div');
  card.className = 'mv-card';
  card.style.cssText =
    `left:${cx}px;top:${cy}px;width:${cw}px;height:${ch}px;` +
    `background:${grad(m.g)};border-radius:12px;` +
    `transform:translate3d(${tx}px,${ty}px,0) scale(${sx},${sy})`;
  card.innerHTML = `<div class="mv-pt">${m.t}</div><div class="mv-py">${m.y}</div>`;
  document.body.appendChild(card);
  card._from = { tx, ty, sx, sy, cw, ch, cx, cy };
  if(m.poster){
    mediaURL(m.poster).then(u=>{
      if(u && mvCard === card){ card.style.backgroundImage = `url("${u}")`; card.style.backgroundSize = 'cover'; card.style.backgroundPosition = 'center'; card.classList.add('hasimg'); }
    });
  }

  const info = document.createElement('div');
  info.className = 'mv-info';
  info.innerHTML = `
    <div class="mv-tt">${m.t}</div>
    <div class="mv-meta">${m.y} · ${m.dur} · ${m.genre}</div>
    <div class="mv-line"><i>导演</i><b>${m.dir}</b></div>
    <div class="mv-line"><i>主演</i><b>${m.cast}</b></div>
    <p class="mv-desc">${m.d}</p>
    <div class="itemops">
      <button data-act="edit">编辑</button>
      <button data-act="del" class="danger">删除</button>
      <span class="divider"></span>
      <button class="mv-x" data-act="close">收起</button>
    </div>`;
  document.body.appendChild(info);

  info.style.left = infoLeft + 'px';
  info.style.top = infoTop + 'px';
  info.style.width = infoW + 'px';
  if(portrait){
    info.style.maxHeight = Math.max(120, H - infoTop - 84) + 'px';
    info.classList.add('compact');   // 竖屏：片名已在海报上，文字区不重复
  }

  p.style.visibility = 'hidden';
  mvCard = card; mvInfo = info; mvMask = mask; mvSrcEl = p;

  info.getBoundingClientRect();            /* 先把透明起始态算进样式，再触发过渡 */
  /* 原来的曲线太“前重后轻”：80ms 就走完 80%，剩下 300ms 几乎不动，看着像卡住 */
  card.style.transition = 'transform .46s cubic-bezier(.25,.65,.3,1)';
  card.style.transform = 'translate3d(0,0,0) scale(1,1)';
  requestAnimationFrame(()=> info.classList.add('on'));

  /* 刚展开的 260ms 内忽略遮罩点击：手快点两下不至于刚打开就关掉 */
  const openedAt = performance.now();
  mask.onclick = ()=>{ if(performance.now() - openedAt > 260) closeMovie(); };
  info.querySelectorAll('[data-act]').forEach(b=>{
    b.onclick = ()=>{
      const a = b.dataset.act;
      if(a === 'close') return closeMovie();
      if(a === 'edit') return editItem('movie', i);
      if(a === 'del') return deleteItem('movie', i);
    };
  });
}

function closeMovie(){
  if(!mvCard) return;
  const card = mvCard, info = mvInfo, mask = mvMask, src = mvSrcEl;
  mvCard = null; mvInfo = null; mvMask = null; mvSrcEl = null;

  const f = card._from || { tx:0, ty:0, sx:1, sy:1, cw:0, ch:0, cx:0, cy:0 };
  const cw = card.offsetWidth || f.cw, ch = card.offsetHeight || f.ch;
  const cx = parseFloat(card.style.left) || f.cx, cy = parseFloat(card.style.top) || f.cy;

  /* 海报可能已经被滚动带走，实时取一次；取不到就原地缩成一个小点 */
  let r = null;
  if(src && src.isConnected) r = src.getBoundingClientRect();
  const sx = r ? r.width / cw : 0.18, sy = r ? r.height / ch : 0.18;
  const tx = r ? r.left - cx : 0,      ty = r ? r.top - cy : 0;

  info.classList.remove('on');
  card.classList.add('closing');
  mask.style.transition = 'opacity .2s ease .2s';   /* 遮罩晚一点退，别让背景抢在前头亮起来 */
  mask.classList.remove('on');

  card.style.transition = 'transform .38s cubic-bezier(.4,0,.25,1), opacity .14s ease .22s';
  card.style.transform = `translate3d(${tx}px,${ty}px,0) scale(${sx},${sy})`;
  card.style.opacity = '0';

  /* 缩到与原海报重合时把海报放出来，剩下的淡出盖在它上面，看不出切换 */
  if(src) setTimeout(()=>{ if(src.isConnected) src.style.visibility = ''; }, 210);
  setTimeout(()=>{
    card.remove(); info.remove(); mask.remove();
    if(src && src.isConnected) src.style.visibility = '';
  }, 400);
}

function buildMovie(){
  const el = document.createElement('section');
  el.className = 'scene'; el.id = 's-movie';
  el.innerHTML = `<div class="kicker" style="color:var(--text2)"><b>电影</b> · ${MOVIES.length} 部</div>
    <div class="mwall"><div class="mgrid"></div></div>`;
  const mgrid = $('.mgrid', el);
  const mwall = $('.mwall', el);
  MOVIES.forEach((m,i)=>{
    const d = document.createElement('div');
    d.className = 'poster'; d.style.background = grad(m.g);
    if(m.poster) d.dataset.bid = m.poster;
    d.innerHTML = `<div class="pt">${m.t}</div><div class="py">${m.y}</div>`;
    d.onclick = ()=>focusMovie(d, i);
    mgrid.appendChild(d);
  });
  hydrate(mgrid);
  const posters = $$('.poster', mgrid);
  let ticking = false;
  function depth(){
    const cy = window.innerHeight / 2;
    posters.forEach(p=>{
      const r = p.getBoundingClientRect();
      const c = r.top + r.height/2;
      const dist = Math.abs(c - cy) / window.innerHeight;
      const k = Math.min(dist, .85) / .85;
      /* 只用 transform + opacity：合成层内完成，滚动不触发重绘 */
      p.style.transform = `scale(${1 - k*0.32}) translateZ(0)`;
      p.style.opacity = String(1 - k*0.78);
    });
  }
  mwall.addEventListener('scroll', ()=>{ if(!ticking){ requestAnimationFrame(()=>{ depth(); ticking=false; }); ticking = true; } });
  return { el, enter(){ depth(); }, depth,
    goto(i){ const p = posters[i]; if(p) scrollToEl(mwall, p); }
  };
}

/* ================= 3. 剧集 ================= */
let fanIdx = 1, fcards = [], fanCap;
function buildTv(){
  const el = document.createElement('section');
  el.className = 'scene'; el.id = 's-tv';
  el.innerHTML = `<div class="kicker" style="color:var(--text2)"><b>剧集</b> · ${TVS.length} 部</div>
    <div class="fanwrap"><div class="fan"></div><div class="fan-cap"></div>
    <div class="fan-nav"><span>‹</span><span>›</span></div></div>`;
  const fanEl = $('.fan', el);
  fanCap = $('.fan-cap', el);
  const nav = $('.fan-nav', el);
  fanCap.onclick = e=>{
    const b = e.target.closest('[data-act]'); if(!b) return;
    e.stopPropagation();
    if(b.dataset.act === 'edit') editItem('tv', fanIdx);
    else deleteItem('tv', fanIdx, ()=>{ fanIdx = Math.max(0, Math.min(TVS.length - 1, fanIdx)); });
  };
  let suppress = false;   // 刚拖动完的那一下不算点击

  TVS.forEach((s,i)=>{
    const d = document.createElement('div');
    d.className = 'fcard'; d.style.background = grad(s.g);
    if(s.poster) d.dataset.bid = s.poster;
    d.innerHTML = `<div class="fring" style="--p:${s.ep}%"><b>${s.ep===0?'未看':s.ep+'%'}</b></div>
      <div class="ft">${s.t}</div><div class="fs">${s.s}</div>`;
    d.onclick = ()=>{
      if(suppress) return;
      if(i===fanIdx){ showEp(i); } else { fanIdx = i; fanLayout(); }
    };
    fanEl.appendChild(d);
  });
  fcards = $$('.fcard', fanEl);
  hydrate(fanEl);
  nav.children[0].onclick = ()=>fanMove(-1);
  nav.children[1].onclick = ()=>fanMove(1);

  /* 左右滑动切卡：1:1 跟手，位移或甩速达到任一条件即切 */
  let down = false, moved = false, sx = 0, dx = 0, lastX = 0, lastT = 0, vel = 0, raf = 0;
  const paint = ()=>{
    raf = 0;
    if(!down) return;
    /* 边界（第一张再右滑 / 最后一张再左滑）加阻尼，其余跟手 */
    const atEdge = (fanIdx <= 0 && dx > 0) || (fanIdx >= TVS.length-1 && dx < 0);
    const f = atEdge ? 0.26 : 0.55;
    const mx = dx * f;
    /* 位移只走一半多，倾斜放大到 0.09deg/px：手一动整叠就歪，反馈快，但不至于滑出画面 */
    fanEl.style.transform = `translate3d(${mx.toFixed(1)}px,0,0) rotate(${(mx*0.09).toFixed(2)}deg)`;
  };
  const start = e=>{
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    down = true; moved = false; sx = e.clientX; dx = 0;
    lastX = e.clientX; lastT = e.timeStamp; vel = 0;
    fanEl.classList.add('drag');
    fanEl.setPointerCapture && fanEl.setPointerCapture(e.pointerId);
  };
  const move = e=>{
    if(!down) return;
    dx = e.clientX - sx;
    const dt = e.timeStamp - lastT;
    if(dt > 0) vel = (e.clientX - lastX) / dt;   /* px/ms */
    lastX = e.clientX; lastT = e.timeStamp;
    if(!moved && Math.abs(dx) > 4) moved = true;
    if(moved && !raf) raf = requestAnimationFrame(paint);
  };
  const end = ()=>{
    if(!down) return;
    down = false;
    if(raf){ cancelAnimationFrame(raf); raf = 0; }
    fanEl.classList.remove('drag');
    fanEl.style.transform = '';
    if(moved){
      suppress = true;
      setTimeout(()=>{ suppress = false; }, 260);
      /* 慢速拖动看距离（>28px），快速甩动看速度（>0.35px/ms） */
      if(Math.abs(dx) > 26 || Math.abs(vel) > 0.3) fanMove((dx || vel) < 0 ? 1 : -1);
    }
    dx = 0; vel = 0;
  };
  fanEl.addEventListener('pointerdown', start);
  fanEl.addEventListener('pointermove', move);
  fanEl.addEventListener('pointerup', end);
  fanEl.addEventListener('pointercancel', end);

  return { el, enter(){ fanLayout(); },
    goto(i){ fanIdx = Math.max(0, Math.min(TVS.length-1, i)); fanLayout(); showEp(fanIdx); }
  };
}
function fanLayout(){
  fcards.forEach((c,i)=>{
    const off = i - fanIdx, rot = off*7, tx = off*34, ty = Math.abs(off)*9;
    if(i===fanIdx){ c.style.transform='translateY(-26px) scale(1.06) rotate(0deg)'; c.style.zIndex=50; c.classList.add('active'); }
    else { c.style.transform=`translateY(${ty}px) translateX(${tx}px) rotate(${rot}deg) scale(.93)`; c.style.zIndex=10-Math.abs(off); c.classList.remove('active'); }
  });
  const s = TVS[fanIdx];
  const brief = (s.d || '').length > 86 ? s.d.slice(0, 86).trim() + '…' : (s.d || '');
  fanCap.innerHTML = `<h3>${s.t}</h3><p>${brief}</p>
    <div class="epbar"><i style="width:${s.ep}%"></i></div>
    <p style="margin-top:9px;font-size:10.5px;opacity:.4">${s.ep===0?'还没开始':s.ep===100?'已看完':'进度 '+s.ep+'%'}</p>
    <div class="itemops solid">
      <button data-act="edit">编辑</button>
      <button data-act="del" class="danger">删除</button>
    </div>`;
}
function fanMove(dir){ fanIdx = Math.max(0, Math.min(TVS.length-1, fanIdx+dir)); fanLayout(); }
function showEp(i){ const c=fcards[i]; c.style.transform='translateY(-46px) scale(1.1)'; setTimeout(()=>c.style.transform='translateY(-26px) scale(1.06)',260); }

/* ================= 4. 图片 · 画廊 ================= */
let picEls = [], picZoom = null, picView = [], picCat = '全部';
let picMask = null, picCap = null, imgCloseBtn = null;

function picCols(){
  const w = window.innerWidth;
  if(w < 700) return 2;
  if(w < 1120) return 3;
  return 4;
}

const picCount = c => c === '全部' ? PICS.length : PICS.filter(p=>p.cat===c).length;

function buildImage(){
  const el = document.createElement('section');
  el.className = 'scene'; el.id = 's-image';

    goto(i){

function renderPics(el){
  const gal = $('.gallery', el);
  const n = picCols();
  if(gal.querySelectorAll('.gcol').length !== n){
    gal.innerHTML = Array.from({length:n}, ()=>'<div class="gcol"></div>').join('');
  } else {
    $$('.gcol', gal).forEach(c=> c.innerHTML = '');
  }
  const cols = $$('.gcol', gal);
  picView = PICS.map((p,i)=>({p,i})).filter(x=> picCat === '全部' || x.p.cat === picCat);
  picEls = [];
  const colH = new Array(cols.length).fill(0);   /* 按当前列高分配，图片长短不一时各列才齐 */
  picView.forEach((x,k)=>{
    const p = x.p;
    const d = document.createElement('div');
    d.className = 'pic';
    d.dataset.i = x.i;
    d.style.setProperty('--ar', p.ar || 1.2);
    d.style.setProperty('--g0', p.g[0]);
    d.style.setProperty('--g1', p.g[1]);
    /* 真实图（缩略图优先）异步填充，先显示渐变色占位 */
    d.dataset.bid = p.thumb || p.src || '';
    d.innerHTML = `<div class="img"></div><div class="shine"></div><div class="cap">${p.t}</div>`;
    d.onclick = ()=> focusPic(k);
    let ci = 0;
    for(let j=1;j<colH.length;j++) if(colH[j] < colH[ci]) ci = j;
    colH[ci] += 1 / (p.ar || 1.2) + 0.09;
    cols[ci].appendChild(d);
    picEls.push(d);
  });
  const cnt = $('[data-role="cnt"]', el); if(cnt) cnt.textContent = picView.length;
  const kb = $('.kicker b', el); if(kb) kb.textContent = picCat === '全部' ? '图集' : picCat;
  if(!picView.length){
    const e = document.createElement('div');
    e.style.cssText = 'padding:60px 8px;color:var(--text3);font-size:12px;line-height:1.9';
    e.innerHTML = '这个分类还是空的<br>点右上角 ＋ 添加图片，或从菜单里换个分类';
    cols[0].appendChild(e);
    picEls = [e];
  }
  hydrate(gal);
}

/* 把容器里带 data-bid 的元素异步填充为真实图片（objectURL 有缓存） */
function hydrate(root){
  $$('[data-bid]', root).forEach(el=>{
    const id = el.dataset.bid;
    if(!id) return;
    const apply = u=>{
      if(el.classList.contains('dr-thumb')) el.style.backgroundImage = `url("${u}")`;
      else if(el.classList.contains('bcover')){ el.style.setProperty('--bkimg', `url("${u}")`); el.classList.add('hasimg'); }
      else if(el.classList.contains('poster') || el.classList.contains('fcard') || el.classList.contains('mvposter')){
        el.style.backgroundImage = `url("${u}")`; el.style.backgroundSize = 'cover'; el.style.backgroundPosition = 'center'; el.classList.add('hasimg');
      }
      else el.style.setProperty('--img', `url("${u}")`);
    };
    if(/^(data:|https?:|blob:)/i.test(id)){ apply(id); return; }
    mediaURL(id).then(u=>{ if(u) apply(u); });
  });
}

function revealPics(){
  picEls.forEach((p,i)=>{
    p.classList.remove('in');
    setTimeout(()=> p.classList.add('in'), 50 + i*70);
  });
}

function ensureImgMask(){

    picMask = document.createElement('div');
    picMask.className = 'imgmask';
    picMask.onclick = closePic;
    document.body.appendChild(picMask);

  return picMask;
}
function ensureImgCap(){
  if(!picCap){
    picCap = document.createElement('div'); picCap.className = 'imgcap';
    picCap.onclick = e=>{
      const b = e.target.closest('[data-act]'); if(!b) return;
      e.stopPropagation();

}
function ensureImgClose(){

    imgCloseBtn.onclick = closePic;

  }
  return imgCloseBtn;
}

function focusPic(k){
  if(picZoom) return;
  const el = picEls[k]; if(!el) return;
  const p = PICS[+el.dataset.i];
  const r = el.getBoundingClientRect();
  const W = window.innerWidth, H = window.innerHeight;

  ensureImgMask().classList.add('on');

  const clone = el.cloneNode(true);
  clone.className = 'pic in zoomed-pic';
  const c0 = clone.querySelector('.cap'); if(c0) c0.remove();
  const sh = clone.querySelector('.shine'); if(sh) sh.remove();
  clone.style.cssText += `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;` +
    `transform-origin:0 0;transform:none;transition:transform .52s cubic-bezier(.22,.9,.24,1);`;
  document.body.appendChild(clone);
  picZoom = clone; clone._src = el;
  el.style.visibility = 'hidden';
  /* 放大优先展示原图（列表缩略图只用于小图） */
  const fullId = p.src || p.thumb || '';
  if(fullId){
    mediaURL(fullId).then(u=>{ if(u && picZoom === clone) clone.style.setProperty('--img', `url("${u}")`); });
  }

  /* 目标：留出下方文字区 */
  const capH = 118;
  const maxW = Math.min(W - 32, 980), maxH = Math.max(200, H - capH - 96);
  const ar = r.width / r.height;
  let w = maxW, h = w / ar;
  if(h > maxH){ h = maxH; w = h * ar; }
  const left = (W - w) / 2, top = Math.max(50, (H - capH - h) / 2);
  clone._geo = { r:{left:r.left, top:r.top, width:r.width, height:r.height},
                 t:{left, top, width:w, height:h} };

  requestAnimationFrame(()=>{
    clone.style.transform = `translate(${(left-r.left).toFixed(1)}px,${(top-r.top).toFixed(1)}px) scale(${(w/r.width).toFixed(5)})`;
  });

  /* 展开完成后换成真实尺寸，避免放大后发虚 */
  setTimeout(()=>{
    if(picZoom !== clone) return;
    clone.style.transition = 'none';
    clone.style.left = left+'px'; clone.style.top = top+'px';
    clone.style.width = w+'px'; clone.style.height = h+'px';
    clone.style.transform = 'none';
    void clone.offsetWidth;
  }, 540);

  const cap = ensureImgCap();
  const pi = +el.dataset.i;
  cap.innerHTML = `<div class="iv-t">${p.t}</div><div class="iv-c">${p.cat || '未分类'}</div>
    <div class="itemops solid">
      <button data-act="edit">编辑</button>
      <button data-act="del" class="danger">删除</button>
    </div>`;
  cap.style.left = '0'; cap.style.width = '100%';
  cap.style.top = Math.min(H - capH + 6, top + h + 16) + 'px';
  cap.dataset.i = pi;
  requestAnimationFrame(()=> cap.classList.add('on'));
  ensureImgClose().classList.add('on');
}

function closePic(){
  if(!picZoom) return;
  const z = picZoom; picZoom = null;
  const g = z._geo;
  ensureImgMask().classList.remove('on');
  ensureImgCap().classList.remove('on');
  ensureImgClose().classList.remove('on');
  if(g){
    z.style.transition = 'transform .46s cubic-bezier(.4,0,.25,1), opacity .4s';
    z.style.left = g.t.left+'px'; z.style.top = g.t.top+'px';
    z.style.width = g.t.width+'px'; z.style.height = g.t.height+'px';
    z.style.transform = `translate(${(g.r.left-g.t.left).toFixed(1)}px,${(g.r.top-g.t.top).toFixed(1)}px) scale(${(g.r.width/g.t.width).toFixed(5)})`;
  }
  setTimeout(()=>{
    z.remove();
    if(z._src) z._src.style.visibility = '';
  }, 470);
}

function snapshot(){
  return { app:'拾间', v:2, at:new Date().toISOString(),

/* ---------- ZIP 打包（store 模式，无依赖；Flutter 对应 archive 库） ---------- */
const CRC_TABLE = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c; } return t; })();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
async function makeZip(entries){
  const chunks = []; const central = []; let offset = 0;
  const enc = new TextEncoder();
  for(const e of entries){
    const nameB = enc.encode(e.name);
    const data = new Uint8Array(await e.blob.arrayBuffer());
    const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, nameB.length, true);
    chunks.push(lh.buffer, nameB, data);
    central.push({ nameB, crc, size:data.length, offset });
    offset += 30 + nameB.length + data.length;
  }
  const cdStart = offset; let cdSize = 0;
  for(const c of central){
    const dh = new DataView(new ArrayBuffer(46));
    dh.setUint32(0, 0x02014b50, true); dh.setUint16(4, 20, true); dh.setUint16(6, 20, true);
    dh.setUint16(8, 0x0800, true); dh.setUint16(10, 0, true);
    dh.setUint32(16, c.crc, true); dh.setUint32(20, c.size, true); dh.setUint32(24, c.size, true);
    dh.setUint16(28, c.nameB.length, true); dh.setUint32(42, c.offset, true);
    chunks.push(dh.buffer, c.nameB);
    cdSize += 46 + c.nameB.length;
  }
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true); eo.setUint16(8, central.length, true);
  eo.setUint16(10, central.length, true); eo.setUint32(12, cdSize, true); eo.setUint32(16, cdStart, true);
  chunks.push(eo.buffer);
  return new Blob(chunks, { type:'application/zip' });
}
function blobExt(mime, name){
  if(name && /\.[a-z0-9]{2,5}$/i.test(name)) return name.match(/\.[a-z0-9]{2,5}$/i)[0].toLowerCase();
  if(/png/i.test(mime)) return '.png';
  if(/gif/i.test(mime)) return '.gif';
  if(/webp/i.test(mime)) return '.webp';
  if(/epub/i.test(mime)) return '.epub';
  if(/pdf/i.test(mime)) return '.pdf';
  if(/text|markdown/i.test(mime)) return '.txt';
  return '.jpg';
}
function blobMime(name){
  if(/\.png$/i.test(name)) return 'image/png';
  if(/\.gif$/i.test(name)) return 'image/gif';
  if(/\.webp$/i.test(name)) return 'image/webp';
  if(/\.epub$/i.test(name)) return 'application/epub+zip';
  if(/\.txt$|\.md$/i.test(name)) return 'text/plain';
  return 'image/jpeg';
}

function exportData(){
  (async ()=>{
    try{
      const meta = snapshot();
      const entries = [{ name:'拾间.json', blob:new Blob([JSON.stringify(meta, null, 1)], { type:'application/json' }) }];
      const seen = new Set();
      const addBlob = async (id, hint)=>{
        if(!id || seen.has(id)) return;
        const b = await Store.getBlob(id);
        if(!b) return;
        seen.add(id);
        entries.push({ name:'blobs/' + id + blobExt(b.type, hint), blob:b });
      };
      for(const b of meta.books){ if(b.fileId) await addBlob(b.fileId, b.file && b.file.name); if(b.cover) await addBlob(b.cover, 'cover'); }
      for(const m of meta.movies){ if(m.poster && m.poster.charAt(0)==='b') await addBlob(m.poster, 'poster'); }
      for(const t of meta.tv){ if(t.poster && t.poster.charAt(0)==='b') await addBlob(t.poster, 'poster'); }
      for(const p of meta.pics){ if(p.src) await addBlob(p.src, 'img'); if(p.thumb) await addBlob(p.thumb, 'thumb'); }
      const blob = await makeZip(entries);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const d = new Date();
      a.href = url;
      a.download = `拾间备份-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.zip`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 5000);
      toast(`已导出备份（${entries.length} 个文件，含 ${seen.size} 个图片/文件）`);
    }catch(e){ toast('导出失败：' + (e && e.message ? e.message : '换个浏览器试试')); }
  })();
}

function importData(){ $('#bakInput').click(); }

async function importZip(file){
  const buf = await file.arrayBuffer();
  const zip = await unzip(buf);
  const json = await zip.read('拾间.json');
  if(!json) throw new Error('备份里没有数据文件');
  const meta = JSON.parse(json);
  await Store.wipe();   /* 清掉旧的元数据与二进制，再整体还原 */
  for(const name of zip.order){
    const m = name.match(/^blobs\/([^/]+)(\.[a-z0-9]+)?$/i);
    if(!m) continue;
    const ab = await zip.readBytes(name);
    if(ab && ab.byteLength){
      const blob = new Blob([ab], { type: blobMime(name) });
      await Store.putBlob(m[1], blob, name, blob.type);
    }
  }
  applyBackup(meta);
}

function applyBackup(data){
  if(!data || !Array.isArray(data.books)) throw new Error('文件格式不对');
  BOOKS.length = 0; MOVIES.length = 0; TVS.length = 0; PICS.length = 0; LINKS.length = 0;
  BOOKS.push(...(data.books||[]));
  MOVIES.push(...(data.movies||[]));
  TVS.push(...(data.tv||data.tvs||[]));
  PICS.push(...(data.pics||[]));
  LINKS.push(...(data.links||[]));
  PIC_CATS = (data.cats && data.cats.length) ? data.cats.slice() : ['风景','城市','静物'];
  picCat = '全部';
  cur = Math.min(cur, Math.max(0, BOOKS.length-1));
  fanIdx = Math.min(fanIdx, Math.max(0, TVS.length-1));
  persist();
  ['book','movie','tv','image','link'].forEach(rebuild);
  goTab(active === 'video' ? 'video' : active);
}

/* 把元素滚到容器正中。
   不用 rect：海报有 scale 变换，rect 会随缩放漂移；
   改用 offsetTop 累积到滚动容器，拿到不受 transform 影响的布局位置。 */
function scrollToEl(scroller, el, dy){
  if(!scroller || !el) return;
  let top = 0, n = el;
  while(n && n !== scroller){ top += n.offsetTop; n = n.offsetParent; }
  const target = top - (scroller.clientHeight - el.offsetHeight)/2 + (dy||0);
  scroller.scrollTo({ top: Math.max(0, target), behavior:'smooth' });
}
function nearestIdx(scroller, els){
  if(!scroller || !els || !els.length) return 0;
  const cr = scroller.getBoundingClientRect(), cy = cr.top + cr.height/2;
  let best = 0, bd = Infinity;
  els.forEach((e,i)=>{
    const r = e.getBoundingClientRect();
    const d = Math.abs(r.top + r.height/2 - cy);
    if(d < bd){ bd = d; best = i; }
  });
  return best;
}

/* ================= 电子书导入 · 编码识别 ================= */
function fmtNum(n){ return String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function ebSize(n){ return n >= 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1, Math.round(n/1024)) + ' KB'; }

const ENC_LABEL = {'utf-8':'UTF-8','gb18030':'GB18030','gbk':'GBK','big5':'BIG5','utf-16le':'UTF-16 LE','utf-16be':'UTF-16 BE'};
const EB_MAX = 60000;   /* 网页原型里超过这个字数会截断：整本排版太慢，转 App 后去掉这个限制 */

/* 三段判断：BOM → 严格 UTF-8 → GB18030 / BIG5 比替换字符 */
function detectEnc(buf){
  const u = new Uint8Array(buf);
  if(u.length >= 3 && u[0] === 0xEF && u[1] === 0xBB && u[2] === 0xBF)
    return { enc:'utf-8', label:'UTF-8', note:'BOM' };
  if(u.length >= 2 && u[0] === 0xFF && u[1] === 0xFE)
    return { enc:'utf-16le', label:'UTF-16 LE', note:'BOM' };
  if(u.length >= 2 && u[0] === 0xFE && u[1] === 0xFF)
    return { enc:'utf-16be', label:'UTF-16 BE', note:'BOM' };

  /* 无 BOM 的 UTF-16：一半字节是 0 */
  const probe = Math.min(u.length, 8192);
  if(probe > 128){
    let zOdd = 0, zEven = 0;
    for(let i = 0; i < probe; i++) if(u[i] === 0){ i % 2 ? zOdd++ : zEven++; }
    if(zOdd > probe * 0.28 && zEven < probe * 0.04) return { enc:'utf-16le', label:'UTF-16 LE', note:'推测' };
    if(zEven > probe * 0.28 && zOdd < probe * 0.04) return { enc:'utf-16be', label:'UTF-16 BE', note:'推测' };
  }

  try{
    new TextDecoder('utf-8', { fatal:true }).decode(u);
    return { enc:'utf-8', label:'UTF-8', note:'' };
  }catch(_){}

  /* 简体 GB18030 与繁体 BIG5 结构相似，只能比谁解出来的坏字少 */
  const bad = enc => {
    let t = '';
    try{ t = new TextDecoder(enc).decode(u.subarray(0, Math.min(u.length, 60000))); }
    catch(_){ return 1e9; }
    let n = 0;
    for(let i = 0; i < t.length; i++) if(t.charCodeAt(i) === 0xFFFD) n++;
    return n;
  };
  const g = bad('gb18030'), b = bad('big5');
  return g <= b ? { enc:'gb18030', label:'GB18030', note:'GBK 兼容' }
                : { enc:'big5', label:'BIG5', note:'' };
}

function decodeBuf(buf, enc){
  try{ return new TextDecoder(enc || 'utf-8').decode(buf); }
  catch(_){ return new TextDecoder('utf-8').decode(buf); }
}

/* 折行的短句接回上一段，空行分段 */
function toParas(lines){
  const out = [];
  let buf = '';
  const push = ()=>{ const t = buf.trim(); if(t) out.push(t); buf = ''; };
  for(const raw of lines){
    const t = String(raw).replace(/[\s\u3000]+$/,'').trim();
    if(!t){ push(); continue; }
    const tail = buf.slice(-1);
    if(buf && buf.length < 260 && !/[。！？…」』”"’!?.；;：:]$/.test(tail)) buf += t;
    else { push(); buf = t; }
  }
  push();
  return out;
}

const EB_HEAD = /^\s*((?:第\s*[0-9零一二三四五六七八九十百千两〇]{1,12}\s*[章节回卷篇集话話幕])|序章|序言|楔子|引子|前言|尾声|后记|番外[^\n]{0,12}|附录[^\n]{0,12})\s*([^\n]{0,40})$/;

function parseTxt(text){
  const lines = text.replace(/\r\n?/g,'\n').replace(/\uFEFF/g,'').split('\n');
  const chs = [];
  let cur = null, buf = [];
  const flush = ()=>{
    if(!cur) return;
    const p = toParas(buf);
    if(p.length || cur.n) chs.push({ n:cur.n, t:cur.t, p: p.length ? p : ['（本章暂无内容）'] });
    cur = null;
  };
  for(const raw of lines){
    const t = raw.trim();
    if(t && t.length <= 46){
      const m = t.match(EB_HEAD);
      if(m){
        flush();
        cur = { n:m[1].replace(/\s+/g,' '), t:(m[2] || '').replace(/^[·\-—_\s]+/,'').trim(), p:[] };
        buf = [];
        continue;
      }
    }
    if(!cur){ cur = { n:'', t:'正文', p:[] }; buf = []; }
    buf.push(raw);
  }
  flush();

  let chapters, loose = false;
  if(chs.length >= 2){
    chapters = chs;
  } else {
    /* 全篇没有章节标记：按 3000 字一节切开，至少读得下去 */
    const paras = chs.length ? chs[0].p : toParas(lines);
    chapters = []; let bag = [], len = 0;
    paras.forEach(p=>{
      bag.push(p); len += p.length;
      if(len >= 3000){ chapters.push({ n:'', t:'', p:bag }); bag = []; len = 0; }
    });
    if(bag.length) chapters.push({ n:'', t:'', p:bag });
    loose = true;
  }

  /* 开头的书名、作者行会单独成章，字数很少又没有章名，直接并掉 */
  if(chs.length >= 3 && !chs[0].n && chs[0].p.join('').length < 80) chs.shift();

  /* 截断超长文本 */
  let total = 0, cut = false, kept = [];
  for(const c of chapters){
    const p = [];
    for(const para of c.p){
      if(total + para.length > EB_MAX){ cut = true; break; }
      total += para.length; p.push(para);
    }
    if(p.length) kept.push({ n:c.n, t:c.t, p });
    if(cut) break;
  }
  chapters = kept;
  chapters.forEach((c, i)=>{
    if(!c.n) c.n = '第' + (i+1) + '章';
    if(!c.t) c.t = loose ? '这一段' : '';
  });
  return { chapters, chars: total, truncated: cut };
}

/* ---------------- EPUB：手写最小 ZIP 读取 ---------------- */
async function unzip(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  const floor = Math.max(0, u8.length - 66000);
  for(let i = u8.length - 22; i >= floor; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('文件不是完整的 EPUB（找不到 ZIP 目录）');
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const map = {}, order = [];
  const nameDec = new TextDecoder('utf-8');
  for(let i = 0; i < count; i++){
    if(off + 46 > u8.length || dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const csize  = dv.getUint32(off + 20, true);
    const nlen   = dv.getUint16(off + 28, true);
    const elen   = dv.getUint16(off + 30, true);
    const clen   = dv.getUint16(off + 32, true);
    const lho    = dv.getUint32(off + 42, true);
    const name = nameDec.decode(u8.subarray(off + 46, off + 46 + nlen));
    map[name] = { method, csize, lho };
    order.push(name);
    off += 46 + nlen + elen + clen;
  }
  async function raw(name){
    const f = map[name];
    if(!f) return null;
    const l = f.lho;
    if(dv.getUint32(l, true) !== 0x04034b50) return null;
    const nlen = dv.getUint16(l + 26, true), elen = dv.getUint16(l + 28, true);
    const start = l + 30 + nlen + elen;
    const data = u8.subarray(start, start + f.csize);
    if(f.method === 0) return data.slice();
    if(typeof DecompressionStream === 'undefined') throw new Error('当前浏览器不支持解压 EPUB');
    const st = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(st).arrayBuffer());
  }
  async function read(name){
    const r = await raw(name);
    return r ? nameDec.decode(r) : null;
  }
  async function readBytes(name){
    const r = await raw(name);
    return r ? r.buffer : null;
  }
  return { map, order, read, readBytes };
}

function normPath(p){
  const out = [];
  p.split('/').forEach(seg=>{
    if(seg === '..') out.pop();
    else if(seg !== '.' && seg !== '') out.push(seg);
  });
  return out.join('/');
}

function htmlParas(html){
  const clean = String(html)
    .replace(/<\s*(script|style|head|svg)[\s\S]*?<\s*\/\s*\1\s*>/gi, '')
    .replace(/<\s*(br|hr)\s*\/?\s*>/gi, '\n')
    .replace(/<\s*\/\s*(p|div|h[1-6]|li|blockquote|tr|section|article|dd|dt)\s*>/gi, '\n\n');
  const box = document.createElement('div');
  box.innerHTML = clean;
  return (box.textContent || '')
    .split(/\n+/)
    .map(x => x.replace(/[ \t\u00a0]+/g, ' ').trim())
    .filter(x => x.length > 1);
}

async function parseEpub(buf){
  const zip = await unzip(buf);
  let opfPath = '';
  const cont = await zip.read('META-INF/container.xml');
  if(cont){
    const m = cont.match(/full-path\s*=\s*"([^"]+)"/i);
    if(m) opfPath = m[1];
  }
  if(!opfPath) opfPath = zip.order.find(n => /\.opf$/i.test(n)) || '';
  let title = '', author = '', description = '', language = '', publisher = '', pubDate = '', cover = null;
  let chapters = [], total = 0, cut = false;

  if(opfPath){
    const xml = await zip.read(opfPath);
    if(xml){
      const doc = new DOMParser().parseFromString(xml, 'application/xml');
      const pick = t => { const e = doc.getElementsByTagNameNS('*', t); return e.length ? (e[0].textContent || '').trim() : ''; };
      title = pick('title');
      author = pick('creator');
      description = pick('description');
      language = pick('language');
      publisher = pick('publisher');
      pubDate = pick('date');
      const dir = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';
      const items = {};
      [...doc.getElementsByTagNameNS('*', 'item')].forEach(el=>{
        items[el.getAttribute('id')] = { href: el.getAttribute('href'), media: el.getAttribute('media-type') || '' };
      });
      const ids = [...doc.getElementsByTagNameNS('*', 'itemref')].map(el => el.getAttribute('idref'));
      let hrefs = ids.map(id => items[id] && items[id].href).filter(Boolean);
      if(!hrefs.length) hrefs = Object.keys(items).map(k => items[k].href).filter(h => /\.x?html?$/i.test(h));

      /* —— 封面：EPUB2 meta name=cover → EPUB3 properties=cover-image → 兜底 id/media 含 cover —— */
      let coverId = '';
      const mc = doc.querySelector('meta[name="cover"]');
      if(mc) coverId = mc.getAttribute('content') || '';
      if(!coverId){
        const it = [...doc.getElementsByTagNameNS('*','item')].find(el => (el.getAttribute('properties')||'').split(/\s+/).includes('cover-image'));
        if(it) coverId = it.getAttribute('id');
      }
      if(!coverId){
        const it = [...doc.getElementsByTagNameNS('*','item')].find(el => /^image\//i.test(el.getAttribute('media-type')||'') && /cover/i.test(el.getAttribute('id')||''));
        if(it) coverId = it.getAttribute('id');
      }
      if(coverId && items[coverId]){
        let ch = items[coverId].href;
        try{ ch = decodeURIComponent(ch); }catch(_){}
        const ab = await zip.readBytes(normPath(dir + ch));
        if(ab && ab.byteLength){
          const mt = items[coverId].media || (/\.png$/i.test(ch) ? 'image/png' : /\.gif$/i.test(ch) ? 'image/gif' : /\.webp$/i.test(ch) ? 'image/webp' : 'image/jpeg');
          cover = new Blob([ab], { type: mt });
        }
      }

      for(const href of hrefs){
        let path = href;
        try{ path = decodeURIComponent(href); }catch(_){}
        const html = await zip.read(normPath(dir + path));
        if(!html) continue;
        let head = '';
        const hm = html.match(/<\s*h[1-3][^>]*>([\s\S]{0,140}?)<\s*\/\s*h[1-3]\s*>/i);
        if(hm) head = hm[1].replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
        if(!head){
          const tm = html.match(/<\s*title[^>]*>([\s\S]{0,140}?)<\s*\/\s*title\s*>/i);
          if(tm) head = tm[1].replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
        }
        const ps = htmlParas(html);
        if(!ps.length) continue;
        if(!head && ps[0].length <= 28) head = ps.shift();
        if(!ps.length) continue;
        chapters.push({ t: head || '正文', p: ps });
        total += ps.join('').length;
        if(total > EB_MAX){ cut = true; break; }
      }
    }
  }
  if(!chapters.length) throw new Error('这本 EPUB 里没有找到可读的正文');
  chapters.forEach((c, i)=>{
    const m = String(c.t || '').match(/^(第[0-9零一二三四五六七八九十百千两]{1,6}[章节回卷篇])\s*(.*)$/);
    if(m){ c.n = m[1]; c.t = m[2] || m[1]; }
    else c.n = '第' + (i+1) + '章';
  });
  return { title, author, description, language, publisher, date: pubDate, cover, chapters, chars: total, truncated: cut };
}

async function parseEbook(buf, name, forcedEnc){
  if(/\.epub$/i.test(name)){
    const r = await parseEpub(buf);
    return Object.assign(r, { enc:'utf-8', encLabel:'EPUB', encNote:'内置 UTF-8' });
  }
  const det = (forcedEnc && forcedEnc !== 'auto')
    ? { enc:forcedEnc, label:ENC_LABEL[forcedEnc] || forcedEnc, note:'手动指定' }
    : detectEnc(buf);
  const text = decodeBuf(buf, det.enc);
  const r = parseTxt(text);
  return Object.assign(r, { enc:det.enc, encLabel:det.label, encNote:det.note });
}

function paintEbook(){
  const box = $('#ebBox');
  if(!box) return;
  box.innerHTML = ebookHTML();
  const input = $('#ebInput');
  if(input) input.onchange = e=>{
    const file = e.target.files && e.target.files[0];
    if(file) handleEbook(file);
  };
  box.querySelectorAll('[data-eb="clear"]').forEach(b=>{
    b.onclick = e=>{ e.preventDefault(); ebBuf = null; ebName = ''; ebFile = null; paintEbook(); };
  });
  box.querySelectorAll('[data-enc]').forEach(b=>{
    b.onclick = e=>{
      e.preventDefault();
      if(ebEnc === b.dataset.enc) return;
      ebEnc = b.dataset.enc;
      if(ebBuf) runParse();
      else paintEbook();
    };
  });
}

async function handleEbook(file){
  if(!/\.(txt|md|markdown|epub)$/i.test(file.name)){
    toast('只支持 .txt / .md / .epub 文件');
    return;
  }
  if(file.size > 40 * 1024 * 1024){
    toast('文件超过 40 MB，先拆一下再导入');
    return;
  }
  ebName = file.name; ebBuf = null; ebEnc = 'auto';
  ebFile = { name:file.name, size:file.size, loading:true };
  paintEbook();
  try{
    ebBuf = await file.arrayBuffer();
    await runParse();
  }catch(err){
    ebFile = { name:file.name, size:file.size, error: err.message || '读取失败' };
    paintEbook();
  }
}

async function runParse(){
  if(!ebBuf) return;
  ebFile = { name:ebName, size:ebBuf.byteLength, loading:true };
  paintEbook();
  try{
    const r = await parseEbook(ebBuf, ebName, ebEnc);
    const title = r.title || guessTitle(ebName);
    const author = r.author || guessAuthor(ebName);
    ebFile = Object.assign({ name:ebName, size:ebBuf.byteLength }, r, { title, author });
    /* 封面：EPUB 内嵌封面优先；TXT/MD 没有就生成一张文字封面 */
    if(r.cover && r.cover.size){
      ebFile.cover = r.cover;
      ebFile.coverURL = URL.createObjectURL(r.cover);
    } else if(!r.cover){
      const tc = await genTextCover(title, author);
      if(tc){ ebFile.cover = tc.blob; ebFile.coverURL = tc.url; }
    }
    fillField('t', title);
    fillField('a', author);
    /* 简介：EPUB 元数据里的内容简介优先，但用户自己填过的不动 */
    if(!String(addValues.d || '').trim()){
      const desc = (r.description && r.description.trim()) || '';
      fillField('d', desc ? desc.slice(0, 240) : `从本地导入的电子书，共 ${r.chapters.length} 章。`);
    }
  }catch(err){
    ebFile = { name:ebName, size:ebBuf.byteLength, error: err.message || '解析失败' };
  }
  paintEbook();
}

/* 给没有封面的 TXT/MD 生成文字封面（书名 + 作者 + 渐变底）
 * 迁移 Flutter 时对应用 CustomPaint 绘制同样的封面 */
function genTextCover(title, author){
  return new Promise(res=>{
    try{
      const c = document.createElement('canvas');
      c.width = 600; c.height = 800;
      const x = c.getContext('2d');
      const g = pal((BOOKS.length + 3) % PALETTE.length);
      const gr = x.createLinearGradient(0, 0, 600, 800);
      gr.addColorStop(0, g[2]); gr.addColorStop(1, g[3]);
      x.fillStyle = gr; x.fillRect(0, 0, 600, 800);
      x.strokeStyle = 'rgba(255,255,255,.15)'; x.lineWidth = 2;
      x.strokeRect(46, 46, 508, 708);
      x.fillStyle = 'rgba(255,255,255,.96)';
      x.font = '600 52px "Songti SC","Noto Serif SC",serif';
      x.textAlign = 'center'; x.textBaseline = 'middle';
      wrapText(x, title || '未命名', 300, 360, 460, 68);
      x.fillStyle = 'rgba(255,255,255,.72)';
      x.font = '28px "Songti SC","Noto Serif SC",serif';
      x.fillText(author || '佚名', 300, 580, 480);
      c.toBlob(b=>{
        if(!b){ res(null); return; }
        res({ blob:b, url:URL.createObjectURL(b) });
      }, 'image/jpeg', .92);
    }catch(_){ res(null); }
  });
}
function wrapText(ctx, text, cx, cy, maxW, lineH){
  const chars = String(text || '').split('');
  let line = ''; const lines = [];
  for(const ch of chars){
    if(line && ctx.measureText(line + ch).width > maxW){ lines.push(line); line = ch; }
    else line += ch;
  }
  if(line) lines.push(line);
  const startY = cy - (lines.length - 1) * lineH / 2;
  lines.forEach((ln, i)=> ctx.fillText(ln, cx, startY + i * lineH, maxW));
}

function guessTitle(name){
  let base = String(name).replace(/\.[^.]+$/, '');
  const m = base.match(/《([^》]+)》\s*(.*)/);
  if(m) return m[1].trim();
  base = base.replace(/第[0-9一二三四五六七八九十]+[章节回卷].*$/, '').trim();
  const cut = base.split(/\s*[-—–_|]\s*|\s{2,}/).filter(Boolean);
  return (cut[0] || base).trim().slice(0, 40);
}
function guessAuthor(name){
  const base = String(name).replace(/\.[^.]+$/, '');
  const m = base.match(/《[^》]+》\s*(.*)/);
  if(m && m[1]) return m[1].replace(/^[-\s·]+/, '').trim().slice(0, 20);
  const cut = base.split(/\s*[-—–_|]\s*|\s{2,}/).filter(Boolean);
  return cut.length > 1 ? cut[cut.length-1].trim().slice(0, 20) : '';
}
function fillField(n, val){
  if(!val) return;
  if(ebTyped[n]) return;      /* 用户自己改过就不覆盖 */
  addValues[n] = val;
  const inp = AS.body.querySelector(`[data-f="${n}"]`);
  if(inp) inp.value = val;
}

function renderField(f){
  const v = addValues[f.n];
  if(f.type === 'ebook') return `<div class="fld"><label>${f.label}</label>
    <div id="ebBox">${ebookHTML()}</div></div>`;
  if(f.type === 'text') return `<div class="fld"><label>${f.label}${f.req?'<b>*</b>':''}</label>
    <input type="text" data-f="${f.n}" placeholder="${f.ph||''}" value="${esc(v)}" autocomplete="off" spellcheck="false"></div>`;
  if(f.type === 'textarea') return `<div class="fld"><label>${f.label}${f.req?'<b>*</b>':''}</label>
    <textarea data-f="${f.n}" placeholder="${f.ph||''}" autocomplete="off" spellcheck="false">${esc(v)}</textarea></div>`;
  if(f.type === 'chips') return `<div class="fld"><label>${f.label}</label>
    <div class="chips" data-chips="${f.n}">
      ${f.opts.map(o=>`<button type="button" class="chip${o===v?' on':''}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}
      ${f.addNew?`<button type="button" class="chip new" data-new="1">＋ 新建</button>`:''}
    </div></div>`;
  if(f.type === 'range') return `<div class="fld"><label>${f.label}</label>
    <div class="rangerow">
      <input class="range" type="range" min="0" max="100" step="1" data-f="${f.n}" value="${v}" style="--p:${v}%">
      <span class="rv">${v}%</span>
    </div></div>`;
  if(f.type === 'match') return `<div class="fld"><label>${f.label}</label>
    <div class="matchbox">
      <div class="match-q"><input type="text" id="matchQ" placeholder="${f.ph||'输入名字搜索'}" autocomplete="off" spellcheck="false"><button type="button" id="matchGo">搜索</button></div>
      <div class="match-status" id="matchStatus"></div>
      <div class="match-list" id="matchList"></div>
    </div></div>`;
  if(f.type === 'cover') return `<div class="fld"><label>${f.label}</label>
    <div id="cvHost">${coverHTML()}</div>
    <div class="hintline">不选就保持原封面；上面重新匹配成功后也会自动替换</div></div>`;
  if(f.type === 'upload') return `<div class="fld"><label>${f.label}</label>
    <div class="upbox" id="upBox">
      ${addUpload
        ? (addUpload.preview
            ? `<img src="${addUpload.preview}" alt="">`
            : `<span class="ph"><b>✓</b>已选好<br>点一下可更换</span>`)
          + `<button type="button" class="rm" id="upRm">移除</button>`
        : `<span class="ph"><b>＋</b>点这里选图<br>从相册或文件里挑</span>`}
      <input type="file" accept="image/*,.jpg,.jpeg,.png,.webp,.gif,.bmp,.heic,.heif" id="upInput">
    </div>
    <div class="hintline">图片按原图无损保存，不会上传到任何地方</div></div>`;
  return '';
}

/* 面板高度钉成像素：手机地址栏收放、软键盘弹出都会改 vh，
   面板跟着重算会连带里面整张表单重排；钉住之后键盘只能改滚动位置 */
function lockSheetHeight(el){
  const sh = el || AS.sheet;
  if(!sh) return;
  if(window.innerWidth > 820){ sh.style.height = ''; return; }
  const vh = document.documentElement.clientHeight || window.innerHeight;
  sh.style.height = Math.round(Math.min(vh * 0.9, 780)) + 'px';
}

function openForm(k){
  addType = k;
  const def = fieldDefs(k);
  formFields = def.fields;
  addValues = {};
  def.fields.forEach(f=> addValues[f.n] = f.val !== undefined ? f.val : '');
  matchPoster = null; matchRating = '';
  coverNew = null; coverCur = '';
  const editing = addMode === 'edit';
  let it = null;

  if(editing){
    it = COLL[k][addEdit];
    /* 换电子书等于重新导入整本，放到「重新添加」里做，编辑面板不掺这一层 */
    if(k === 'book'){ formFields = formFields.filter(f=> f.type !== 'ebook'); }
    /* 编辑时在「匹配」下方多给一个换封面的入口（图集用它自己的上传位） */
    if(k === 'book' || k === 'movie' || k === 'tv'){
      formFields.splice(1, 0, {n:'cover', label:'封面', type:'cover'});
    }
    Object.assign(addValues, itemToValues(k, it));
    if(k === 'book') coverCur = it.cover || '';
    if(k === 'movie' || k === 'tv'){
      coverCur = it.poster || '';
      matchRating = it.rating || '';
    }
    if(k === 'image' && (it.src || it.thumb)){
      addUpload = { preview:'', ar:it.ar || 1.2, keep:true, size:it.size, mime:it.mime };
      mediaURL(it.thumb || it.src).then(u=>{
        if(u && addUpload && addUpload.keep){ addUpload.preview = u; paintUpload(); }
      });
    }
  }

  AS.title.textContent = editing ? '编辑 · ' + (it.t || '未命名') : def.title;
  AS.back.classList.add('on');
  AS.foot.style.display = '';
  AS.sheet.classList.remove('compact');
  lockSheetHeight();
  if(k === 'book'){ ebFile = null; ebBuf = null; ebEnc = 'auto'; ebTyped = {t:false,a:false}; }
  AS.body.innerHTML = formFields.map(renderField).join('');
  AS.body.scrollTop = 0;
  if(k === 'book') paintEbook();
  if(editing && (k === 'book' || k === 'movie' || k === 'tv')) paintCover();

  AS.body.oninput = e=>{
    const el = e.target;
    if(!el.dataset.f) return;
    if(k === 'book' && (el.dataset.f === 't' || el.dataset.f === 'a')) ebTyped[el.dataset.f] = true;
    addValues[el.dataset.f] = el.value;
    if(el.classList.contains('range')){
      el.style.setProperty('--p', el.value + '%');
      const rv = el.parentNode.querySelector('.rv');
      if(rv) rv.textContent = el.value + '%';
    }
  };
  AS.body.onchange = e=>{
    if(e.target.id === 'upInput'){
      const file = e.target.files && e.target.files[0];
      if(file) readImageFile(file).then(res=>{ addUpload = res; paintUpload(); })
        .catch(()=> toast('这张图读不出来'));
      return;
    }
    if(e.target.id === 'cvInput'){
      const file = e.target.files && e.target.files[0];
      if(file) readImageFile(file).then(res=>{ coverNew = res; paintCover(); })
        .catch(()=> toast('这张图读不出来'));
    }
  };
  AS.body.onclick = e=>{
    /* 相册格 / 封面格：点击一律由 JS 显式打开文件选择。
       label 转发、透明 input 直接点击这两个路子各机差异太大，
       自己调一次 click() 最稳；先清 value，重复选同一张图也能触发 change */
    const upBox = e.target.closest('#upBox, #cvWrap');
    if(upBox){
      if(e.target.closest('#upRm')){ addUpload = null; paintUpload(); return; }
      /* 微信内置浏览器（尤其打开本地文件时）不提供「选择文件」能力，
         点了既不弹窗也不报错，这里先给一句人话，免得以为是坏了 */
      if(/MicroMessenger/i.test(navigator.userAgent)){
        toast('没反应就用浏览器打开（微信限制）');
      }
      const inp = upBox.querySelector('input[type=file]');
      if(inp){ inp.value = ''; inp.click(); }
      return;
    }
    const chip = e.target.closest('.chip');
    if(chip){
      const box = chip.parentNode;
      if(chip.dataset.new){
        askText('新建分类', '分类名', '', val=>{
          const c = val.trim(); if(!c) return;
          const f = formFields.find(x=> x.n === box.dataset.chips);
          if(!f) return;
          if(!f.opts.includes(c)) f.opts.push(c);
          if(k === 'image' && !PIC_CATS.includes(c)){ PIC_CATS.push(c); persist(); }
          addValues[f.n] = c;
          repaintChips(f.n);
        });
        return;
      }
      box.querySelectorAll('.chip').forEach(c=> c.classList.remove('on'));
      chip.classList.add('on');
      addValues[box.dataset.chips] = chip.dataset.v;
      return;
    }
    if(e.target.id === 'upRm'){
      e.preventDefault(); e.stopPropagation();
      addUpload = null; paintUpload();
    }
  };
  if(k === 'movie' || k === 'tv' || k === 'book') bindMatch(k);
}

/* 条目 → 表单值（编辑时预填用） */
function itemToValues(k, it){
  const clean = (s, ph) => (!s || s === ph) ? '' : s;
  if(k === 'book') return {
    t:it.t || '', a:it.a || '',
    cat:(it.meta && it.meta[1]) || '文学',
    year:(it.meta && it.meta[0]) || '',
    prog:+it.prog || 0,
    d:clean(it.d, '还没有写简介。')
  };
  if(k === 'movie') return {
    t:it.t || '', y:it.y || '',
    dur:clean(it.dur, '—'),
    genre:it.genre || '剧情',
    dir:clean(it.dir, '—'), cast:clean(it.cast, '—'),
    d:clean(it.d, '还没有写短评。')
  };
  if(k === 'tv'){
    const m = /^(\d{4})\s*·\s*(.*?)\s*集$/.exec(it.s || '');
    return {
      t:it.t || '', year:m ? m[1] : '',
      epn:m ? m[2].trim() : '',
      prog:+it.ep || 0,
      d:clean(it.d, '还没有写短评。')
    };
  }
  if(k === 'image') return { t:it.t || '', cat:it.cat || '未分类' };
  return { t:it.t || '', url:it.d || '', desc:clean(it.desc, '还没有写备注。') };
}

function paintCover(){
