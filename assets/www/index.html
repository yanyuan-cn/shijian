<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拾间 · 收藏库</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0E1116; --panel:#141922; --panel2:#1A212C;
    --line:rgba(255,255,255,.07);
    --text:#E7EBF2; --text2:#98A3B6; --text3:#5F6B7E;
    --accent:#7DA7FF; --accent2:#A7C4FF;
  }
  html,body{height:100%;margin:0}
  body{
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden;
  }
  .serif{font-family:Georgia,"Songti SC","Noto Serif SC",serif}

  /* ================= 外壳 ================= */
  .appbar{
    height:56px; flex:none; display:flex; align-items:center; padding:0 14px 0 8px;
    background:#12161D;
    border-bottom:1px solid var(--line); position:relative; z-index:20;
  }
  .appbar .menubtn{margin-right:2px}
  .appbar .logo{font-weight:700; margin-left:4px; font-size:18px; letter-spacing:.02em; font-family:Georgia,"Songti SC",serif}
  .appbar .sub{margin-left:10px; font-size:12px; color:var(--text2); letter-spacing:.04em}
  .appbar .spacer{flex:1}
  .iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    color:var(--text2);border:none;background:transparent;transition:.2s}
  .iconbtn:hover{background:rgba(255,255,255,.06); color:var(--text)}
  .segment{
    height:46px; flex:none; display:none; align-items:center; justify-content:center; gap:8px;
    background:rgba(18,22,29,.88); border-bottom:1px solid var(--line); position:relative; z-index:19;
  }
  .segment .seg{
    padding:6px 20px; border-radius:20px; font-size:12.5px; cursor:pointer; color:var(--text2);
    border:1px solid transparent; background:transparent; font-family:inherit; transition:.2s;
  }
  .segment .seg.on{background:var(--accent); color:#0B0F16; font-weight:600; border-color:transparent}
  .content{flex:1; position:relative; min-height:0}
  .tabbar{
    height:62px; flex:none; display:flex; background:#12161D;
    border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); position:relative; z-index:20;
  }
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    cursor:pointer; color:var(--text3); border:none; background:none; font-family:inherit}
  .tab svg{width:22px;height:22px}
  .tab span{font-size:10.5px; letter-spacing:.02em}
  .tab.on{color:var(--accent2)}
  .tab.on span{font-weight:600}
  .toast{position:fixed; left:50%; bottom:92px; transform:translateX(-50%) translateY(16px);
    background:rgba(26,32,44,.95); color:var(--text); padding:10px 18px; border-radius:24px;
    font-size:12.5px; opacity:0; pointer-events:none; transition:.35s; z-index:999; border:1px solid var(--line)}
  .toast.show{opacity:1; transform:translateX(-50%)}

  /* ================= 场景容器 ================= */
  .scene-empty{position:absolute; inset:0; z-index:4; display:grid; place-content:center;
    text-align:center; gap:9px; pointer-events:none; padding-bottom:40px}
  .scene-empty .se-t{font-size:15px; color:var(--text2); letter-spacing:.08em}
  .scene-empty .se-d{font-size:11.5px; color:var(--text3); letter-spacing:.04em; line-height:1.8}
  .sceneHost{position:relative; overflow:hidden; width:100%; height:100%}
  /* 全屏遮罩打开时，让背后 3D 场景停止绘制，避免输入时掉帧 */
  .sceneHost.slept .scene{visibility:hidden !important; pointer-events:none !important}
  .scene{
    position:absolute; inset:0; opacity:0; pointer-events:none; visibility:hidden;
    transition:opacity .5s ease, visibility .5s, background .6s;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .scene.on{opacity:1; pointer-events:auto; visibility:visible}
  .kicker{
    position:absolute; top:20px; left:24px; font-size:11px; letter-spacing:.22em;
    font-weight:600; opacity:.55; z-index:20; color:var(--text2); pointer-events:none;
  }
  .kicker b{font-weight:600; color:var(--text)}

  /* ================= 1. 书 · 书脊朝外书架 ================= */
  #s-book{--lift:clamp(70px, 13vh, 150px);
    background:radial-gradient(130% 90% at 50% -10%, #1B2230 0%, #12161F 55%, #0B0F15 100%)}
  @media (min-width:760px){ #s-book{--lift:5vh} }
  /* 书架整体上移后，下方地面延伸，避免底座悬空 */
  #s-book::before{
    content:""; position:absolute; left:0; right:0; bottom:0; height:var(--lift,0); z-index:4;
    pointer-events:none;
    background:linear-gradient(180deg, #0A0E15 0%, #070A0F 55%, #04070B 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.045);
  }
  #s-book::after{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:120;
    background:linear-gradient(90deg, rgba(15,20,28,.92) 0%, rgba(15,20,28,0) 16%,
      rgba(15,20,28,0) 84%, rgba(15,20,28,.92) 100%);
  }
  .shelf{
    position:absolute; left:0; right:0; bottom:var(--lift,0); height:100px; z-index:5; pointer-events:none;
    transition:opacity .45s;
  }
  .shelf-face{
    position:absolute; left:0; right:0; bottom:var(--lift,0); height:44px; z-index:11; pointer-events:none;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 2px, rgba(0,0,0,0) 2px 6px),
      linear-gradient(180deg, #0E151F 0%, #070B11 100%);
    border-top:1px solid rgba(255,255,255,.16);
    box-shadow:0 -14px 34px rgba(0,0,0,.6);
    transition:opacity .45s;
  }
  #s-book.focusing .shelf, #s-book.focusing .shelf-face{opacity:.14}
  .shelf-top{
    position:absolute; left:0; right:0; bottom:44px; height:56px;
    background:
      radial-gradient(58% 230% at 50% 106%, rgba(146,174,230,.5) 0%, rgba(146,174,230,0) 72%),
      linear-gradient(180deg, #18202E 0%, #2C3954 58%, #435377 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), inset 0 14px 22px rgba(0,0,0,.5);
  }
  .shelf-top::after{ /* 顶面后缘棱线（书底靠着的边） */
    content:""; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,.05));
    box-shadow:0 1px 6px rgba(0,0,0,.5);
  }
  .stage{position:absolute; inset:0; z-index:10; perspective:1500px; perspective-origin:50% 42%;
    touch-action:none; cursor:grab; overflow:hidden}
  .stage::before{ /* 环境光 spotlight，统一书与背景的光源 */
    content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
    background:radial-gradient(ellipse 58% 42% at 50% 34%, rgba(120,160,255,.13), transparent 74%);
  }
  .stage:active{cursor:grabbing}
  .stage.in{animation:rise .95s cubic-bezier(.22,.9,.24,1) both}
  @keyframes rise{from{transform:translateY(58px)}to{transform:translateY(0)}}
  /* 整排书共用同一个 3D 坐标系：整体平移 + 整体倾斜。
     书在局部 x 轴上一本挨一本排列，因此永远不会互相穿插。 */
  .rig{
    position:absolute; left:0; right:0; bottom:calc(98px + var(--lift,0)); height:0;
    transform-style:preserve-3d; transform-origin:50% 50%;
    transition:transform .52s cubic-bezier(.22,.9,.24,1); will-change:transform;
  }
  .rig.dragging{transition:none}
  .rig.dragging .book{transition:none}
  .books{position:absolute; left:0; right:0; bottom:0; height:0; transform-style:preserve-3d}
  .book{
    position:absolute; left:50%; bottom:-8px;
    width:var(--bkT); height:var(--bkH); margin-left:calc(var(--bkT)/-2);
    --bkT:var(--bkTb,44px);
    --bkH:var(--bkHb,288px);
    --bkW:198px;
    transform-style:preserve-3d;
    transition:transform .52s cubic-bezier(.22,.9,.24,1);
    cursor:pointer;
  }
  .shadows{
    position:absolute; left:0; right:0; bottom:calc(44px + var(--lift,0)); height:16px; z-index:8; pointer-events:none;
    background:linear-gradient(180deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.28) 58%, rgba(0,0,0,0) 100%);
    transition:opacity .45s;
  }
  .bkface{position:absolute; left:50%; top:50%; backface-visibility:visible}
  .spine{
    width:var(--bkT); height:var(--bkH);
    margin-left:calc(var(--bkT)/-2); margin-top:calc(var(--bkH)/-2);
    transform:translateZ(calc(var(--bkW)/2));
    border-radius:2px 3px 3px 2px; overflow:hidden; box-sizing:border-box;
    background:linear-gradient(180deg, var(--sp0), var(--sp1));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),
      inset -7px 0 14px rgba(0,0,0,.52), inset 3px 0 5px rgba(255,255,255,.05),
      inset 0 -12px 16px rgba(0,0,0,.4),
      -13px 0 22px -10px rgba(0,0,0,.75);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    padding:18px 5px;
  }
  .spine::before{ /* 顶部压线 */
    content:""; position:absolute; top:9px; left:50%; transform:translateX(-50%);
    width:18px; height:2px; border-radius:2px; background:rgba(255,255,255,.2);
  }
  .spine::after{ /* 底部压线 */
    content:""; position:absolute; bottom:11px; left:50%; transform:translateX(-50%);
    width:14px; height:2px; border-radius:2px; background:rgba(255,255,255,.12);
  }
  .spine .crease{ /* 中缝装订凹痕 */
    position:absolute; left:50%; top:18px; bottom:18px; width:2px; transform:translateX(-50%);
    background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.34) 20%, rgba(0,0,0,.34) 80%, rgba(255,255,255,.04));
  }
  .spine .t{
    position:relative; writing-mode:vertical-rl; letter-spacing:.24em; font-size:15px; font-weight:600;
    font-family:Georgia,"Songti SC",serif; color:#EDF1F7; text-shadow:0 1px 5px rgba(0,0,0,.45);
    max-height:230px; overflow:hidden;
  }
  .spine .a{
    position:relative; writing-mode:vertical-rl; font-size:9px; letter-spacing:.14em; color:rgba(237,241,247,.5);
    max-height:80px; overflow:hidden;
  }
  .bcover{
    width:var(--bkW); height:var(--bkH);
    margin-left:calc(var(--bkW)/-2); margin-top:calc(var(--bkH)/-2);
    transform:rotateY(90deg) translateZ(calc(var(--bkT)/2));
    border-radius:2px; overflow:hidden; box-sizing:border-box;
    background-image:var(--bkimg, none), linear-gradient(150deg, var(--cv0) 0%, var(--cv1) 80%, rgba(0,0,0,.3) 100%);
    background-size:cover, cover; background-position:center, center; background-repeat:no-repeat;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.1), inset 0 0 70px rgba(0,0,0,.34);
  }
  .bcover.hasimg::before, .bcover.hasimg::after{display:none}
  .bcover::before{ /* 顶部装饰线 */
    content:""; position:absolute; top:14px; left:14px; right:14px; height:1px;
    background:rgba(255,255,255,.22);
  }
  .bcover::after{ /* 封面中央 logo 位装饰 */
    content:""; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:46px; height:46px; border-radius:50%;
    border:1px solid rgba(255,255,255,.2);
    box-shadow:inset 0 0 18px rgba(0,0,0,.3);
  }
  .bback{
    width:var(--bkW); height:var(--bkH);
    margin-left:calc(var(--bkW)/-2); margin-top:calc(var(--bkH)/-2);
    transform:rotateY(-90deg) translateZ(calc(var(--bkT)/2));
    border-radius:2px; overflow:hidden;
    background:linear-gradient(150deg, rgba(0,0,0,.42), rgba(0,0,0,.42)), linear-gradient(150deg, var(--cv0), var(--cv1));
  }
  .bback::after{ /* 条形码装饰 */
    content:""; position:absolute; right:16px; bottom:16px; width:72px; height:38px;
    background:repeating-linear-gradient(90deg, rgba(15,15,15,.8) 0 2px, transparent 2px 5px, rgba(15,15,15,.8) 5px 7px, transparent 7px 11px);
    opacity:.75; border-radius:2px;
  }
  .bfore{
    width:var(--bkT); height:var(--bkH);
    margin-left:calc(var(--bkT)/-2); margin-top:calc(var(--bkH)/-2);
    transform:rotateY(180deg) translateZ(calc(var(--bkW)/2));
    border-radius:2px;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.13) 0 1px, rgba(0,0,0,0) 1px 3px),
      linear-gradient(90deg, #E8E0CD 0%, #F4EEE0 12%, #DBD2BC 55%, #C9BFA6 100%);
  }
  .btop{
    width:var(--bkT); height:var(--bkW);
    margin-left:calc(var(--bkT)/-2); margin-top:calc(var(--bkW)/-2);
    transform:rotateX(90deg) translateZ(calc(var(--bkH)/2));
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.14) 0 1px, rgba(0,0,0,0) 1px 3px),
      linear-gradient(180deg, #F5EFE1 0%, #E2D9C3 55%, #CEC4AA 100%);
  }
  .bbottom{
    width:var(--bkT); height:var(--bkW);
    margin-left:calc(var(--bkT)/-2); margin-top:calc(var(--bkW)/-2);
    transform:rotateX(-90deg) translateZ(calc(var(--bkH)/2));
    background:linear-gradient(180deg, #C8BEA5 0%, #B4A88D 100%);
  }
  .book.center .spine{box-shadow:inset 0 0 0 1px rgba(167,196,255,.32),
      inset -7px 0 14px rgba(0,0,0,.5), inset 3px 0 5px rgba(255,255,255,.06),
      inset 0 -12px 16px rgba(0,0,0,.4), 0 0 26px rgba(125,167,255,.2)}
  .book.center .spine .t{color:#fff}
  @media (min-width:980px){
    .book{ --bkTb:64px; --bkHb:392px; --bkW:262px; }
    .spine{padding:22px 6px;}
    .spine .t{font-size:18px;}
    .spine .a{font-size:10px;}
  }
  .hint{
    position:absolute; left:0; right:0; bottom:16px; text-align:center;
    font-size:11px; letter-spacing:.16em; color:var(--text3); z-index:16; transition:opacity .4s;
    pointer-events:none;
  }
  .focus-dim{opacity:0 !important; pointer-events:none}

  /* 推出展示封面 */
  .covercard{
    position:fixed; z-index:900; transform-origin:50% 50%; pointer-events:none;
    border-radius:4px 12px 12px 4px; overflow:hidden;
    box-shadow:0 30px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.07);
    display:flex; flex-direction:column; justify-content:flex-end; padding:18px;
    background-image:var(--bkimg, none), linear-gradient(175deg, var(--cc0,#1B2530), var(--cc1,#33455C));
    background-size:cover, cover; background-position:center, center; background-repeat:no-repeat;
  }
  .covercard.hasimg .ct, .covercard.hasimg .ca{display:none}
  .covercard::after{content:""; position:absolute; inset:0; background:linear-gradient(175deg, rgba(255,255,255,.1), rgba(0,0,0,.4))}
  .covercard .ct{position:relative; z-index:1; font-size:24px; font-weight:700; color:#fff; font-family:Georgia,"Songti SC",serif; text-shadow:0 1px 10px rgba(0,0,0,.5)}
  .covercard .ca{position:relative; z-index:1; color:rgba(255,255,255,.72); font-size:12px; margin-top:6px; letter-spacing:.08em}
  .bookinfo{
    position:fixed; z-index:901; opacity:0; transform:translateY(18px);
    transition:opacity .5s .18s, transform .5s .18s; pointer-events:none;
  }
  .bookinfo.on{opacity:1; transform:none; pointer-events:auto}
  .bi-title{font-size:26px; font-weight:700; letter-spacing:-.01em; font-family:Georgia,"Songti SC",serif}
  .bi-author{font-size:13px; color:var(--text2); margin-top:8px; letter-spacing:.04em}
  .bi-desc{font-size:14px; line-height:1.85; color:#C4CDDB; margin-top:18px; max-width:340px}
  .bi-meta{display:flex; gap:18px; margin-top:20px; font-size:11.5px; color:var(--text2); letter-spacing:.06em}
  /* 两枚同款描边胶囊；阅读按钮用同色调填充表示进度 */
  .book-actions{display:flex; gap:10px; margin-top:24px}
  .book-actions button{
    position:relative; flex:1; height:42px; border-radius:24px; box-sizing:border-box;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; letter-spacing:.14em; font-family:inherit; cursor:pointer;
    transition:border-color .25s, background .25s, color .25s;
  }
  .closer{
    border:1px solid rgba(255,255,255,.18); background:none; color:var(--text2);
  }
  .closer:hover{border-color:rgba(255,255,255,.34); background:rgba(255,255,255,.04); color:var(--text)}
  .reader-btn{
    overflow:hidden; border:1px solid rgba(255,255,255,.18);
    background:none; color:var(--text);
  }
  .reader-btn .rb-fill{
    position:absolute; left:0; top:0; bottom:0; width:0; pointer-events:none;
    background:linear-gradient(90deg, rgba(125,167,255,.10), rgba(125,167,255,.26));
    transition:width .6s cubic-bezier(.2,.7,.3,1);
  }
  .reader-btn .rb-t{position:relative; z-index:1}
  .reader-btn .rb-p{
    position:relative; z-index:1; margin-left:7px; font-size:10px;
    letter-spacing:0; color:rgba(190,208,240,.72); font-weight:400;
  }
  .reader-btn:hover{border-color:rgba(255,255,255,.34); background:rgba(125,167,255,.08)}

  /* ================= 阅读器 ================= */
  .reader{
    position:fixed; inset:0; z-index:970; display:flex; flex-direction:column;
    --rd-fs:17px; --rd-lh:1.9;
    background:var(--rd-bg); color:var(--rd-txt);
    font-family:Georgia,"Songti SC","Noto Serif SC",serif;
    transition:background .32s, color .32s, opacity .24s, transform .24s;
    animation:rdIn .3s cubic-bezier(.2,.72,.3,1);
  }
  .reader.closing{opacity:0; transform:translateY(10px) scale(.994); pointer-events:none}
  @keyframes rdIn{from{opacity:0; transform:translateY(12px) scale(.994)} to{opacity:1; transform:none}}
  .reader[data-theme="night"]{--rd-bg:#12161D; --rd-txt:#C7D0DD; --rd-title:#EFF3F9; --rd-sub:#78859A;
    --rd-line:rgba(255,255,255,.08); --rd-acc:#7DA7FF; --rd-chip:rgba(255,255,255,.13); --rd-panel:#171C26}
  .reader[data-theme="paper"]{--rd-bg:#F5F0E4; --rd-txt:#3B352C; --rd-title:#1D1913; --rd-sub:#7C7161;
    --rd-line:rgba(0,0,0,.09); --rd-acc:#8A6A3C; --rd-chip:rgba(0,0,0,.07); --rd-panel:#FBF6EA}
  .reader[data-theme="green"]{--rd-bg:#DCE6D3; --rd-txt:#2F3D2D; --rd-title:#16210F; --rd-sub:#63735D;
    --rd-line:rgba(0,0,0,.09); --rd-acc:#4C7A46; --rd-chip:rgba(0,0,0,.07); --rd-panel:#E4EDDC}
  .reader[data-theme="sepia"]{--rd-bg:#E8D9BC; --rd-txt:#443825; --rd-title:#231B0F; --rd-sub:#7A6A4E;
    --rd-line:rgba(0,0,0,.1); --rd-acc:#8A5A2B; --rd-chip:rgba(0,0,0,.07); --rd-panel:#EFE1C6}

  .rd-top{position:absolute; z-index:9; top:0; left:0; right:0;
    height:calc(58px + env(safe-area-inset-top));
    display:flex; align-items:center; gap:2px;
    padding:env(safe-area-inset-top) 6px 0 2px;
    background:var(--rd-bg);
    font-family:system-ui,-apple-system,"PingFang SC",sans-serif;
    transition:transform .26s cubic-bezier(.3,.8,.3,1), opacity .22s}
  .rd-top::after{content:""; position:absolute; left:0; right:0; top:100%; height:26px;
    background:linear-gradient(var(--rd-bg), transparent); pointer-events:none}
  .reader.hide-ui .rd-top{transform:translateY(-101%); opacity:0; pointer-events:none}
  .rd-btn{
    width:40px; height:40px; flex:none; display:flex; align-items:center; justify-content:center;
    background:none; border:none; border-radius:50%; cursor:pointer;
    color:var(--rd-sub); font-family:inherit; transition:color .2s, background .2s;
  }
  .rd-btn:hover{color:var(--rd-title); background:var(--rd-chip)}
  .rd-back{color:var(--rd-txt)}
  .rd-aa{font-size:14px; font-weight:600; letter-spacing:.02em}
  .rd-meta{flex:1; min-width:0; text-align:center; line-height:1.3; padding:0 4px}
  .rd-book{font-size:14px; font-weight:600; color:var(--rd-title); font-family:Georgia,"Songti SC",serif;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .rd-chline{font-size:10px; color:var(--rd-sub); letter-spacing:.12em; margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

  .rd-stage{position:relative; flex:1; min-height:0; overflow:hidden}

  /* 上下翻页：连续滚动 */
  .rd-scroll{position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
    scrollbar-width:none; overscroll-behavior:contain; -webkit-overflow-scrolling:touch}
  .rd-scroll::-webkit-scrollbar{display:none}
  .rd-body{max-width:700px; margin:0 auto;
    padding:calc(80px + env(safe-area-inset-top)) 30px calc(86px + env(safe-area-inset-bottom))}

  /* 左右翻页：分页平移 */
  .rd-pager{display:none; position:absolute; inset:0; overflow:hidden; touch-action:pan-y}
  .reader[data-mode="page"] .rd-scroll{display:none}
  .reader[data-mode="page"] .rd-pager{display:block}
  .rd-view{position:absolute; top:0; bottom:0; overflow:hidden}
  .rd-track{display:flex; height:100%; will-change:transform}
  .pg{flex:none; box-sizing:border-box; overflow:hidden;
    padding:calc(80px + env(safe-area-inset-top)) 30px calc(84px + env(safe-area-inset-bottom))}

  /* 正文排版 */
  .rd-body p, .pg p{
    margin:0 0 .82em; font-size:var(--rd-fs); line-height:var(--rd-lh);
    color:var(--rd-txt); text-align:justify; text-indent:2em; word-break:break-word;
  }
  .pg p.cont{text-indent:0}
  .rd-ch-head{margin:6px 0 34px; padding-top:10px; text-align:center}
  .rd-ch-n{font-size:10.5px; letter-spacing:.3em; color:var(--rd-acc); margin-bottom:14px; text-indent:.3em}
  .rd-ch-t{font-size:24px; font-weight:600; color:var(--rd-title); letter-spacing:.08em; text-indent:.08em}
  .rd-ch-head::after{content:""; display:block; width:28px; height:1px; background:var(--rd-line); margin:20px auto 0}
  .rd-ch-head + p{margin-top:2px}

  .rd-bot{position:absolute; z-index:3; left:0; right:0; bottom:0;
    height:calc(54px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:14px;
    padding:0 16px env(safe-area-inset-bottom);
    background:var(--rd-bg);
    font-family:system-ui,-apple-system,"PingFang SC",sans-serif;
    transition:transform .26s cubic-bezier(.3,.8,.3,1), opacity .22s}
  .rd-bot::before{content:""; position:absolute; left:0; right:0; bottom:100%; height:26px;
    background:linear-gradient(transparent, var(--rd-bg)); pointer-events:none}
  .reader.hide-ui .rd-bot{transform:translateY(101%); opacity:0; pointer-events:none}
  .rd-pn{font-size:10.5px; color:var(--rd-sub); letter-spacing:.06em; flex:none; min-width:46px}
  .rd-track-bar{flex:1; height:24px; position:relative; display:flex; align-items:center; cursor:pointer; touch-action:none}
  .rd-track-bar::before{content:""; position:absolute; left:0; right:0; height:3px; border-radius:2px; background:var(--rd-chip)}
  .rd-track-bar i{position:relative; height:3px; width:0; border-radius:2px; background:var(--rd-acc)}
  .rd-track-bar b{position:absolute; top:50%; width:9px; height:9px; margin-top:-4.5px; border-radius:50%;
    background:var(--rd-acc); transform:translateX(-50%); box-shadow:0 0 0 4px rgba(125,167,255,.16)}
  .rd-pct{font-size:10.5px; color:var(--rd-sub); letter-spacing:.04em; flex:none; min-width:36px; text-align:right}

  /* 面板 */
  .rd-veil{position:absolute; inset:0; z-index:6; background:rgba(0,0,0,.30);
    opacity:0; pointer-events:none; transition:opacity .26s}
  .rd-veil.on{opacity:1; pointer-events:auto}
  .rd-sheet{
    position:absolute; z-index:7; left:50%; bottom:0; width:min(100%,560px);
    background:var(--rd-panel); border-top:1px solid var(--rd-line);
    border-radius:16px 16px 0 0; box-shadow:0 -18px 50px rgba(0,0,0,.3);
    padding:0 20px calc(18px + env(safe-area-inset-bottom));
    transform:translate(-50%,102%); transition:transform .32s cubic-bezier(.22,.85,.25,1);
    font-family:system-ui,-apple-system,"PingFang SC",sans-serif;
  }
  .rd-sheet.on{transform:translate(-50%,0)}
  .rd-sheet-h{height:50px; display:flex; align-items:center; justify-content:space-between;
    font-size:11px; letter-spacing:.18em; color:var(--rd-sub)}
  .rd-x{background:none; border:none; color:var(--rd-acc); font-size:12px; font-family:inherit;
    letter-spacing:.1em; cursor:pointer; padding:6px 2px}
  .rd-row{display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:13px 0; border-top:1px solid var(--rd-line)}
  .rd-row-l{font-size:12.5px; color:var(--rd-txt); letter-spacing:.06em; flex:none}
  .seg{display:flex; gap:2px; padding:3px; border-radius:10px; background:var(--rd-chip)}
  .seg button{border:none; background:none; font-family:inherit; font-size:12px; color:var(--rd-txt);
    padding:7px 12px; border-radius:8px; cursor:pointer; letter-spacing:.04em; transition:.2s; opacity:.62}
  .seg button.on{background:var(--rd-acc); color:#fff; opacity:1}
  .rd-dots{display:flex; gap:12px}
  .rd-dot{width:24px; height:24px; border-radius:50%; cursor:pointer; position:relative;
    border:1px solid var(--rd-line); box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
  .rd-dot[data-tp="night"]{background:#12161D}
  .rd-dot[data-tp="paper"]{background:#F5F0E4}
  .rd-dot[data-tp="green"]{background:#DCE6D3}
  .rd-dot[data-tp="sepia"]{background:#E8D9BC}
  .rd-dot.on::after{content:""; position:absolute; inset:-4px; border:1px solid var(--rd-acc); border-radius:50%}

  .rd-toc{max-height:68vh; display:flex; flex-direction:column; padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .rd-toc-list{overflow-y:auto; flex:1; scrollbar-width:none; margin:0 -6px; padding:2px 6px 16px}
  .rd-toc-list::-webkit-scrollbar{display:none}
  .rd-toc-item{display:flex; align-items:baseline; gap:12px; padding:12px 4px;
    border-bottom:1px solid var(--rd-line); cursor:pointer; font-size:13px; color:var(--rd-txt)}
  .rd-toc-item .n{font-size:10.5px; color:var(--rd-sub); letter-spacing:.04em; flex:none; width:48px; white-space:nowrap}
  .rd-toc-item .t{font-family:Georgia,"Songti SC",serif; letter-spacing:.04em}
  .rd-toc-item.on{color:var(--rd-acc)}
  .rd-toc-item.on .n{color:var(--rd-acc)}

  @media (min-width:760px){
    .rd-bot{padding-left:max(20px, calc((100% - 700px) / 2 + 30px));
            padding-right:max(20px, calc((100% - 700px) / 2 + 30px))}
    .rd-pn, .rd-pct{font-size:12px}
    .rd-pn{min-width:56px}
  }
  .rd-tip{position:absolute; z-index:5; left:50%; bottom:76px; transform:translate(-50%,10px);
    padding:9px 16px; border-radius:20px; background:rgba(0,0,0,.6); color:#fff;
    font-family:system-ui,-apple-system,"PingFang SC",sans-serif; font-size:11.5px; letter-spacing:.08em;
    opacity:0; transition:.3s; pointer-events:none; white-space:nowrap}
  .rd-tip.on{opacity:1; transform:translate(-50%,0)}

  /* ================= 2. 电影 · 景深海报墙 ================= */
  #s-movie{background:#0A0E15; color:var(--text)}
  #s-movie::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(90% 70% at 50% 45%, transparent 0%, rgba(0,0,0,.72) 100%);
  }
  #s-movie::before{
    content:""; position:absolute; left:0; right:0; top:0; height:120px; z-index:3; pointer-events:none;
    background:linear-gradient(180deg,#0A0E15 14%,rgba(10,14,21,.85) 45%,rgba(10,14,21,0));
  }
  .mwall{position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; padding:92px 0 60px; scrollbar-width:none}
  .mwall::-webkit-scrollbar{display:none}
  .mgrid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:26px 18px;
    max-width:640px; margin:0 auto; padding:0 22px; position:relative; z-index:2;
  }
  @media (max-width:520px){ .mgrid{gap:20px 12px; padding:0 16px} }
  .poster{
    aspect-ratio:2/3; border-radius:6px; position:relative; overflow:hidden;
    display:flex; flex-direction:column; justify-content:flex-end; padding:11px;
    cursor:pointer; transform-origin:center; will-change:transform,opacity;
    box-shadow:0 18px 40px rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.05);
  }
  .poster::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.6))}
  .poster .pt{position:relative;z-index:1;color:#fff;font-size:12.5px;font-weight:600;line-height:1.35;font-family:Georgia,"Songti SC",serif}
  .poster .py{position:relative;z-index:1;color:rgba(255,255,255,.55);font-size:9.5px;margin-top:3px;letter-spacing:.08em}

  /* ================= 3. 剧集 · 扇形牌堆 ================= */
  #s-tv{background:radial-gradient(110% 80% at 50% 20%, #16131C 0%, #100E15 60%, #0A090D 100%); color:var(--text)}
  .fanwrap{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column}
  .fan{position:relative; width:230px; height:330px; margin-top:-10px;
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    transition:transform .28s cubic-bezier(.25,.9,.28,1); will-change:transform}
  .fan.drag{transition:none}
  .fcard{
    position:absolute; inset:0; border-radius:10px; overflow:hidden; cursor:pointer;
    display:flex; flex-direction:column; justify-content:flex-end; padding:16px;
    box-shadow:0 22px 50px rgba(0,0,0,.6);
    transition:transform .3s cubic-bezier(.22,.9,.24,1), box-shadow .3s, filter .3s;
    will-change:transform;
  }
  .fcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.62));box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
  .fring{
    position:absolute; top:15px; right:15px; width:40px; height:40px; border-radius:50%; z-index:2;
    background:conic-gradient(var(--accent) 0 var(--p), rgba(255,255,255,.13) var(--p) 100%);
    display:grid; place-items:center;
  }
  .fring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:rgba(14,12,18,.88)}
  .fring b{position:relative;z-index:1;font-size:9px;font-weight:600;color:rgba(255,255,255,.9);letter-spacing:0}
  .fcard .ft{position:relative;z-index:1;color:#fff;font-size:18px;font-weight:600;font-family:Georgia,"Songti SC",serif;line-height:1.3}
  .fcard .fs{position:relative;z-index:1;color:rgba(255,255,255,.6);font-size:11px;margin-top:6px;letter-spacing:.06em}
  .fcard:not(.active) .fring{opacity:.22}
  .fcard:not(.active){filter:brightness(.62) saturate(.95); box-shadow:0 22px 50px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.07)}
  .fan-cap{margin-top:40px; text-align:center; min-height:92px; max-height:246px; overflow:hidden; padding:0 18px; transition:opacity .4s}
  .fan-cap h3{margin:0; font-size:15px; font-weight:600; letter-spacing:.04em; font-family:Georgia,"Songti SC",serif}
  .fan-cap p{margin:9px 0 0; font-size:12px; color:rgba(231,235,242,.5); letter-spacing:.06em;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden}
  .epbar{width:180px; height:2px; background:rgba(255,255,255,.14); margin:16px auto 0; border-radius:2px; overflow:hidden}
  .epbar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .6s}
  .fan-nav{display:flex; gap:40px; margin-top:6px; color:rgba(255,255,255,.35); font-size:20px}
  .fan-nav span{cursor:pointer; transition:color .2s; user-select:none}
  .fan-nav span:hover{color:var(--accent2)}

  /* ================= 4. 图片 · 深色画廊 ================= */
  #s-image{background:#0D1117}
  #s-image::before{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:1;
    background:radial-gradient(80% 50% at 50% -6%, rgba(125,167,255,.09), transparent 60%);
  }
  .gallery{
    position:absolute; inset:0; overflow-y:auto; scrollbar-width:none;
    padding:76px 20px 40px; display:flex; gap:16px; align-items:flex-start;
  }
  .gallery::-webkit-scrollbar{display:none}
  .gcol{flex:1; display:flex; flex-direction:column; gap:16px; min-width:0}
  .pic{
    position:relative; border-radius:14px; overflow:hidden; cursor:pointer;
    border:1px solid rgba(255,255,255,.07);
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    opacity:0; transform:translateY(26px) scale(.96);
    transition:transform .5s cubic-bezier(.22,.9,.24,1), opacity .5s, box-shadow .45s, border-color .45s;
  }
  .pic.in{opacity:1; transform:none}
  .pic:hover{transform:translateY(-6px); box-shadow:0 20px 48px rgba(0,0,0,.6), 0 0 0 1px rgba(125,167,255,.35); border-color:rgba(125,167,255,.4)}
  .pic .img{aspect-ratio:var(--ar); background:linear-gradient(160deg, var(--g0), var(--g1)); position:relative; overflow:hidden}
  .pic .img::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.28));
  }
  .pic .cap{
    position:absolute; left:0; right:0; bottom:0; padding:26px 13px 11px;
    background:linear-gradient(180deg, transparent, rgba(0,0,0,.6));
    color:var(--text); font-size:12px; letter-spacing:.04em; z-index:2;
  }
  /* 扫光 */
  .pic .shine{
    position:absolute; top:0; left:-90%; width:55%; height:100%; z-index:1; pointer-events:none;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.16), transparent);
    transform:skewX(-20deg);
  }
  .pic.in .shine{animation:shine 1s .3s ease forwards}
  @keyframes shine{to{left:140%}}
  .pic.dim{opacity:0 !important; pointer-events:none}
  .imgclose{
    position:fixed; top:22px; right:22px; z-index:902; opacity:0; transition:opacity .4s; pointer-events:none;
    background:rgba(26,32,44,.92); border:1px solid rgba(255,255,255,.14); cursor:pointer; color:var(--text);
    font-family:inherit; padding:9px 16px; border-radius:22px; font-size:12px; letter-spacing:.12em;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .imgclose.on{opacity:1; pointer-events:auto}
  .zoomed-pic{position:fixed; z-index:900; transform-origin:0 0; pointer-events:none; border-radius:16px; overflow:hidden;
    background:#000; box-shadow:0 34px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.1)}

  /* ================= 5. 链接 · 时间轴 ================= */
  #s-link{background:#10151D; color:var(--text)}
  #s-link::before{
    content:""; position:absolute; left:0; right:0; top:0; height:100px; z-index:3; pointer-events:none;
    background:linear-gradient(180deg,#10151D 18%,rgba(16,21,29,.88) 50%,rgba(16,21,29,0));
  }
  .tl{position:absolute; inset:0; overflow-y:auto; scrollbar-width:none; padding:76px 34px 40px}
  .tl::-webkit-scrollbar{display:none}
  .tl::before{
    content:""; position:absolute; left:34px; top:88px; bottom:60px; width:1px;
    background:linear-gradient(180deg, transparent, rgba(255,255,255,.16) 12%, rgba(255,255,255,.16) 88%, transparent);
  }
  .tl-item{
    position:relative; padding-left:44px; margin-bottom:32px;
    opacity:0; transform:translateY(22px);
    transition:opacity .7s, transform .7s cubic-bezier(.22,.9,.24,1);
  }
  .tl-item.in{opacity:1; transform:none}
  .tl-item::before{
    content:""; position:absolute; left:-4px; top:9px; width:9px; height:9px; border-radius:50%;
    background:var(--accent); box-shadow:0 0 0 4px #10151D;
  }
  .tl-item:nth-child(2n)::before{background:#7A8B6F}
  .tl-card{
    background:#161C26; border-radius:14px; padding:17px 18px; cursor:pointer;
    border:1px solid rgba(255,255,255,.06); box-shadow:0 2px 8px rgba(0,0,0,.3);
    transition:box-shadow .3s, transform .3s, border-color .3s;
  }
  .tl-card:hover{box-shadow:0 12px 30px rgba(0,0,0,.45); transform:translateY(-1px); border-color:rgba(125,167,255,.25)}
  .tl-head{display:flex; align-items:center; gap:12px}
  .tile{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700;font-family:Georgia,serif}
  .tl-t{font-size:14.5px; font-weight:600; letter-spacing:.01em}
  .tl-d{font-size:11px; color:var(--text3); margin-top:3px; letter-spacing:.04em}
  .tl-body{max-height:0; overflow:hidden; transition:max-height .45s ease, opacity .4s, margin-top .4s; opacity:0; font-size:13px; color:#AEB8C7; line-height:1.8}
  .tl-item.open .tl-body{max-height:280px; opacity:1; margin-top:13px}
  .tl-date{position:absolute; left:-14px; top:-18px; font-size:9.5px; color:var(--text3); letter-spacing:.1em; opacity:0; transition:opacity .5s .2s}
  .tl-item.in .tl-date{opacity:1}

  /* ---------- 图集：瀑布流 ---------- */
  .picwrap .gallery{
    position:relative; inset:auto; flex:1; min-width:0;
    padding:72px 18px 44px;
  }
  .pic .img{
    background-image:var(--img, none), linear-gradient(160deg, var(--g0), var(--g1));
    background-size:cover, cover; background-position:center, center; background-repeat:no-repeat;
  }
  /* 展开大图 */
  .imgmask{position:fixed; inset:0; z-index:880; background:rgba(6,8,12,.985);
    opacity:0; pointer-events:none; transition:opacity .32s ease}
  .imgmask.on{opacity:1; pointer-events:auto}
  .imgcap{position:fixed; z-index:901; pointer-events:none; text-align:center;
    opacity:0; transform:translateY(8px); transition:opacity .45s .08s, transform .45s .08s}
  .imgcap.on{opacity:1; transform:none; pointer-events:auto}
  .iv-t{font-size:15.5px; font-weight:600; color:#fff; letter-spacing:.04em}
  .iv-c{margin-top:7px; font-size:11px; color:var(--accent2); letter-spacing:.16em}
  .iv-c::before{content:""; display:inline-block; width:4px; height:4px; border-radius:50%;
    background:var(--accent); vertical-align:middle; margin-right:7px; opacity:.8}
  .imgclose{z-index:902}

  /* ---------- 添加面板 ---------- */
  .addmask{position:fixed; inset:0; z-index:977; background:rgba(5,7,11,.66);
    opacity:0; pointer-events:none; transition:opacity .34s ease}
  .addmask.on{opacity:1; pointer-events:auto}
  .addsheet{
    position:fixed; left:0; right:0; bottom:0; z-index:978;
    height:min(90vh,780px); display:flex; flex-direction:column;
    background:linear-gradient(180deg,#171D27 0%,#11161E 100%);
    border-top:1px solid rgba(255,255,255,.09); border-radius:20px 20px 0 0;
    box-shadow:0 -26px 70px rgba(0,0,0,.6);
    transform:translateY(102%); transition:transform .44s cubic-bezier(.22,.9,.24,1);
    padding-bottom:env(safe-area-inset-bottom);
    pointer-events:none;
  }
  .addsheet.on{transform:none; pointer-events:auto}
  .addsheet.compact{height:auto}
  .addsheet::before{content:""; position:absolute; top:8px; left:50%; width:34px; height:3px;
    border-radius:2px; background:rgba(255,255,255,.16); transform:translateX(-50%)}

    .addsheet{
      left:50%; right:auto; top:50%; bottom:auto; width:560px;
      height:min(86vh,720px); border-radius:20px;

      transition:transform .42s cubic-bezier(.22,.9,.24,1), opacity .3s;
      pointer-events:none;

    .addsheet.compact{height:auto; max-height:86vh}
  }
  .as-head{flex:none; height:62px; display:flex; align-items:center; gap:6px;
    padding:14px 12px 0 8px; border-bottom:1px solid rgba(255,255,255,.06)}
  .as-head .as-title{flex:1; text-align:center; font-size:15px; font-weight:600; letter-spacing:.04em}
  .as-back{width:36px; height:36px; border-radius:50%; display:grid; place-items:center;
    background:none; border:none; color:var(--text2); cursor:pointer; transition:.2s; opacity:0; pointer-events:none}
  .as-back.on{opacity:1; pointer-events:auto}
  .as-back:hover{background:rgba(255,255,255,.06); color:var(--text)}
  .as-body{flex:1; overflow-y:auto; scrollbar-width:none; padding:20px 20px 20px;
    overscroll-behavior:contain; -webkit-overflow-scrolling:touch}
  .as-body::-webkit-scrollbar{display:none}
  /* 软键盘弹出时浏览器会把聚焦的字段滚进来，留点上下余量，别贴着边 */
  .fld{scroll-margin:18px 0 96px}
  .as-foot{flex:none; padding:10px 20px 16px; border-top:1px solid rgba(255,255,255,.06)}
  .as-save{width:100%; height:48px; border-radius:14px; border:none; cursor:pointer;
    background:var(--accent); color:#0B1020; font-family:inherit; font-size:14px;
    font-weight:700; letter-spacing:.12em; transition:.22s}
  .as-save:hover{filter:brightness(1.08)}
  .as-save:active{transform:scale(.985)}

  /* 板块选择 */
  .as-lead{font-size:12px; color:var(--text3); letter-spacing:.06em; margin:2px 0 16px}
  .as-grid{display:grid; grid-template-columns:1fr 1fr; gap:11px}
  .as-card{
    position:relative; display:flex; flex-direction:column; gap:12px; cursor:pointer;
    padding:16px 16px 15px; border-radius:15px; text-align:left; font-family:inherit;
    background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.07);
    transition:.24s; color:var(--text);
  }
  .as-card:hover{background:rgba(125,167,255,.08); border-color:rgba(125,167,255,.3); transform:translateY(-2px)}
  .as-card.wide{grid-column:1 / -1; flex-direction:row; align-items:center; gap:16px; padding:18px}
  .as-card .ico{width:38px; height:38px; border-radius:11px; display:grid; place-items:center;
    background:rgba(125,167,255,.12); color:var(--accent2); flex:none}
  .as-card .nm{display:block; font-size:14.5px; font-weight:600; letter-spacing:.02em}
  .as-card .ds{display:block; font-size:11px; color:var(--text3); margin-top:4px; letter-spacing:.02em}
  .as-card .cnt{position:absolute; top:12px; right:14px; font-size:10.5px; color:var(--text3); letter-spacing:.06em}
  .as-card.wide .cnt{position:static; margin-left:auto; flex:none}

  /* 表单 */
  .fld{margin-bottom:19px}
  .fld > label{display:block; font-size:10.5px; letter-spacing:.16em; color:var(--text3); margin-bottom:9px}
  .fld > label b{color:var(--accent); font-weight:400; margin-left:3px}
  .fld input[type=text], .fld input[type=number], .fld textarea, .fld select{
    width:100%; background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.08);
    border-radius:11px; padding:12px 13px; color:var(--text); font-size:14px;
    font-family:inherit; outline:none; transition:border-color .2s, background .2s; -webkit-appearance:none;
  }
  .fld input:focus, .fld textarea:focus, .fld select:focus{
    border-color:rgba(125,167,255,.55); background:rgba(125,167,255,.06);
  }
  .fld input::placeholder, .fld textarea::placeholder{color:var(--text3)}
  .fld textarea{min-height:84px; resize:vertical; line-height:1.7}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{padding:8px 14px; border-radius:20px; font-size:12px; color:var(--text2); cursor:pointer;
    border:1px solid rgba(255,255,255,.1); background:none; font-family:inherit; transition:.2s}
  .chip:hover{border-color:rgba(255,255,255,.24); color:var(--text)}
  .chip.on{background:rgba(125,167,255,.16); border-color:rgba(125,167,255,.5); color:var(--accent2); font-weight:600}
  .chip.new{border-style:dashed; color:var(--text3)}
  .rangerow{display:flex; align-items:center; gap:14px}
  .range{flex:1; -webkit-appearance:none; height:4px; border-radius:2px; outline:none;
    background:linear-gradient(90deg, var(--accent) var(--p,0%), rgba(255,255,255,.12) var(--p,0%))}
  .range::-webkit-slider-thumb{-webkit-appearance:none; width:18px; height:18px; border-radius:50%;
    background:#fff; box-shadow:0 0 0 4px rgba(125,167,255,.22); cursor:pointer}
  .rangerow .rv{width:46px; text-align:right; font-size:12.5px; color:var(--accent2); font-variant-numeric:tabular-nums}
  .swatches{display:flex; gap:10px; flex-wrap:wrap}
  .sw{width:36px; height:36px; border-radius:10px; cursor:pointer; position:relative;
    border:1px solid rgba(255,255,255,.12); transition:.2s}
  .sw.on{box-shadow:0 0 0 2px var(--bg), 0 0 0 3.5px var(--accent)}
  .upbox{position:relative; height:132px; border-radius:14px; cursor:pointer; overflow:hidden;
    border:1px dashed rgba(255,255,255,.16); background:rgba(255,255,255,.03);
    display:grid; place-items:center; text-align:center; transition:.22s}
  .upbox:hover{border-color:rgba(125,167,255,.5); background:rgba(125,167,255,.06)}
  .upbox img{width:100%; height:100%; object-fit:cover; display:block}
  .upbox .ph{font-size:12px; color:var(--text3); line-height:1.9}
  .upbox .ph b{display:block; font-size:22px; font-weight:400; margin-bottom:4px; color:var(--text2)}
  /* 文件框本体铺满整个相册格：不依赖 label 转发点击（iOS 上 display:none 的 file input 收不到 label 的点击） */
  .upbox input{position:absolute; inset:0; width:100%; height:100%; opacity:0; pointer-events:none; z-index:1}
  .upbox .rm{position:absolute; top:8px; right:8px; z-index:2; background:rgba(0,0,0,.6);
    border:1px solid rgba(255,255,255,.2); color:#fff; border-radius:16px; padding:4px 10px;
    font-size:11px; font-family:inherit; cursor:pointer}
  .hintline{font-size:11px; color:var(--text3); line-height:1.7; margin-top:8px}
  /* 编辑模式下的封面位：竖版小卡，右侧留白给文字说明 */
  .upbox.cover{width:110px; height:156px; height:156px; background-size:cover; background-position:center}
  .upbox.cover.has{border-style:solid; border-color:rgba(255,255,255,.22); background-color:rgba(255,255,255,.05)}
  .upbox.cover.has .ph{display:none}
  .upbox.cover .ph{font-size:11px; line-height:1.7}
  .upbox.cover img{width:100%; height:100%}
  .src-test{margin-top:6px; padding-top:16px; border-top:1px dashed rgba(255,255,255,.09)}
  .src-test-btn{height:38px; padding:0 16px; border-radius:10px; border:1px solid rgba(255,255,255,.14);
    background:none; color:var(--text2); font-family:inherit; font-size:12.5px; cursor:pointer}
  .src-test-btn:disabled{opacity:.5}
  .src-test-out{margin-top:11px; font-size:11.5px; line-height:1.95; color:var(--text3)}
  .src-test-out b{color:var(--text); font-weight:600}
  .src-test-out .ok{color:#7FD1A0}
  .src-test-out .no{color:#E08C8C}

  /* key 申请指引 */
  .src-guide{margin-top:11px; padding:12px 13px; border-radius:11px;
    background:rgba(125,167,255,.055); border:1px solid rgba(125,167,255,.14)}
  .src-guide summary{list-style:none; cursor:pointer; font-size:11.5px; color:var(--accent2);
    display:flex; align-items:center; gap:6px; line-height:1.6}
  .src-guide summary::-webkit-details-marker{display:none}
  .src-guide summary::before{content:'▸'; font-size:9px; transition:transform .2s}
  .src-guide[open] summary::before{content:'▾'}
  .src-guide ol{margin:10px 0 0; padding-left:15px; font-size:11.5px; line-height:1.95; color:var(--text3)}
  .src-guide li{margin-bottom:5px}
  .src-guide li b{color:var(--text2); font-weight:600}
  .src-fill{display:grid; grid-template-columns:82px 1fr; gap:5px 9px;
    margin:11px 0 0; font-size:11.5px; line-height:1.75}
  .src-fill dt{color:var(--text3); margin:0}
  .src-fill dd{margin:0; color:var(--text2); word-break:break-word}
  .src-fill code, .src-guide .hintline code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px;
    background:rgba(255,255,255,.07); padding:1px 5px; border-radius:4px; color:var(--text);
    margin:0 2px}
  .src-copy{margin-top:11px; height:34px; padding:0 13px; border-radius:9px;
    border:1px solid rgba(125,167,255,.3); background:rgba(125,167,255,.1);
    color:var(--accent2); font-family:inherit; font-size:11.5px; cursor:pointer}
  .src-copy:active{transform:scale(.97)}

  /* 影视自动匹配 */
  .matchbox{margin-top:2px}
  .match-q{display:flex; gap:8px}
  .match-q input{flex:1; min-width:0; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.12);
    border-radius:10px; padding:10px 12px; font-size:13px; color:var(--text); font-family:inherit}
  .match-q input:focus{outline:none; border-color:rgba(125,167,255,.5)}
  .match-q button{flex:none; padding:0 16px; border-radius:10px; border:none; cursor:pointer; font-family:inherit;
    font-size:12.5px; background:rgba(125,167,255,.16); color:var(--accent2)}
  .match-q button:disabled{opacity:.5}
  .match-status{margin:9px 2px 0; font-size:11px; color:var(--text3); line-height:1.6}
  .match-list{margin-top:10px; display:flex; flex-direction:column; gap:8px; max-height:260px; overflow:auto}
  .match-card{display:flex; gap:11px; align-items:flex-start; text-align:left; background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:9px; cursor:pointer; font-family:inherit; transition:.18s}
  .match-card:hover{border-color:rgba(125,167,255,.5); background:rgba(125,167,255,.07)}
  .mc-poster{width:44px; height:62px; flex:none; border-radius:6px; background:#181d25 center/cover no-repeat;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
  .mc-info{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}
  .mc-info b{font-size:13px; color:var(--text); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .mc-info i{font-style:normal; font-size:10.5px; color:var(--accent2)}
  .mc-info em{font-style:normal; font-size:11px; color:var(--text3); line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}

  /* 小输入对话框 */
  .dlg{position:fixed; inset:0; z-index:984; display:grid; place-items:center; padding:24px;
    background:rgba(5,7,11,.6); opacity:0; pointer-events:none; transition:opacity .26s}
  .dlg.on{opacity:1; pointer-events:auto}
  .dlg-box{width:min(100%,340px); background:#1A212C; border:1px solid rgba(255,255,255,.1);
    border-radius:18px; padding:20px; box-shadow:0 24px 60px rgba(0,0,0,.6);
    transform:scale(.94); transition:transform .28s cubic-bezier(.22,.9,.24,1)}
  .dlg.on .dlg-box{transform:none}
  .dlg-t{font-size:14.5px; font-weight:600; margin-bottom:14px; letter-spacing:.02em}
  .dlg-i{width:100%; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
    border-radius:11px; padding:12px 13px; color:var(--text); font-size:14px; font-family:inherit; outline:none}
  .dlg-i:focus{border-color:rgba(125,167,255,.55)}
  .dlg-a{display:flex; gap:10px; margin-top:18px}
  .dlg-a button{flex:1; height:42px; border-radius:11px; font-family:inherit; font-size:13px; cursor:pointer; transition:.2s}
  .dlg-c{background:none; border:1px solid rgba(255,255,255,.14); color:var(--text2)}
  .dlg-k{background:var(--accent); border:none; color:#0B1020; font-weight:700}

  /* ---------- 封面卡：电子书信息 ---------- */
  .bi-file{margin-top:12px; font-size:10.5px; letter-spacing:.1em; color:var(--text3);
    display:inline-flex; align-items:center; gap:7px}
  .bi-file::before{content:""; width:4px; height:4px; border-radius:50%; background:var(--accent); opacity:.75}

  /* ---------- 电子书导入 ---------- */
  .eb{border-radius:13px; border:1px dashed rgba(255,255,255,.16);
    background:rgba(255,255,255,.028); transition:.22s}
  .eb:hover{border-color:rgba(125,167,255,.42)}
  .eb.has{border-style:solid; border-color:rgba(125,167,255,.26); background:rgba(125,167,255,.05);
    padding:13px}
  .eb-drop{display:block; padding:22px 16px; text-align:center; cursor:pointer}
  .eb-drop .ic{width:34px; height:34px; margin:0 auto 10px; border-radius:10px;
    display:grid; place-items:center; background:rgba(125,167,255,.12); color:var(--accent2)}
  .eb-drop .t1{display:block; font-size:13px; color:var(--text2); letter-spacing:.02em}
  .eb-drop .t2{display:block; margin-top:6px; font-size:10.5px; color:var(--text3); line-height:1.8}
  .eb input[type=file]{display:none}
  .eb-top{display:flex; align-items:center; gap:11px}
  .eb-ic{width:36px; height:36px; flex:none; border-radius:9px; display:grid; place-items:center;
    background:rgba(125,167,255,.14); color:var(--accent2)}
  .eb-cover{width:36px; height:48px; flex:none; border-radius:5px; overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,.35); background:#111}
  .eb-cover img{width:100%; height:100%; object-fit:cover; display:block}
  .eb-nm{flex:1; min-width:0}
  .eb-name{font-size:13px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .eb-meta{margin-top:4px; font-size:10.5px; color:var(--text3); letter-spacing:.04em}
  .eb-meta b{color:var(--accent2); font-weight:400}
  .eb-x{flex:none; background:none; border:none; color:var(--text3); font-size:11px;
    font-family:inherit; cursor:pointer; padding:6px 4px; letter-spacing:.06em}
  .eb-x:hover{color:var(--text)}
  .eb-enc{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap}
  .eb-enc span{font-size:10px; color:var(--text3); letter-spacing:.12em; margin-right:2px; align-self:center}
  .eb-enc button{padding:4px 9px; border-radius:13px; font-size:10.5px; font-family:inherit;
    border:1px solid rgba(255,255,255,.1); background:none; color:var(--text3); cursor:pointer; transition:.18s}
  .eb-enc button.on{border-color:rgba(125,167,255,.5); background:rgba(125,167,255,.16); color:var(--accent2)}
  .eb-pv{margin-top:11px; padding-top:10px; border-top:1px solid rgba(255,255,255,.06);
    font-size:11px; line-height:1.85; color:var(--text3); max-height:56px; overflow:hidden}
  .eb-err{margin-top:10px; font-size:11px; color:#E8908C; line-height:1.7}
  .eb-load{display:flex; align-items:center; gap:10px; padding:16px 4px; font-size:12px; color:var(--text3)}
  .spin{width:14px; height:14px; border-radius:50%; border:2px solid rgba(125,167,255,.25);
    border-top-color:var(--accent); animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- 抽屉：分组与操作 ---------- */
  .dr-sec{display:flex; align-items:center; gap:8px; margin:14px 4px 5px; padding:6px 8px;
    border-radius:8px; cursor:pointer; transition:.2s}
  .dr-sec:first-child{margin-top:2px}
  .dr-sec:hover{background:rgba(255,255,255,.04)}
  .dr-sec span{font-size:10.5px; letter-spacing:.18em; color:var(--text3)}
  .dr-sec em{margin-left:auto; font-style:normal; font-size:10px; color:var(--text3); opacity:.7}
  .dr-sec.on{background:rgba(125,167,255,.1)}
  .dr-sec.on span{color:var(--accent2); font-weight:600}
  .dr-sec i{width:3px; height:12px; border-radius:2px; background:rgba(255,255,255,.14); flex:none}
  .dr-sec.on i{background:var(--accent)}
  .dr-sec .op{display:none; gap:2px; margin-left:4px}
  .dr-list.manage .dr-sec .op{display:flex}
  .dr-sec .op button{width:24px; height:24px; border-radius:6px; border:none; background:none;
    color:var(--text3); cursor:pointer; display:grid; place-items:center; font-size:12px}
  .dr-sec .op button:hover{background:rgba(255,255,255,.08); color:var(--text)}
  .dr-sec .op button.del:hover{color:#E8908C; background:rgba(232,144,140,.1)}
  .dr-gap{height:1px; background:rgba(255,255,255,.05); margin:10px 8px}
  .dr-acts{display:flex; gap:8px}
  .dr-acts button{flex:1; height:36px; border-radius:10px; font-family:inherit; font-size:11.5px;
    letter-spacing:.08em; cursor:pointer; border:1px solid rgba(255,255,255,.12);
    background:none; color:var(--text2); transition:.2s}
  .dr-acts button:hover{border-color:rgba(125,167,255,.45); color:var(--accent2); background:rgba(125,167,255,.08)}
  .dr-acts button.on{background:rgba(125,167,255,.16); border-color:rgba(125,167,255,.45); color:var(--accent2)}
  .dr-empty{padding:30px 10px; font-size:11.5px; color:var(--text3); line-height:1.9; text-align:center}

  /* ---------- 确认框 ---------- */
  .cfm{position:fixed; inset:0; z-index:985; display:grid; place-items:center; padding:26px;
    background:rgba(5,7,11,.62); opacity:0; pointer-events:none; transition:opacity .24s}
  .cfm.on{opacity:1; pointer-events:auto}
  .cfm-box{width:min(100%,320px); background:#1A212C; border:1px solid rgba(255,255,255,.1);
    border-radius:18px; padding:22px; box-shadow:0 24px 60px rgba(0,0,0,.6);
    transform:scale(.94); transition:transform .26s cubic-bezier(.22,.9,.24,1)}
  .cfm.on .cfm-box{transform:none}
  .cfm-t{font-size:14.5px; font-weight:600; letter-spacing:.02em}
  .cfm-d{margin-top:10px; font-size:12px; line-height:1.8; color:var(--text3)}
  .cfm-a{display:flex; gap:10px; margin-top:20px}
  .cfm-a button{flex:1; height:42px; border-radius:11px; font-family:inherit; font-size:13px; cursor:pointer}
  .cfm-c{background:none; border:1px solid rgba(255,255,255,.14); color:var(--text2)}
  .cfm-k{background:var(--accent); border:none; color:#0B1020; font-weight:700}
  .cfm-k.danger{background:#C9534F; color:#fff}

  /* ---------- 我的 ---------- */
  #s-me{background:radial-gradient(120% 80% at 50% -10%, #1A2130 0%, #12161F 52%, #0B0F15 100%)}
  .me-wrap{position:absolute; inset:0; overflow-y:auto; scrollbar-width:none;
    padding:calc(64px + env(safe-area-inset-top)) 18px calc(92px + env(safe-area-inset-bottom))}
  .me-wrap::-webkit-scrollbar{display:none}
  .me-inner{max-width:720px; margin:0 auto}
  .me-hero{display:flex; align-items:center; gap:14px; margin-bottom:22px}
  .me-ava{width:56px; height:56px; flex:none; border-radius:18px; display:grid; place-items:center;
    background:linear-gradient(150deg,#2E4A6E,#1B2530); color:#DCE6FA;
    font-family:Georgia,"Songti SC",serif; font-size:23px; font-weight:700;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14), 0 10px 24px rgba(0,0,0,.4)}
  .me-nm{display:flex; align-items:center; gap:8px; font-size:19px; font-weight:700;
    font-family:Georgia,"Songti SC",serif; letter-spacing:.02em}
  .me-nm .bd{font-size:9.5px; font-weight:400; letter-spacing:.16em; color:var(--accent2);
    border:1px solid rgba(125,167,255,.32); border-radius:20px; padding:2px 7px}
  .me-sub{margin-top:6px; font-size:11.5px; color:var(--text3); letter-spacing:.04em}
  .me-kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-bottom:14px}
  .me-kpi{background:rgba(255,255,255,.036); border:1px solid rgba(255,255,255,.06);
    border-radius:13px; padding:13px 8px; text-align:center}
  .me-kpi b{display:block; font-size:19px; font-weight:600; font-variant-numeric:tabular-nums;
    font-family:Georgia,"Songti SC",serif}
  .me-kpi span{display:block; margin-top:5px; font-size:10px; color:var(--text3); letter-spacing:.1em}
  .me-card{background:rgba(255,255,255,.034); border:1px solid rgba(255,255,255,.06);
    border-radius:16px; padding:16px 16px 15px; margin-bottom:12px}
  .me-h{display:flex; align-items:baseline; gap:10px; margin-bottom:14px}
  .me-h span{font-size:12.5px; font-weight:600; letter-spacing:.08em; color:var(--text)}
  .me-h em{margin-left:auto; font-style:normal; font-size:11px; color:var(--text3); letter-spacing:.04em}
  .me-chart{display:flex; align-items:flex-end; gap:7px; height:88px}
  .me-bar{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    gap:7px; height:100%}
  .me-bar i{width:100%; max-width:26px; border-radius:5px 5px 3px 3px;
    background:linear-gradient(180deg, rgba(125,167,255,.5), rgba(125,167,255,.16));
    min-height:3px; transition:height .5s cubic-bezier(.2,.8,.3,1)}
  .me-bar.today i{background:linear-gradient(180deg, var(--accent), rgba(125,167,255,.4))}
  .me-bar u{font-size:9.5px; color:var(--text3); text-decoration:none; letter-spacing:.04em}
  .me-bar.today u{color:var(--accent2)}
  .me-dist{height:9px; border-radius:5px; overflow:hidden; display:flex; gap:2px; background:rgba(255,255,255,.05)}
  .me-dist i{display:block; height:100%}
  .me-legend{display:flex; flex-wrap:wrap; gap:12px 18px; margin-top:13px}
  .me-legend div{display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--text3)}
  .me-legend s{width:7px; height:7px; border-radius:2px; text-decoration:none}
  .me-legend b{font-weight:400; color:var(--text2); font-variant-numeric:tabular-nums}
  .me-row{display:flex; align-items:center; gap:12px; padding:11px 2px; cursor:pointer;
    border-bottom:1px solid rgba(255,255,255,.045)}
  .me-row:last-child{border-bottom:none}
  .me-row:hover{background:rgba(255,255,255,.03)}
  .me-row .ri{width:30px; height:30px; flex:none; border-radius:9px; display:grid; place-items:center;
    background:rgba(255,255,255,.055); color:var(--text2)}
  .me-row .rt{flex:1; min-width:0; font-size:12.5px; color:var(--text)}
  .me-row .rt small{display:block; margin-top:3px; font-size:10.5px; color:var(--text3); letter-spacing:.03em}
  .me-row .rv{font-size:11px; color:var(--text3); flex:none; letter-spacing:.04em}
  .me-row.dg .rt{color:#E8908C}
  .me-prog{margin-bottom:13px}
  .me-prog:last-child{margin-bottom:0}
  .me-prog .pt{display:flex; align-items:baseline; gap:8px; font-size:12.5px; margin-bottom:7px}
  .me-prog .pt b{font-weight:500; color:var(--text)}
  .me-prog .pt small{margin-left:auto; font-size:10px; color:var(--text3)}
  .me-prog .pb{height:3px; border-radius:2px; background:rgba(255,255,255,.09); overflow:hidden}
  .me-prog .pb i{display:block; height:100%; background:var(--accent); border-radius:2px}
  .me-foot{text-align:center; font-size:10px; color:var(--text3); letter-spacing:.16em;
    margin:18px 0 6px; opacity:.6}

  /* ================= 侧边栏 ================= */
  .drawer-mask{
    position:fixed; inset:0; z-index:940; background:rgba(5,7,11,.62);
    opacity:0; pointer-events:none; transition:opacity .38s ease;
  }
  .drawer-mask.on{opacity:1; pointer-events:auto}
  .drawer{
    position:fixed; left:0; top:0; bottom:0; width:min(80vw,340px); z-index:950;
    display:flex; flex-direction:column;
    background:linear-gradient(180deg,#161C26 0%,#0F141B 100%);
    border-right:1px solid rgba(255,255,255,.08);
    box-shadow:26px 0 70px rgba(0,0,0,.6);
    transform:translateX(-103%);
    transition:transform .44s cubic-bezier(.22,.9,.24,1);
    padding-top:env(safe-area-inset-top);
  }
  .drawer.on{transform:none}
  .dr-head{padding:20px 18px 12px; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .dr-kicker{font-size:10px; letter-spacing:.22em; color:var(--text3)}
  .dr-title{margin-top:7px; font-size:19px; font-weight:700; letter-spacing:.01em;
    font-family:Georgia,"Songti SC",serif; display:flex; align-items:baseline; gap:8px}
  .dr-title span{font-size:11px; font-weight:400; color:var(--text3); letter-spacing:.08em}
  .dr-close{width:32px;height:32px;flex:none;margin-top:4px}
  .dr-list{flex:1; overflow-y:auto; padding:2px 10px 10px; scrollbar-width:none}
  .dr-list::-webkit-scrollbar{display:none}
  .dr-item{
    position:relative; display:flex; align-items:center; gap:12px;
    padding:9px 10px; border-radius:10px; cursor:pointer; transition:background .2s;
  }
  .dr-item:hover{background:rgba(255,255,255,.045)}
  .dr-item:active{background:rgba(255,255,255,.09)}
  .dr-item.on{background:rgba(125,167,255,.1)}
  .dr-item.on::before{
    content:""; position:absolute; left:3px; top:13px; bottom:13px; width:2px;
    border-radius:2px; background:var(--accent);
  }
  .dr-thumb{
    width:32px; height:42px; border-radius:4px; flex:none;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.1), 0 2px 8px rgba(0,0,0,.4);
  }
  .dr-thumb.letter{height:32px; display:grid; place-items:center;
    font-size:13px; font-weight:700; color:#fff; font-family:Georgia,"Songti SC",serif}
  .dr-txt{flex:1; min-width:0}
  .dr-t{font-size:13.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .dr-s{font-size:11px; color:var(--text3); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .dr-m{font-size:10px; color:var(--text3); flex:none; letter-spacing:.04em}
  .dr-item.on .dr-t{color:#fff}
  .dr-item.on .dr-m{color:var(--accent2)}
  .dr-foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom)); border-top:1px solid var(--line);
    font-size:10.5px; color:var(--text3); letter-spacing:.12em}
  .mark{animation:markPulse 2.1s ease}
  @keyframes markPulse{
    0%{outline:0 solid rgba(125,167,255,0); outline-offset:3px}
    10%{outline:2px solid rgba(125,167,255,.85); outline-offset:3px}
    52%{outline:2px solid rgba(125,167,255,.5); outline-offset:3px}
    100%{outline:0 solid rgba(125,167,255,0); outline-offset:3px}
  }

  /* ================= 电影 · 详情层 ================= */
  .mv-mask{
    position:fixed; inset:0; z-index:860; background:rgba(7,9,13,.93);
    opacity:0; transition:opacity .3s ease; will-change:opacity;
  }
  .mv-mask.on{opacity:1}
  @media (min-width:760px){ .mv-mask{background:rgba(7,9,13,.88)} }
  /* 卡片以“终态尺寸”创建，只动 transform：整个动画在合成层里完成，不触发布局与重绘 */
  .mv-card{
    position:fixed; z-index:870; overflow:hidden;
    display:flex; flex-direction:column; justify-content:flex-end; padding:13px;
    transform-origin:0 0; backface-visibility:hidden;
    box-shadow:0 26px 64px rgba(0,0,0,.66), 0 0 0 1px rgba(255,255,255,.08);
    will-change:transform, opacity;
  }
  .mv-card::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.62))}
  /* 收起时卡片文字先退场，否则会与恢复后的海报文字叠成重影 */
  .mv-card.closing .mv-pt,
  .mv-card.closing .mv-py{opacity:0; transition:opacity .1s linear}
  .mv-pt{position:relative;z-index:1;color:#fff;font-size:17px;font-weight:600;line-height:1.3;
    font-family:Georgia,"Songti SC",serif;text-shadow:0 1px 10px rgba(0,0,0,.5)}
  .mv-py{position:relative;z-index:1;color:rgba(255,255,255,.55);font-size:10px;margin-top:4px;letter-spacing:.08em}
  .mv-info{
    position:fixed; z-index:871; opacity:0;
    transform:translate3d(0,12px,0);
    transition:opacity .2s ease, transform .24s cubic-bezier(.4,0,.2,1);
    overflow-y:auto; scrollbar-width:none;
    will-change:transform, opacity;
  }
  .mv-info::-webkit-scrollbar{display:none}
  .mv-info.on{opacity:1; transform:translate3d(0,0,0)}
  .mv-info.compact .mv-tt{display:none}
  .mv-tt{font-size:23px; font-weight:700; letter-spacing:.01em; font-family:Georgia,"Songti SC",serif}
  .mv-meta{margin-top:9px; font-size:11.5px; color:var(--text2); letter-spacing:.09em}
  .mv-line{display:flex; gap:14px; margin-top:15px; font-size:12.5px}
  .mv-line i{font-style:normal; color:var(--text3); width:32px; flex:none; letter-spacing:.14em}
  .mv-line b{font-weight:400; color:var(--text2); line-height:1.55}
  .mv-desc{margin:19px 0 0; font-size:13px; line-height:1.9; color:#C4CDDB}
  .mv-x{margin-top:22px; padding:9px 20px; border-radius:30px; background:transparent;
    border:1px solid rgba(255,255,255,.16); color:var(--text2); font-size:12px;
    letter-spacing:.12em; font-family:inherit; cursor:pointer; transition:.2s}
  .mv-x:hover{background:rgba(255,255,255,.07); color:var(--text)}

  /* ===== 条目操作条：五个版块的详情界面共用 ===== */
  .itemops{display:flex; gap:9px; margin-top:20px; flex-wrap:wrap; align-items:center}
  .itemops button{
    height:34px; padding:0 17px; border-radius:17px; cursor:pointer;
    background:transparent; border:1px solid rgba(255,255,255,.16);
    color:var(--text2); font-size:12px; letter-spacing:.1em;
    font-family:inherit; transition:background .2s, color .2s, border-color .2s;
  }
  .itemops button:hover{background:rgba(255,255,255,.07); color:var(--text); border-color:rgba(255,255,255,.3)}
  .itemops button.danger:hover{background:rgba(240,120,120,.13); border-color:rgba(240,120,120,.5); color:#F2A0A0}
  .itemops .sep{flex:1; min-width:8px}
  .itemops .divider{width:1px; height:18px; flex:none; margin:0 2px; background:rgba(255,255,255,.14)}
  .itemops .mv-x{margin-top:0}

  /* 图集 / 剧集这类浮在画面上的场景，按钮底色要更实一点 */
  .itemops.solid button{background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.2)}
  .itemops.solid{justify-content:center}

  /* 阅读器里的「更多」浮层 */
  #imMenu{
    position:fixed; z-index:1200; min-width:146px; padding:6px;
    border-radius:13px; background:rgba(24,27,33,.96);
    border:1px solid rgba(255,255,255,.12); backdrop-filter:blur(14px);
    box-shadow:0 18px 46px rgba(0,0,0,.55);
    opacity:0; transform:translateY(-6px) scale(.97); transform-origin:top right;
    transition:opacity .16s ease, transform .18s cubic-bezier(.3,.9,.3,1);
  }
  #imMenu.on{opacity:1; transform:none}
  #imMenu button{
    display:block; width:100%; text-align:left; padding:9px 13px;
    border:0; border-radius:8px; background:transparent; color:var(--text2);
    font-size:12.5px; font-family:inherit; letter-spacing:.04em; cursor:pointer; transition:.15s;
  }
  #imMenu button:hover{background:rgba(255,255,255,.08); color:var(--text)}
  #imMenu button.danger:hover{background:rgba(240,120,120,.14); color:#F2A0A0}

  /* ===== 软键盘 =====
     iOS Safari 遇到字号 < 16px 的输入框会自动放大整个页面，收起键盘再缩回去，
     表现出来就是「点一下输入框卡一下、界面还跟着抖」。这里只在 iOS 上把输入框
     字号抬到 16px，其它平台保持原来的 13/14px 视觉。 */
  .fld input, .fld textarea, .match-q input, .dlg-i, .as-body input[type=text]{
    -webkit-tap-highlight-color:transparent;
  }
  @supports (-webkit-touch-callout: none){
    .fld input[type=text], .fld input[type=number], .fld textarea, .fld select,
    .match-q input, .dlg-i, .as-body input[type=text]{
      font-size:16px;
    }
  }
</style>
</head>

/* blob 引用 id：二进制统一放 IndexedDB，元数据里只存这个 id */
const bid = () => 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------------------------------------------------------------------
 * 存储抽象层 Store —— 迁移 Flutter 时对应仓库层（sqflite / 文件系统）
 *   元数据（JSON，小）  -> localStorage
 *   二进制（图片/电子书/海报原文件）-> IndexedDB
 *   业务代码只调 Store.saveMeta() / Store.putBlob() / Store.getBlob() / Store.resolveURL()
 * --------------------------------------------------------------------- */
const Store = (()=>{
  const LS_KEY = 'shijian.v1';
  const DB_NAME = 'shijian-blobs', STORE = 'blobs';
  let dbp = null;
  const urlCache = new Map();   // blobId -> objectURL（内存缓存，刷新后失效）

  function openDB(){
    if(dbp) return dbp;
    dbp = new Promise((res, rej)=>{
      if(!('indexedDB' in window)){ rej(new Error('no-idb')); return; }
      let r;
      try{ r = indexedDB.open(DB_NAME, 1); }catch(e){ rej(e); return; }
      r.onupgradeneeded = ()=>{ try{ r.result.createObjectStore(STORE); }catch(_){} };
      r.onsuccess = ()=> res(r.result);
      r.onerror = ()=> rej(r.error || new Error('idb-open'));
    });
    return dbp;
  }

  function putBlob(id, blob, name, mime){
    return new Promise(res=>{
      openDB().then(db=>{
        const t = db.transaction(STORE, 'readwrite');
        const s = t.objectStore(STORE);
        s.put({ id, blob, name: name || '', mime: mime || blob.type || '', size: blob.size }, id);
        t.oncomplete = ()=> res(true);
        t.onerror = ()=> res(false);
      }).catch(()=> res(false));
    });
  }
  function getBlob(id){
    if(!id) return Promise.resolve(null);
    return new Promise(res=>{
      openDB().then(db=>{
        const t = db.transaction(STORE, 'readonly');
        const r = t.objectStore(STORE).get(id);
        r.onsuccess = ()=> res(r.result && r.result.blob ? r.result.blob : null);
        r.onerror = ()=> res(null);
      }).catch(()=> res(null));
    });
  }
  function deleteBlob(id){
    if(!id) return Promise.resolve();
    return new Promise(res=>{
      openDB().then(db=>{
        const t = db.transaction(STORE, 'readwrite');
        t.objectStore(STORE).delete(id);
        t.oncomplete = ()=> res(true);
        t.onerror = ()=> res(false);
      }).catch(()=> res(false));
    });
  }
  /* 把 blobId 解析成可展示的 objectURL（带缓存） */
  async function resolveURL(id){
    if(!id) return '';
    if(urlCache.has(id)) return urlCache.get(id);
    const b = await getBlob(id);
    if(!b) return '';
    const u = URL.createObjectURL(b);
    urlCache.set(id, u);
    return u;
  }
  /* 元数据持久化 */
  function saveMeta(obj){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(obj)); }
    catch(e){ if(typeof toast === 'function') toast('存储空间不足，请先导出备份'); }
  }
  function loadMeta(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(_){ return null; }
  }
  function wipe(){
    try{ localStorage.removeItem(LS_KEY); }catch(_){}
    urlCache.forEach(u=>{ try{ URL.revokeObjectURL(u); }catch(_){} });
    urlCache.clear();
    return new Promise(res=>{
      openDB().then(db=>{
        const t = db.transaction(STORE, 'readwrite');
        t.objectStore(STORE).clear();
        t.oncomplete = ()=> res(true);
        t.onerror = ()=> res(false);
      }).catch(()=> res(false));
    });
  }
  async function usage(){
    try{
      if(navigator.storage && navigator.storage.estimate){
        const e = await navigator.storage.estimate();
        return e.usage || 0;
      }
    }catch(_){}
    return 0;
  }
  function requestPersist(){ try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(_){} }
  return { putBlob, getBlob, deleteBlob, resolveURL, saveMeta, loadMeta, wipe, usage, requestPersist };
})();

/* 写数据后统一调用：把元数据落到本地（二进制已由 Store.putBlob 落盘） */
function persist(){ Store.saveMeta(snapshot()); Store.requestPersist(); }

/* 封面 / 图片的引用有两种：本地 blobId，或一条直接可用的网络地址。
   海报下载失败时存的就是后者，统一从这里解析，别处不要再直接调 Store.resolveURL */
function mediaURL(ref){
  if(!ref) return Promise.resolve('');
  return /^(data:|https?:|blob:)/i.test(ref) ? Promise.resolve(ref) : Store.resolveURL(ref);
}

/* 启动时读回数据；首次运行用种子 */
function loadState(){
  const saved = Store.loadMeta();
  if(saved && Array.isArray(saved.books)){
    BOOKS.push(...(saved.books||[]));
    MOVIES.push(...(saved.movies||[]));
    TVS.push(...(saved.tv||saved.tvs||[]));
    PICS.push(...(saved.pics||[]));
    LINKS.push(...(saved.links||[]));
    PIC_CATS = (saved.cats && saved.cats.length) ? saved.cats.slice() : [];
  } else {
    BOOKS.push(...SEED_BOOKS);
    MOVIES.push(...SEED_MOVIES);
    TVS.push(...SEED_TVS);
    PICS.push(...SEED_PICS);
    LINKS.push(...SEED_LINKS);
    PIC_CATS = SEED_CATS.slice();
  }
  Store.requestPersist();
}

/* =====================================================================
 * 元数据 provider 抽象 —— 迁移 Flutter 时对应网络层（http 客户端 + 各源实现）
 *   统一入口 Providers.search(type, query) -> { list:[candidate], errors:[] }
 *   candidate 统一字段：title / year / overview / posterUrl / genre /
 *                       director / cast / duration / rating / lang / source / ext
 *   剧集默认 TVMaze（免 key，CORS 可用）；电影配 TMDB key（中文数据）或 OMDb key
 * ===================================================================== */
const Settings = (()=>{
  const K = 'shijian.settings.v1';
  let data = {};
  try{ data = JSON.parse(localStorage.getItem(K) || '{}'); }catch(_){ data = {}; }
  function save(){ try{ localStorage.setItem(K, JSON.stringify(data)); }catch(_){} }
  return {
    get(k){ return data[k]; },
    set(k, v){ data[k] = v; save(); },
    all(){ return Object.assign({}, data); }
  };
})();

/* 网络层：统一超时 + 统一代理，页面里任何地方都能直接用 */
function fetchTimeout(url, ms){
  const ctrl = new AbortController();
  const t = setTimeout(()=> ctrl.abort(), ms || 10000);
  return fetch(url, { signal: ctrl.signal }).finally(()=> clearTimeout(t));
}
/* 代理前缀：只要填了，影视 / 图书 / 封面下载全部走它，不再分源 */
function proxyURL(url){
  const p = (Settings.get('tmdbProxy')||'').trim().replace(/\/+$/,'');
  return p ? p + '/' + url : url;
}

const Providers = (()=>{
  function stripHtml(s){ const d = document.createElement('div'); d.innerHTML = String(s||''); return (d.textContent||'').replace(/\s+/g,' ').trim(); }

  const px = proxyURL;

  async function tvMaze(type, query){
    if(type !== 'tv') return null;
    const r = await fetchTimeout(px('https://api.tvmaze.com/search/shows?q=' + encodeURIComponent(query)));
    if(!r.ok) throw new Error('TVMaze 请求失败');
    const arr = await r.json();
    return (arr||[]).map(x=>{ const s = x.show || {};
      return { title:s.name, year: s.premiered ? s.premiered.slice(0,4) : '',
        overview: stripHtml(s.summary), posterUrl: (s.image && (s.image.original || s.image.medium)) || '',
        genre:(s.genres||[]).join(' / '), director:'', cast:'',
        duration: s.averageRuntime ? s.averageRuntime + ' 分钟' : '',
        rating: (s.rating && s.rating.average != null) ? s.rating.average.toFixed(1) : '',
        lang:s.language||'', source:'TVMaze', ext:{ id:s.id, imdb:(s.externals||{}).imdb||'' } };
    });
  }

  async function tmdb(type, query){
    const key = Settings.get('tmdbKey');
    if(!key) return null;
    const ep = type === 'tv' ? 'search/tv' : 'search/movie';
    const r = await fetchTimeout(px('https://api.themoviedb.org/3/' + ep + '?api_key=' + encodeURIComponent(key) + '&query=' + encodeURIComponent(query) + '&language=zh-CN'), 6000);
    if(!r.ok) throw new Error('TMDB 请求失败（检查 key 与代理）');
    const j = await r.json();
    return (j.results||[]).map(m=>({
      title: type==='tv' ? m.name : m.title,
      year: (m.release_date || m.first_air_date || '').slice(0,4),
      overview: m.overview || '', posterUrl: m.poster_path ? 'https://image.tmdb.org/t/p/w500' + m.poster_path : '',
      genre:'', director:'', cast:'', duration:'',
      rating: m.vote_average != null ? m.vote_average.toFixed(1) : '',
      lang: m.original_language || '', source:'TMDB', ext:{ id:m.id, type }
    }));
  }

  async function omdb(type, query){
    if(type !== 'movie') return null;
    const key = Settings.get('omdbKey');
    if(!key) return null;
    const r = await fetchTimeout(px('https://www.omdbapi.com/?apikey=' + encodeURIComponent(key) + '&s=' + encodeURIComponent(query) + '&type=movie'));
    const j = await r.json();
    if(j.Error) throw new Error('OMDb: ' + j.Error);
    return (j.Search||[]).map(m=>({
      title:m.Title, year: m.Year ? m.Year.slice(0,4) : '', overview:'',
      posterUrl: m.Poster && m.Poster !== 'N/A' ? m.Poster : '',
      genre:'', director:'', cast:'', duration:'', rating:'', lang:'',
      source:'OMDb', ext:{ imdb:m.imdbID }
    }));
  }

  /* 图书：Google Books，免 key、CORS 开放，支持 ISBN 与书名 */
  async function googleBooks(type, query){
    if(type !== 'book') return null;
    const r = await fetchTimeout(px('https://www.googleapis.com/books/v1/volumes?q=' + encodeURIComponent(query) + '&maxResults=8&country=US'), 6000);
    if(!r.ok) throw new Error('Google Books 请求失败');
    const j = await r.json();
    return (j.items||[]).map(it=>{ const v = it.volumeInfo || {};
      const isbn = ((v.industryIdentifiers||[]).map(x => x.type + ':' + x.identifier).join(', '));
      return {
        title:v.title || '',
        year: (v.publishedDate||'').slice(0,4),
        overview: (stripHtml(v.description || '') || '').slice(0, 300),
        posterUrl: ((v.imageLinks && (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail)) || '').replace(/^http:/, 'https:').replace(/zoom=\d+/, 'zoom=3'),
        genre:(v.categories||[]).join(' / '),
        director:'',
        cast:(v.authors||[]).join(' / '),
        duration: v.pageCount ? v.pageCount + ' 页' : '',
        rating: v.averageRating != null ? v.averageRating.toFixed(1) : '',
        lang: v.language || '',
        source:'Google Books',
        ext:{ isbn, publisher:v.publisher || '' }
      };
    });
  }

  /* 图书备用源：Open Library，免 key、CORS 开放（对 ISBN 与书名都支持） */
  async function openLibrary(type, query){
    if(type !== 'book') return null;
    const url = 'https://openlibrary.org/search.json?q=' + encodeURIComponent(query)
      + '&limit=8&fields=title,author_name,cover_i,first_publish_year,subject,number_of_pages_median,first_sentence,isbn';
    const r = await fetchTimeout(px(url), 6000);
    if(!r.ok) throw new Error('Open Library 请求失败');
    const j = await r.json();
    return (j.docs||[]).map(d=>({
      title:d.title || '',
      year: d.first_publish_year ? String(d.first_publish_year) : '',
      overview: ((d.first_sentence && d.first_sentence[0]) || '').slice(0, 300),
      posterUrl: d.cover_i ? ('https://covers.openlibrary.org/b/id/' + d.cover_i + '-L.jpg') : '',
      genre:(d.subject || []).slice(0,3).join(' / '),
      director:'',
      cast:(d.author_name || []).slice(0,2).join(' / '),
      duration: d.number_of_pages_median ? d.number_of_pages_median + ' 页' : '',
      rating:'', lang:'',
      source:'Open Library',
      ext:{ isbn:(d.isbn && d.isbn[0]) || '' }
    }));
  }

  /* 电影兜底：iTunes，免 key、CORS 开放（英文数据、海报质量高） */
  async function itunes(type, query){
    if(type !== 'movie') return null;
    const r = await fetchTimeout(px('https://itunes.apple.com/search?term=' + encodeURIComponent(query) + '&media=movie&entity=movie&limit=8'));
    if(!r.ok) throw new Error('iTunes 请求失败');
    const j = await r.json();
    return (j.results||[]).map(m=>({
      title:m.trackName || m.collectionName || '',
      year: (m.releaseDate||'').slice(0,4),
      overview: (m.longDescription || m.shortDescription || '').slice(0,300),
      posterUrl: m.artworkUrl100 ? String(m.artworkUrl100).replace(/100x100bb\.jpg$/,'600x600bb.jpg') : '',
      genre: m.primaryGenreName || '',
      director:'',
      cast: m.artistName || '',
      duration: m.trackTimeMillis ? Math.round(m.trackTimeMillis/60000) + ' 分钟' : '',
      rating:'', lang:'',
      source:'iTunes', ext:{ id:m.trackId }
    }));
  }

  async function search(type, query){
    query = (query||'').trim();
    if(!query) return { list:[], errors:[] };
    /* 图书两个源并行请求，谁先回谁的结果在前，避免串行等待 14 秒 */
    if(type === 'book'){
      const rs = await Promise.allSettled([googleBooks(type, query), openLibrary(type, query)]);
      const list = [], errors = [];
      rs.forEach(r=>{
        if(r.status === 'fulfilled' && Array.isArray(r.value)) list.push(...r.value);
        else if(r.status === 'rejected'){
          const e = r.reason;
          errors.push(e && e.name === 'AbortError' ? '超时' : ((e && e.message) || '失败'));
        }
      });
      return { list, errors };
    }
    const order = type === 'tv' ? ['tmdb','tvMaze'] : ['tmdb','omdb','itunes'];
    const impl = { tvMaze, tmdb, omdb, googleBooks, openLibrary, itunes };
    const list = [], errors = [];
    for(const name of order){
      try{
        const res = await impl[name](type, query);
        if(res == null) continue;
        if(Array.isArray(res)) list.push(...res);
      }catch(e){ errors.push((e && e.name === 'AbortError') ? (name + ' 超时') : ((e && e.message) || (name + ' 失败'))); }
    }
    return { list, errors };
  }

  /* 下载海报到 IndexedDB 返回 blobId；跨域/网络不行时退回原始 URL */
  async function fetchPoster(url){
    if(!url) return '';
    try{
      const r = await fetchTimeout(px(url));
      if(!r.ok) return url;
      const b = await r.blob();
      if(!b || !b.size) return url;
      const id = bid();
      await Store.putBlob(id, b, 'poster', b.type || 'image/jpeg');
      return id;
    }catch(_){ return url; }
  }

  return { search, fetchPoster, stripHtml };
})();
